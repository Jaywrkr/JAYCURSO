/* Profundización y casos · Bloques 1 y 2 */
Object.assign(X,{
transicion:{x:[
['Hay una forma práctica de ver el cambio: revisa tu calendario de las últimas dos semanas y clasifica cada bloque en tres tipos. **Hacer:** trabajo técnico u operativo que podría hacer otra persona. **Coordinar:** reuniones de seguimiento de proyectos. **Dirigir:** decisiones de rumbo, personas, clientes clave, fabricantes, números. Un PM típico tiene más del 60% en hacer y coordinar. Un gerente debería tener más de la mitad en dirigir.','El cambio no ocurre el día del nombramiento. Ocurre cuando empiezas a mover horas de una columna a la otra, y eso puede empezar hoy.'],
['Hay una cuarta trampa menos visible: **seguir siendo la persona que tiene todas las respuestas.** Si el equipo aprende que cualquier duda se resuelve preguntándote, nunca desarrolla criterio propio y tú te vuelves el cuello de botella. Una práctica útil: cuando alguien te trae un problema, pregunta primero "¿qué harías tú?". Si la respuesta es razonable, apruébala aunque tú lo habrías hecho distinto.','Las tres trampas tienen algo en común: dan alivio inmediato y costo a largo plazo. El gerente elige al revés.'],
['Las entrevistas de los primeros 30 días funcionan mejor con las mismas cinco preguntas para todos: ¿qué funciona bien y no deberíamos cambiar?, ¿qué es lo que más nos frena?, ¿qué oportunidad estamos dejando pasar?, ¿qué harías tú si fueras gerente?, ¿qué esperas de mí? Al comparar respuestas aparecen patrones que nadie te diría en una reunión grupal.','Watkins también insiste en diagnosticar el tipo de situación. No es lo mismo recibir una empresa que crece y necesita ordenarse que una que pierde margen y necesita un giro. En la primera el riesgo es cambiar demasiado; en la segunda, cambiar muy poco y muy tarde. Define en cuál estás antes de elegir tus victorias tempranas.']],
c:{t:'Satya Nadella en Microsoft, 2014',tag:'Caso real',p:[
'Cuando Satya Nadella asumió como CEO de Microsoft en febrero de 2014, venía de dirigir el negocio de servidores y nube. Era un ingeniero respetado, no un vendedor carismático. La empresa tenía una cultura interna conocida por la competencia entre áreas y por defender a Windows sobre todo lo demás.',
'Nadella hizo tres cosas en sus primeros meses. Escuchó: pasó semanas reuniéndose con equipos, clientes y socios antes de anunciar cambios. Definió una prioridad simple, "mobile first, cloud first", que todos podían repetir. Y cambió la cultura con una idea tomada de la psicóloga Carol Dweck: pasar de una empresa de "sabelotodos" a una de personas que siempre aprenden.',
'También tomó decisiones incómodas: publicar Office en iPhone y Android, competidores directos de Windows, y apostar por Azure aunque eso significara tratar a Linux como aliado. Esas decisiones contradecían años de cultura interna.'],
q:'Nadella era técnico como tú. ¿Qué hizo diferente de lo que haría un buen técnico promovido? ¿Qué parte de su enfoque puedes aplicar en tus primeros 90 días?'}},

foco:{x:[
['Hay otro costo menos visible: los proyectos abiertos ocupan memoria aunque no trabajes en ellos. La psicología lo llama efecto Zeigarnik: las tareas inconclusas siguen pidiendo atención en segundo plano. Por eso una lista larga de pendientes cansa aunque no avances en ninguno.','La solución no es trabajar más horas, sino cerrar o pausar formalmente. Un proyecto pausado con fecha de revisión deja de pedir atención porque ya tiene un lugar.'],
['Warren Buffett suele recomendar un ejercicio atribuido a él: escribe tus 25 objetivos, marca los 5 más importantes y trata los otros 20 como la lista de lo que debes evitar a toda costa. La anécdota puede ser apócrifa, pero la idea es útil: lo peligroso no es lo que no importa, sino lo que importa un poco y te roba tiempo de lo que importa mucho.','Aplicado a ti: el contenido de @jaywrkr, ANKLA, la música y los idiomas no compiten por ser malos, compiten por ser buenos. Por eso hay que decidir cuáles siguen con horario fijo y cuáles esperan.'],
['Una regla práctica para proteger los bloques de pensamiento: trátalos como una reunión con un cliente importante. No se mueven por urgencias internas; solo por emergencias reales. Si los mueves más de una vez al mes, el problema no es la agenda, es que todavía estás haciendo trabajo de otros.','Revisa tu energía igual que revisas tu agenda. Durante dos semanas anota en qué horas decides mejor. Ese patrón es tu horario de trabajo de gerente; lo demás va en las horas de menor energía.']],
c:{t:'Steve Jobs vuelve a Apple, 1997',tag:'Caso real',p:[
'Cuando Steve Jobs regresó a Apple en 1997, la empresa perdía dinero y vendía una gran variedad de computadoras, impresoras y dispositivos con nombres y versiones difíciles de distinguir. Ni los propios vendedores sabían recomendar cuál comprar.',
'Jobs dibujó en una pizarra una matriz de dos por dos: consumidor y profesional, escritorio y portátil. Apple haría un solo producto excelente en cada cuadrante. Todo lo demás se canceló, incluidos proyectos en los que equipos talentosos llevaban años trabajando.',
'Jobs explicó después que estaba tan orgulloso de lo que no hacían como de lo que hacían. El foco permitió poner a los mejores en pocos productos, y Apple volvió a ser rentable en poco tiempo.'],
q:'Si dibujas tu propia matriz de dos por dos con lo que haces hoy, ¿qué cuatro cosas quedarían? ¿Y en Coresolutions?'}},

decisiones:{x:[
['Hay una tercera categoría que conviene separar: decisiones **frecuentes y pequeñas**. Descuentos menores, compras de bajo monto, prioridades del día. No necesitan análisis, necesitan una regla. Una política escrita ("comercial aprueba hasta 5%") elimina cientos de consultas y libera tu tiempo para las decisiones de una vía.','Pregúntate cada semana: ¿qué decisión tomé que debería convertirse en regla para que no vuelva a llegar a mí?'],
['Para estimar probabilidades sin inventarlas, usa tasas base. Si de las últimas 20 licitaciones de un tipo ganaste 4, tu tasa base es 20%. Parte de ahí y ajusta por lo que tiene de especial esta oportunidad. Sin tasas base, las personas sobreestiman sistemáticamente sus probabilidades de ganar.','Por eso es tan valioso registrar resultados en CoreOportunidades, incluidas las oportunidades perdidas y la razón. Es la materia prima de tus futuras decisiones.'],
['Daniel Kahneman, premio Nobel de economía, describió varios sesgos que afectan a los gerentes. El **sesgo de confirmación**: buscar datos que confirman lo que ya crees. El **costo hundido**: seguir con algo porque ya invertiste mucho. El **exceso de confianza**: creer que tus estimaciones son más precisas de lo que son.','El antídoto es simple y poco usado: pide a alguien de confianza que argumente en contra de tu decisión favorita antes de tomarla. Si no puede encontrar buenos argumentos, la decisión es sólida. Si los encuentra, te ahorraste un error.']],
c:{t:'Intel abandona las memorias, 1985',tag:'Caso real',p:[
'A mediados de los años 80, Intel era sinónimo de chips de memoria. Era el negocio con el que se había fundado la empresa. Pero los fabricantes japoneses vendían memorias de buena calidad a precios que Intel no podía igualar, y la empresa perdía dinero.',
'Andy Grove cuenta que le preguntó a Gordon Moore: "Si nos echaran y la junta trajera un nuevo CEO, ¿qué crees que haría?". Moore respondió sin dudar: saldría del negocio de memorias. Grove dijo entonces: "¿Por qué no salimos tú y yo por la puerta, volvemos a entrar y lo hacemos nosotros?".',
'Intel abandonó las memorias y se concentró en microprocesadores. La decisión fue dolorosa y costó despidos y cierres de plantas, pero convirtió a Intel en una de las empresas más valiosas del mundo en la década siguiente.'],
q:'¿Qué negocio, servicio o costumbre de Coresolutions mantendrías solo por historia? ¿Qué haría un gerente nuevo que llegara sin ese apego?'}},

comunicacion:{x:[
['Una prueba sencilla para cualquier correo importante: si el lector solo lee el asunto y la primera línea, ¿sabe qué necesitas de él? Si no, reescribe. Los ejecutivos leen en el celular, entre reuniones, y deciden en segundos si un mensaje merece atención.','Pon la acción en el asunto: "Aprobar: servicio de migración VMware — decisión antes del viernes" funciona mejor que "Propuesta".'],
['El memo obliga a algo que las diapositivas permiten evitar: conectar las ideas con frases completas. En una diapositiva puedes poner "Mercado crece · Tenemos equipo · Margen 40%" sin explicar por qué eso lleva a tu recomendación. En un párrafo, el hueco se nota.','Escribe el memo, déjalo reposar una noche y léelo como si fueras el accionista más escéptico. Corta todo lo que no ayude a decidir.'],
['Con el equipo, la comunicación más importante no son los anuncios sino la consistencia. Si dices que la prioridad es el ingreso recurrente pero celebras solo las ventas grandes de hardware, el equipo creerá a tus actos, no a tus palabras.','Revisa qué reconoces en público, en qué pasas tu tiempo y qué preguntas haces en la reunión semanal. Eso es lo que el equipo entiende como prioridad real.']],
c:{t:'Amazon reemplaza las diapositivas, 2004',tag:'Caso real',p:[
'En 2004, Jeff Bezos envió un correo a su equipo directivo prohibiendo las presentaciones de diapositivas en las reuniones de dirección. En su lugar, quien proponía algo debía escribir un memo narrativo de hasta seis páginas.',
'Las reuniones empiezan con todos leyendo el memo en silencio durante 20 o 30 minutos. Después se discute. Así nadie finge haberlo leído y la discusión parte de la misma información.',
'Bezos argumentaba que una narrativa bien escrita obliga a pensar mejor: a entender qué es más importante y cómo se relacionan las ideas. Las viñetas permiten saltar sobre las conexiones difíciles. La práctica se volvió una de las marcas de la cultura de gestión de Amazon.'],
q:'¿Cuál fue la última decisión importante que se tomó en Coresolutions con diapositivas? ¿Habría cambiado algo con un memo de una página?'}},

contabilidad:{x:[
['Para un integrador, el estado de resultados total sirve poco si no se separa por línea de negocio. Una empresa puede tener 25% de margen bruto promedio y esconder una línea con 8% y otra con 45%. Las decisiones correctas salen del detalle.','Pide al contador que el costo de ventas se registre por línea: reventa de hardware, licencias, servicios profesionales, servicios recurrentes. Si hoy no es posible, ese es tu primer proyecto de gerente: sin esa separación, el resto de este programa trabaja con supuestos.'],
['Dos líneas del balance merecen atención especial en Coresolutions. **Inventario y anticipos a proveedores:** dinero que ya salió por equipos que aún no se facturan. **Anticipos de clientes:** dinero recibido por trabajo que aún no se entrega; es caja, pero también es deuda de trabajo.','Lee el balance comparando dos fechas. Una foto sola dice poco; la diferencia entre dos fotos dice dónde se fue el dinero.'],
['Hay una forma rápida de detectar problemas: compara la utilidad neta de los últimos tres años con el flujo operativo de los mismos años. Si la utilidad es consistentemente mayor que el flujo, la empresa está acumulando cuentas por cobrar o inventario. Tarde o temprano eso se convierte en un problema de caja o en cartera incobrable.','Pregunta también qué parte de las cuentas por cobrar tiene más de 180 días. Esa parte probablemente no es un activo real y debería provisionarse.']],
c:{t:'El integrador que ganó y no pudo pagar',tag:'Caso ilustrativo',p:[
'Un integrador mediano cerró su mejor año: ventas récord y la mayor utilidad de su historia. Tres proyectos públicos grandes explicaban el salto. Los accionistas aprobaron un reparto de dividendos y dos contrataciones senior.',
'En marzo del año siguiente la empresa no pudo pagar la nómina completa. Dos de las tres entidades públicas no habían pagado: una por un cambio de autoridades, otra por un trámite de recepción. Las cuentas por cobrar se habían duplicado y el mayorista exigía pago para liberar el siguiente pedido.',
'El estado de resultados decía que la empresa iba muy bien. El flujo operativo del año había sido negativo. Nadie lo había mirado porque el contador entregaba los estados financieros en abril.'],
q:'Si mañana te preguntan cuál fue el flujo operativo de Coresolutions el año pasado, ¿podrías responder? ¿Quién en la empresa lo sabe?'}},

caja:{x:[
['La cobranza es un proceso, no un acto. Las empresas que cobran bien tienen cinco pasos fijos: factura correcta y enviada el mismo día, confirmación de recepción, recordatorio antes del vencimiento, seguimiento el día del vencimiento y escalamiento definido después. Cada paso tiene responsable.','En clientes públicos, el paso clave es conocer el circuito interno: quién firma el acta, quién aprueba el pago y en qué sistema. Un integrador que conoce ese circuito cobra semanas antes que uno que solo llama al administrador del contrato.'],
['Hay una regla útil para decidir cuánta caja mantener: al menos dos o tres meses de gasto fijo, más el capital de trabajo de los proyectos en curso. Con menos, cualquier retraso de un cliente grande se convierte en crisis.','La caja ociosa tiene costo, pero la falta de caja cuesta mucho más: obliga a aceptar crédito caro, a pagar tarde a proveedores y a tomar decisiones apuradas.'],
['La proyección de 13 semanas tiene una ventaja sobre el presupuesto: es concreta. No dice "ventas del trimestre", dice "el martes 14 cobramos $42.000 de esta factura". Eso permite detectar problemas con semanas de anticipación.','Empieza simple: una hoja con una fila por semana y columnas de cobros, pagos y saldo. Compara cada lunes lo proyectado contra lo real. En dos meses tendrás una idea muy precisa de cuánto se desvían tus estimaciones de cobro.']],
c:{t:'Carillion, 2018',tag:'Caso real',p:[
'Carillion era una de las mayores contratistas de servicios y obras para el Estado británico: hospitales, escuelas, cárceles, ferrocarriles. Empleaba a decenas de miles de personas y facturaba miles de millones de libras al año.',
'En enero de 2018 entró en liquidación. Las investigaciones posteriores del Parlamento británico señalaron varias causas: contratos públicos ganados con márgenes muy bajos, sobrecostos en proyectos grandes, deuda creciente, dividendos pagados mientras la caja se deterioraba y plazos de pago muy largos a sus propios subcontratistas para sostener la liquidez.',
'Carillion mostraba utilidades en sus estados financieros hasta poco antes del colapso. El problema era la caja y el riesgo de contratos que parecían rentables en el papel.'],
q:'¿Cuántos de tus proyectos públicos actuales tienen el margen y la caja calculados después de multas, garantías y plazos reales de cobro?'}},

inversion:{x:[
['El valor presente también sirve para comparar formas de pago. Si un cliente ofrece pagar $100.000 hoy o $110.000 en 12 meses, al 14% los $110.000 futuros valen hoy $96.491. Conviene cobrar hoy aunque sea menos.','Esto es especialmente útil al negociar plazos con clientes públicos o descuentos por pronto pago con mayoristas.'],
['Al construir los flujos, usa flujos incrementales: solo lo que cambia por hacer la inversión. Si contratas un ingeniero para servicios gestionados, el flujo es la utilidad bruta adicional que genera menos su costo, no la facturación total del área.','Y sé conservador con el primer año. Casi todas las inversiones tardan más de lo previsto en producir: el ingeniero necesita meses para ser productivo, el servicio nuevo tarda en venderse.'],
['El análisis de sensibilidad es la herramienta que convierte una hoja de cálculo en una decisión. Pregunta: ¿qué variable, si cambia 20%, vuelve negativo el VAN? Si la respuesta es "el precio de venta", tu riesgo está en el mercado. Si es "el uso de las GPUs", tu riesgo está en la demanda.','Concentra tu análisis y tus preguntas a los clientes en esa variable crítica antes de invertir.']],
c:{t:'Blockbuster y Netflix, 2000',tag:'Caso real',p:[
'En el año 2000, Reed Hastings, fundador de Netflix, se reunió con los directivos de Blockbuster en Dallas. Netflix era una empresa pequeña que alquilaba DVD por correo y perdía dinero. Hastings propuso que Blockbuster comprara Netflix por cerca de 50 millones de dólares y la convirtiera en su negocio en línea.',
'Según el relato de Marc Randolph, cofundador de Netflix, los directivos de Blockbuster no tomaron en serio la propuesta. Blockbuster tenía miles de tiendas y ganaba mucho con las multas por devolución tardía.',
'Desde la lógica del negocio de ese momento, la decisión parecía razonable. Pero Blockbuster evaluó la inversión con los flujos de su negocio actual y no como una opción sobre el futuro. Blockbuster quebró en 2010. Netflix se convirtió en una de las mayores empresas de entretenimiento del mundo.'],
q:'¿Qué inversión pequeña en Coresolutions hoy funcionaría como una opción sobre el futuro, aunque su VAN con los números actuales sea dudoso?'}},

presupuesto:{x:[
['Un error frecuente es presupuestar ventas sin calcular la capacidad de entrega. Si el presupuesto requiere 30% más proyectos con el mismo equipo, la utilización tendría que pasar de 60% a 78%. ¿Es posible? Si no, el presupuesto necesita contrataciones, y esas contrataciones cambian el gasto fijo.','Un presupuesto coherente cuadra tres cosas: ventas, capacidad del equipo y caja.'],
['Al construir escenarios, evita que el pesimista sea solo "10% menos de todo". Los escenarios útiles tienen causas concretas: "perdemos el cliente más grande", "el Estado paga a 150 días", "un fabricante cambia su programa de partner". Cada causa tiene una respuesta distinta.','Para cada causa, escribe la primera señal que te avisaría con tiempo. Esa señal es lo que vigilas en la reunión mensual.'],
['La revisión mensual es más útil si la explicación de cada desviación sigue un formato fijo: qué pasó, por qué, es puntual o se repetirá, y qué se hace. Así la reunión no se convierte en una lista de excusas.','Al tercer mes de la misma desviación, deja de ser una desviación: es la nueva realidad, y el forecast debe ajustarse.']],
c:{t:'Handelsbanken sin presupuestos',tag:'Caso real',p:[
'En los años 70, Jan Wallander, director del banco sueco Handelsbanken, eliminó el presupuesto anual tradicional. Su argumento: los presupuestos se vuelven negociaciones internas donde cada área pide de más y promete de menos, y fijan metas que quedan obsoletas en pocos meses.',
'En su lugar, el banco dio autonomía a cada sucursal y la midió contra sus pares: costo por cliente, rentabilidad y satisfacción, comparados con otras sucursales y con la competencia. Las proyecciones se usaban para anticipar, no para controlar.',
'Handelsbanken fue durante décadas uno de los bancos más eficientes y estables de Europa. El caso inspiró el movimiento Beyond Budgeting.'],
q:'No necesitas eliminar el presupuesto. Pero ¿qué parte del presupuesto de Coresolutions se ha vuelto una negociación y no una herramienta?'}},

precios:{x:[
['Antes de fijar precios, conoce tu costo real por hora de ingeniero. No es el sueldo dividido por horas: incluye aportes, décimos, fondos de reserva, herramientas, capacitación y la proporción de horas no facturables. Con 65% de utilización, cada hora facturada debe cubrir el costo de 1,5 horas pagadas.','Muchos integradores fijan tarifas con el sueldo y creen que ganan 40% cuando en realidad ganan 10%.'],
['El precio por valor necesita una conversación distinta con el cliente. En vez de presentar horas y equipos, presentas el problema y su costo para él. "Una caída de 8 horas en su sistema core un viernes de pago le cuesta cerca de $40.000 en operación y reputación. Nuestro servicio reduce ese riesgo por $1.500 al mes."','Para cuantificar, usa los datos del propio cliente: transacciones por hora, personal detenido, multas regulatorias, clientes perdidos.'],
['La política de descuentos debe ser pública dentro del equipo comercial y aplicarse siempre. Si un vendedor sabe que insistiendo consigue una excepción del gerente, la política deja de existir.','Registra cada descuento dado: a quién, cuánto, qué se recibió a cambio y quién lo aprobó. Revisarlo cada trimestre muestra rápidamente si el descuento se volvió costumbre.']],
c:{t:'Michelin vende kilómetros, no llantas',tag:'Caso real',p:[
'A comienzos de los años 2000, Michelin lanzó en Europa un servicio para flotas de camiones: en lugar de vender llantas, cobraba por kilómetro recorrido. Michelin se encargaba de la instalación, el mantenimiento, el reencauche y el reemplazo.',
'El cliente pagaba por el resultado que le importaba, kilómetros rodados sin problemas, y no por un producto. Michelin, que conocía mejor que nadie cómo hacer durar sus llantas, capturaba el valor de ese conocimiento.',
'El modelo convirtió una venta de producto en un ingreso recurrente y alineó los incentivos: a Michelin le convenía que las llantas duraran más, igual que al cliente.'],
q:'¿Qué servicio de Coresolutions podría cobrarse por resultado (disponibilidad, horas sin caída, tiempo de recuperación) en vez de por equipos u horas?'}},

valuacion:{x:[
['Los compradores también ajustan el EBITDA antes de aplicar el múltiplo. Quitan ingresos que no se repetirán, como un proyecto extraordinario, y suman o restan gastos que no reflejan la operación normal, como un sueldo del dueño muy por encima o por debajo del mercado. El resultado se llama EBITDA ajustado o normalizado.','Si algún día se valora Coresolutions, tener los números limpios y separados por línea vale dinero en esa negociación.'],
['Una forma práctica de pensar el valor: cada dólar de ingreso recurrente con contrato vale varias veces más que un dólar de proyecto, porque el comprador puede contar con él. Por eso las empresas de servicios gestionados suelen valorarse con múltiplos más altos que los revendedores.','No necesitas vender la empresa para que esto importe. Los bancos usan la misma lógica para darte crédito, y los accionistas para evaluar tu gestión.'],
['La dependencia de personas es el riesgo de valor más común en empresas de servicios medianas. Si los clientes clave tienen relación solo con una persona y el conocimiento técnico crítico está en dos ingenieros, un comprador descuenta ese riesgo.','Cada proceso documentado, cada relación de cliente compartida entre dos personas y cada certificación repartida en el equipo aumenta el valor de la empresa.']],
c:{t:'Mismo EBITDA, distinto valor',tag:'Caso ilustrativo',p:[
'Dos integradores de tamaño parecido generan cada uno $300.000 de EBITDA. El primero obtiene 90% de su utilidad de reventa y proyectos; su mayor cliente pesa 30% y el fundador lleva todas las relaciones comerciales.',
'El segundo obtiene 40% de su utilidad de contratos de servicios gestionados a 3 años, ningún cliente pesa más de 10% y tiene un equipo comercial y técnico que opera sin el fundador.',
'Un comprador podría ofrecer por el primero 3 o 4 veces su EBITDA. Por el segundo, 6 o más. La diferencia, cerca de un millón de dólares, no viene de cuánto ganan este año, sino de cuán seguro es que lo sigan ganando.'],
q:'¿Cuál de los dos se parece más a Coresolutions hoy? ¿Qué tres cambios la acercarían al segundo?'}}
});

economia:{x:[
['La balanza de pagos es el registro de todos los dólares que entran y salen del país. En Ecuador conviene mirarla como mirarías la caja de una empresa: si la cuenta corriente tiene superávit, entran más dólares por comercio y remesas de los que salen. El Banco Central proyecta para 2026 un superávit en cuenta corriente cercano a $4.587 millones.','Un superávit sostenido alimenta los depósitos bancarios y el crédito. Un déficit sostenido, si no se cubre con inversión o deuda, drena liquidez.'],
['Conviene distinguir tres tipos de cliente público. **Gobierno central y ministerios:** dependen directamente de la caja fiscal y son los primeros en atrasarse. **Gobiernos locales:** dependen de transferencias del gobierno central, con retrasos frecuentes. **Empresas públicas con ingresos propios:** eléctricas, telecomunicaciones o empresas municipales de agua; suelen pagar mejor, aunque también sienten los recortes.','Una cartera pública sana mezcla los tres y no depende de uno solo.'],
['Un indicador poco mirado y muy útil es el de atrasos del Estado con proveedores. Cuando sube, tus clientes públicos van a pagar más tarde aunque el contrato diga otra cosa. Publicaciones económicas del país lo informan periódicamente con datos del Ministerio de Economía y Finanzas.','Otro es la tasa de interés activa para empresas. Si sube, tus clientes privados posponen inversiones financiadas con crédito, y tu propia línea de crédito se encarece.']],
c:{t:'De la crisis de 1999 a la dolarización',tag:'Caso real',p:[
'En 1998 y 1999 Ecuador sufrió una combinación de golpes: el fenómeno de El Niño destruyó cosechas e infraestructura en la Costa, cayó el precio del petróleo y varios bancos quebraron. En marzo de 1999 el gobierno congeló los depósitos bancarios, el llamado feriado bancario.',
'El sucre perdió valor muy rápido y la inflación se disparó. En enero de 2000, el presidente Jamil Mahuad anunció la dolarización a un tipo de cambio de 25.000 sucres por dólar.',
'La dolarización trajo estabilidad de precios y eliminó el riesgo cambiario, pero también quitó al país la posibilidad de devaluar o emitir moneda en una crisis. Desde entonces, la economía se ajusta por liquidez: cuando faltan dólares, se aprietan el crédito, el gasto público y los pagos.'],
q:'El Banco Central evalúa un posible El Niño en 2027. ¿Qué haría distinto Coresolutions si supiera hoy que va a ocurrir?'}},

energia:{x:[
['Hay dos conceptos técnicos que todo cliente debería conocer y que convierten la conversación en negocio. **RTO**, tiempo objetivo de recuperación: cuánto tiempo puede estar caído un sistema. **RPO**, punto objetivo de recuperación: cuántos datos se pueden perder. Un banco puede aceptar 1 hora de RTO y casi cero de RPO; una fábrica, 8 horas y un día de datos.','Cuando el cliente define su RTO y RPO, la solución técnica y el presupuesto salen casi solos. Y el cliente entiende por qué cuesta lo que cuesta.'],
['Revisa tus contratos de servicio con una pregunta: si mañana hay un corte de 48 horas en tu oficina o en tu cloud propio, ¿qué cláusulas incumples? Muchos contratos prometen disponibilidad sin excepción por fuerza mayor eléctrica clara.','Ajustar esas cláusulas en las renovaciones, o invertir en respaldo para cumplirlas, es gestión de riesgo básica.'],
['La oportunidad no se limita a hardware de respaldo. Los servicios con más margen alrededor de la crisis eléctrica son: análisis de impacto en el negocio, diseño de planes de continuidad, pruebas periódicas de recuperación y monitoreo del estado de respaldos. Todos se pueden vender como servicio recurrente.','La prueba de recuperación periódica es especialmente valiosa: la mayoría de empresas tiene respaldos que nunca ha probado restaurar.']],
c:{t:'Los apagones de 2024',tag:'Caso real',p:[
'Entre septiembre y diciembre de 2024, la sequía redujo la generación hidroeléctrica de Ecuador y el país sufrió cortes programados de electricidad que llegaron hasta 14 horas diarias en algunas zonas.',
'Las empresas que tenían planes de continuidad, generadores dimensionados y sistemas en sitios alternos siguieron operando con costos más altos. Las que no, perdieron días de producción y ventas, y muchas compraron equipos de emergencia a precios altos y con plazos de entrega largos.',
'La lección para un integrador: la demanda de continuidad aparece de golpe cuando la crisis ya empezó, y quien tiene la oferta preparada y la confianza del cliente captura la mayor parte.'],
q:'Si el estiaje de este año se complica en noviembre, ¿tienes hoy una oferta lista, un precio y una lista de clientes a quienes llamar?'}},

compras:{x:[
['Antes de decidir si participar, lee el pliego con cuatro preguntas: ¿el presupuesto referencial deja margen después de garantías, contribución y costo financiero?, ¿los plazos de entrega son realistas con los tiempos de importación?, ¿las multas son proporcionadas?, ¿la forma de pago incluye anticipo?','Si dos de las cuatro respuestas son negativas, la licitación probablemente no vale la pena aunque puedas ganarla.'],
['El proceso tiene una etapa de preguntas y aclaraciones. Es tu oportunidad para corregir especificaciones que favorecen a un competidor, aclarar plazos imposibles o pedir cambios en la forma de pago. Muchos proveedores no la usan y luego ofertan con riesgos que pudieron reducir.','Las respuestas de la entidad se publican y forman parte del proceso, así que ayudan a todos los oferentes, pero el que pregunta bien entiende mejor el proceso.'],
['Lleva un registro de cada proceso público: entidad, tipo, presupuesto, oferentes, precio ganador, si ganaste y por qué perdiste. Con 20 o 30 registros sabrás qué tipo de proceso ganas, contra quién y a qué precio.','Ese registro es la tasa base para decidir en qué licitaciones invertir el tiempo de preventa, que es caro y escaso.']],
c:{t:'La licitación que convenía perder',tag:'Caso ilustrativo',p:[
'Un integrador evaluaba un proceso de renovación de infraestructura por $900.000 con una entidad del gobierno central. El presupuesto referencial era ajustado: para ser competitivo, el margen bruto quedaba en 9%. El pliego exigía entrega en 45 días, con multas diarias, y no tenía anticipo.',
'El equipo comercial quería participar: era el proceso más grande del año. El gerente pidió calcular la brecha de caja, el costo de la garantía, el plazo real de importación y el riesgo de multa.',
'El cálculo mostró que, con 90 días de cobro y una semana de retraso en importación, el margen final quedaba bajo 3%. La empresa no participó. El ganador entregó tarde, pagó multas y cobró seis meses después.'],
q:'¿Qué criterio escrito usa hoy Coresolutions para decidir no participar en una licitación?'}},

legal:{x:[
['El costo laboral tiene un componente que muchos olvidan al presupuestar: el 15% de las utilidades. En un año bueno, ese pago puede ser significativo y sale de la caja en abril. Hay que reservarlo durante el año, no esperar al cierre.','También conviene revisar el régimen de horas extra y trabajo en fines de semana, frecuente en ventanas de mantenimiento: tiene recargos que deben estar en el costo del proyecto.'],
['Una práctica útil con las retenciones: lleva un control mensual de los comprobantes de retención recibidos y verifica que coincidan con lo que el cliente declaró. Las diferencias son comunes y, si no se reclaman a tiempo, se pierde el crédito tributario.','Si tu empresa acumula crédito tributario de IVA de forma constante, revisa con tu contador si procede solicitar devolución. Es caja que te pertenece.'],
['La ley de protección de datos distingue entre responsable del tratamiento, quien decide para qué se usan los datos, y encargado, quien los trata por cuenta de otro. Cuando Coresolutions administra servidores o respaldos de un cliente, normalmente actúa como encargado.','Eso implica obligaciones concretas: un contrato que regule el tratamiento, medidas de seguridad adecuadas y notificar al cliente si hay una brecha. Revisa que tus contratos de servicio incluyan esas cláusulas.']],
c:{t:'La SPDP sanciona a LigaPro y la FEF',tag:'Caso real',p:[
'La Superintendencia de Protección de Datos Personales emitió sus primeras sanciones administrativas contra la Liga Profesional de Fútbol del Ecuador y la Federación Ecuatoriana de Fútbol, por el manejo de datos en sus aplicaciones Fan ID y Fan FEF.',
'El problema central fue la validez del consentimiento de los usuarios. LigaPro recibió una multa de $259.644,01 y la orden de notificar a 14.398 titulares que su consentimiento no era válido y de eliminar los datos afectados. La FEF recibió una multa de $194.856,16, con la obligación de actualizar su registro de actividades de tratamiento, implementar una política de protección de datos y eliminar datos.',
'Las sanciones muestran que la autoridad ya actúa, que las multas son altas y que también se ordenan medidas correctivas costosas.'],
q:'¿Cuáles de tus clientes manejan muchos datos personales y todavía no tienen un programa de cumplimiento? ¿Quién en Coresolutions podría liderar esa oferta?'}},

mercado:{x:[
['Una forma práctica de priorizar sectores es calificar cada uno de 1 a 5 en cuatro criterios: tamaño del gasto en TI, urgencia regulatoria, capacidad de pago y tu ventaja actual (casos, relaciones, certificaciones). El sector con mayor puntaje total es donde concentras preventa y marketing.','Esta matriz evita una trampa común: perseguir el sector más grande donde no tienes ventaja, en vez del mediano donde ya eres conocido.'],
['La amenaza de sustitutos merece atención especial. Cada vez que un cliente evalúa nube pública en vez de infraestructura propia, el integrador puede perder la venta de hardware. Pero si ofrece migración, gestión de nube híbrida y optimización de costos, gana un servicio.','La pregunta estratégica no es "nube o no nube", sino "¿qué servicios necesita el cliente en cualquiera de los dos casos?".'],
['Para entrar a Quito o Guayaquil, el camino de menor riesgo suele ser seguir a tus clientes actuales que tienen operaciones allá, apoyarte en fabricantes que necesitan cobertura y llegar con una especialidad clara. Llegar como "otro integrador más" es caro y lento.','Mide el avance con indicadores concretos: oportunidades calificadas, reuniones con decisores y primer contrato en 12 meses.']],
c:{t:'Mapa de competencia en el Austro',tag:'Caso ilustrativo',p:[
'Un integrador regional analizó sus últimas 30 oportunidades perdidas. Encontró tres patrones. En hardware y licencias perdía contra dos competidores nacionales que tenían mejor precio por volumen. En proyectos de seguridad perdía contra una empresa especializada de Quito con más casos en banca. En proyectos de continuidad casi no perdía, porque era el único con casos locales probados.',
'Con ese mapa cambió su enfoque: dejó de perseguir licitaciones de hardware puro, invirtió en dos certificaciones de seguridad y en casos de éxito con cooperativas, y convirtió la continuidad en su oferta de entrada a clientes nuevos.',
'El análisis tomó dos semanas y se hizo con información que la empresa ya tenía.'],
q:'¿Tienes registradas las razones de las oportunidades perdidas del último año? ¿Qué patrón crees que aparecería?'}},

canal:{x:[
['Hay una diferencia importante entre fabricantes con canal abierto y fabricantes con canal selectivo. En los primeros, cualquier integrador puede vender y el precio se vuelve la variable principal. En los segundos, el fabricante limita cuántos partners tiene por zona o segmento y protege más el margen.','Cuando un fabricante pasa de abierto a selectivo, como ocurrió en varios programas en los últimos años, quedar dentro es una ventaja grande y quedar fuera puede cerrar una línea de negocio.'],
['Los mayoristas son más que logística. Ofrecen crédito, financiamiento a clientes, soporte de preventa, laboratorios y a veces fondos de marketing propios. Negocia con ellos un acuerdo anual: plazo de pago, límite de crédito, apoyo de preventa y condiciones para proyectos grandes.','Tener dos mayoristas por marca importante te da alternativa en la negociación y en caso de falta de stock.'],
['Prepara cada reunión trimestral con el fabricante como una revisión de cuenta: lo que vendiste, oportunidades registradas, certificaciones logradas, casos de éxito y lo que necesitas de ellos. Llega con un pedido concreto.','Los gerentes de canal tienen metas propias. Si entiendes qué necesitan cumplir este trimestre, puedes ofrecer algo que les sirva a cambio de lo que tú necesitas.']],
c:{t:'Broadcom compra VMware, 2023',tag:'Caso real',p:[
'Broadcom cerró la compra de VMware en noviembre de 2023. En los meses siguientes cambió el modelo comercial: terminó con las licencias perpetuas, pasó a suscripciones, consolidó la oferta en pocos paquetes y redefinió el programa de partners, dejando a muchos integradores fuera o con nuevas exigencias.',
'Para muchos clientes, el costo de renovación subió de forma importante. Para los integradores, hubo dos caminos: quienes quedaron dentro del programa y supieron explicar los cambios ganaron proyectos de licenciamiento, optimización y migración a VCF; otros perdieron la línea o vieron cómo sus clientes evaluaban alternativas.',
'El caso muestra el poder de un proveedor concentrado y por qué un integrador necesita diversificar marcas y tener una oferta de servicios que no dependa de un solo fabricante.'],
q:'Si mañana otro de tus fabricantes principales cambiara su programa como lo hizo Broadcom, ¿qué parte de la utilidad de Coresolutions estaría en riesgo?'}},

modelos:{x:[
['Para saber qué modelo es hoy Coresolutions, no mires la facturación sino la utilidad bruta. Una empresa que factura 70% en hardware pero obtiene 50% de su utilidad de servicios ya es, en buena medida, una empresa de servicios.','Ese cálculo cambia la conversación con los accionistas: muestra dónde está realmente el negocio.'],
['Un MSP sano tiene métricas que un integrador de proyectos rara vez mide: tiempo de primera respuesta, tiempo de resolución, tickets por cliente, cumplimiento del nivel de servicio y satisfacción. Sin ellas, no puedes demostrar el valor ni mejorar el margen.','Empieza midiendo dos: tiempo de respuesta y tickets por cliente por mes. Te dirán qué contratos son rentables y cuáles consumen más de lo que pagan.'],
['La transición tiene un riesgo financiero: los servicios recurrentes empiezan pequeños y tardan en reemplazar los ingresos de proyectos. Durante uno o dos años, la empresa invierte en personas y herramientas para un ingreso que todavía es menor.','Por eso conviene financiar la transición con la caja de los proyectos actuales, con metas trimestrales de crecimiento del ingreso recurrente, y no abandonar el negocio actual antes de tiempo.']],
c:{t:'IBM con Lou Gerstner, 1993',tag:'Caso real',p:[
'Cuando Lou Gerstner llegó como CEO de IBM en 1993, la empresa perdía miles de millones de dólares al año y se discutía dividirla en varias compañías independientes. El plan anterior era separar las divisiones de hardware para que compitieran por su cuenta.',
'Gerstner hizo lo contrario: mantuvo la empresa unida y apostó por algo que sus clientes le pedían, una sola empresa que integrara tecnologías de distintos fabricantes y se responsabilizara del resultado. Así creció IBM Global Services, que se convirtió en el mayor negocio de la empresa.',
'IBM pasó de vender principalmente hardware a vender servicios e integración. Gerstner contó la historia en su libro "¿Quién dijo que los elefantes no pueden bailar?".'],
q:'¿Qué te piden hoy los clientes de Coresolutions que no está en ningún catálogo de fabricante?'}},

recurrente:{x:[
['Hay una métrica que conecta ventas y recurrencia: el valor de vida del cliente. Si un contrato de $1.200 al mes dura en promedio 4 años con 55% de margen, el cliente vale cerca de $31.700 en utilidad bruta. Eso define cuánto puedes invertir para conseguirlo.','Si conseguir ese cliente cuesta $3.000 en preventa y descuentos iniciales, la inversión se recupera en menos de 5 meses.'],
['Al productizar, define también el proceso interno de entrega: quién hace qué cada mes, con qué herramienta y en cuánto tiempo. Si el informe mensual depende de que una persona se acuerde, el servicio no escala.','El informe de Quski funciona porque está automatizado. Ese es el patrón: el entregable mensual se genera con mínima intervención manual.'],
['La renovación se gana durante el año, no al final. Una revisión trimestral con el cliente, con datos de lo que el servicio evitó o mejoró, convierte la renovación en un trámite.','Prepara una alerta 90 días antes de cada vencimiento. Si la primera conversación de renovación ocurre la semana del vencimiento, ya estás negociando en desventaja.']],
c:{t:'Hilti Fleet Management',tag:'Caso real',p:[
'Hilti, fabricante de herramientas profesionales para construcción, vendía taladros y equipos a constructoras. A inicios de los 2000 lanzó un servicio distinto: en vez de vender las herramientas, las entregaba por una tarifa mensual fija que incluía reparaciones, reemplazos, actualizaciones y control de inventario.',
'Para el cliente, el beneficio era previsibilidad y menos tiempo perdido por herramientas dañadas. Para Hilti, era ingreso recurrente, una relación más cercana con el cliente y una barrera para la competencia.',
'La transición fue difícil: los vendedores estaban acostumbrados a vender productos y tuvieron que aprender a vender un servicio. El cambio requirió nuevos sistemas, nuevos incentivos y paciencia financiera, pero el servicio se convirtió en una parte central del negocio de Hilti.'],
q:'¿Qué parte de lo que Coresolutions vende hoy como proyecto podría entregarse como servicio mensual con todo incluido?'}},

tendencias:{x:[
['El cambio de licencias empuja a muchos clientes a revisar su arquitectura. Para un integrador con equipo certificado en VCF y experiencia con otras plataformas, la mejor posición es la del asesor neutral: evaluar costos a 3 años de cada opción y recomendar lo que conviene al cliente.','Ese rol genera confianza y proyectos en cualquiera de los caminos que el cliente elija.'],
['En IA empresarial, las preguntas que los clientes necesitan responder son parecidas en ambos caminos: qué casos de uso tienen valor, qué datos son sensibles, quién usará la herramienta, cómo se mide el resultado y cuánto costará a escala.','Un servicio de diagnóstico que responda esas preguntas es la puerta de entrada a cualquiera de las dos líneas. Y es el servicio que menos depende de un fabricante.'],
['Cada tendencia tiene un momento óptimo de entrada. Demasiado temprano, gastas en educar al mercado sin ventas. Demasiado tarde, compites por precio con muchos. Las señales de buen momento: clientes que preguntan sin que tú les hayas hablado del tema, fabricantes que lanzan programas de partner para esa tecnología y competidores que empiezan a mencionarla.','Cuando aparecen dos de las tres señales, es momento de pasar de observar a preparar.']],
c:{t:'Kodak y la cámara digital',tag:'Caso real',p:[
'En 1975, Steve Sasson, ingeniero de Kodak, construyó la primera cámara digital. Kodak dominaba el mercado de película fotográfica, que dejaba márgenes muy altos.',
'Durante años la empresa vio la fotografía digital como una amenaza a su negocio más rentable y avanzó con cautela. Cuando la fotografía digital se masificó, otros fabricantes ya dominaban el mercado. Kodak se declaró en quiebra en 2012.',
'El problema no fue la falta de tecnología ni de información. Kodak tenía ambas. Fue proteger el negocio actual en lugar de construir el siguiente a tiempo.'],
q:'¿Qué negocio rentable de Coresolutions podría estar haciendo el papel de la película fotográfica?'}}
});

/* Profundización y casos · Bloque 5 (parte 1) */
Object.assign(X,{
estrategia:{x:[
['Una forma de encontrar el diagnóstico es preguntar: ¿qué es lo que, si no cambia, hará que en 3 años estemos peor que hoy? En un integrador, la respuesta suele estar en uno de cuatro lugares: dependencia de un fabricante, márgenes de producto que bajan, ingresos que dependen de proyectos que no se repiten o personas clave que concentran el conocimiento.','El diagnóstico no debe ser una lista de diez problemas. Es el desafío central del que se desprenden los demás.'],
['Michael Porter agrega una idea útil: la estrategia es un conjunto de actividades que encajan entre sí. Una empresa con ventaja no hace una cosa mejor que otras, hace varias cosas distintas que se refuerzan. Por ejemplo, ingenieros certificados, procesos de servicio documentados, una plataforma de monitoreo propia y contratos con informe mensual. Copiar una es fácil; copiar el conjunto, no.','Pregúntate qué actividades de Coresolutions encajan en una ventaja así y cuáles no aportan nada a ella.'],
['El horizonte 3 muere de dos formas: por falta de recursos o por ser evaluado con las métricas del horizonte 1. Una línea de IA en su primer año no va a tener el margen ni el volumen de la infraestructura. Si la mides igual, la cerrarás antes de que madure.','Las métricas del horizonte 3 son de aprendizaje: clientes piloto, casos de uso validados, disposición a pagar. Las del horizonte 2 son de crecimiento. Las del horizonte 1 son de rentabilidad.']],
c:{t:'Southwest Airlines dice no',tag:'Caso real',p:[
'Southwest Airlines construyó durante décadas una de las aerolíneas más rentables de Estados Unidos con una estrategia de bajo costo. Para lograrlo, dijo no a muchas cosas que hacían otras aerolíneas: no tenía comidas a bordo, no asignaba asientos en sus inicios, no usaba los grandes aeropuertos centrales y operaba un solo tipo de avión, el Boeing 737.',
'Cada decisión reforzaba las demás. Un solo modelo de avión simplificaba mantenimiento y entrenamiento. Rutas punto a punto en aeropuertos secundarios permitían aterrizar, cargar y despegar en muy poco tiempo. Más vuelos por avión al día significaba menos costo por pasajero.',
'Michael Porter usó a Southwest para explicar que la ventaja no viene de una actividad sino del encaje entre todas. Muchas aerolíneas intentaron copiar partes del modelo sin éxito.'],
q:'¿A qué tendría que decir no Coresolutions para que sus actividades encajen en una sola estrategia?'}},

ventas:{x:[
['Una revisión semanal de pipeline útil no recorre todas las oportunidades. Se concentra en tres preguntas: ¿qué oportunidades grandes cambiaron de etapa?, ¿cuáles están detenidas hace más de 30 días?, ¿qué necesita el equipo para avanzar las que cierran este mes?','Las oportunidades detenidas son la señal más útil. Una oportunidad sin movimiento en 60 días casi nunca se cierra; mantenerla en el pipeline infla la cobertura y engaña al pronóstico.'],
['Rackham encontró otra diferencia importante: los vendedores promedio presentan beneficios demasiado pronto. Si hablas de lo que tu solución hace antes de que el cliente haya reconocido el costo de su problema, suena a gasto. Si lo haces después, suena a solución.','En la práctica: la primera reunión debe ser 70% preguntas. La propuesta viene después, y repite las palabras que usó el cliente para describir su problema.'],
['En cuentas clave, el mapa de decisión es tan importante como el instalado. ¿Quién firma? ¿Quién recomienda? ¿Quién puede bloquear? ¿Quién usa la solución día a día? En un banco o una universidad, la decisión rara vez está en una sola persona.','Cuando tu relación depende de un solo contacto y esa persona cambia de cargo, la cuenta queda en riesgo. Construye relación con al menos tres personas en cada cliente clave.']],
c:{t:'La investigación detrás de SPIN',tag:'Caso real',p:[
'En los años 70, Neil Rackham y su equipo de Huthwaite analizaron unas 35.000 llamadas de venta durante 12 años, con apoyo de empresas como Xerox e IBM. Querían saber qué hacían distinto los mejores vendedores en ventas grandes y complejas.',
'Encontraron que las técnicas que funcionaban en ventas pequeñas, como insistir en el cierre o manejar objeciones con argumentos, empeoraban los resultados en ventas grandes. Los mejores vendedores hacían más preguntas, sobre todo de implicación y de necesidad, y dejaban que el cliente expresara el valor con sus propias palabras.',
'El método SPIN salió de esa investigación y sigue siendo una referencia en venta consultiva B2B.'],
q:'En tu última reunión comercial importante, ¿cuánto tiempo hablaste tú y cuánto el cliente? ¿Qué pregunta de implicación pudiste haber hecho?'}},

marca:{x:[
['El posicionamiento sirve como filtro interno: ayuda a decidir qué proyectos aceptar, qué contenido publicar y qué decir en una reunión. Si dices que eres especialista en continuidad y seguridad para sectores críticos, una licitación de impresoras para una escuela no encaja, aunque puedas ganarla.','Una marca clara también facilita contratar: los buenos ingenieros quieren trabajar donde se hace algo específico y bien hecho.'],
['Para conseguir casos de éxito, pide permiso al cierre del proyecto, cuando el cliente está más satisfecho. Ofrece hacer todo el trabajo: tú escribes, el cliente revisa. Incluye un número concreto y una frase del cliente.','Si el cliente no puede ser nombrado, un caso anónimo con sector y números sigue siendo útil: "una cooperativa del Austro con 200.000 socios redujo su tiempo de recuperación de 12 horas a 45 minutos".'],
['LinkedIn es el canal B2B más directo para gerentes y directores de TI en Ecuador. La regla de contenido útil es simple: enseñar algo concreto en cada publicación. Un error común de configuración, una comparación de costos, una lección de un proyecto.','Tu experiencia con @jaywrkr aplica aquí: claridad visual, pocas palabras, un mensaje por pieza. Lo que cambia es el tema y la audiencia.']],
c:{t:'"Nadie fue despedido por comprar IBM"',tag:'Caso real',p:[
'Durante los años 70 y 80 circulaba en el mundo corporativo una frase: "Nadie fue despedido por comprar IBM". Describía algo que todavía es cierto en las ventas B2B: el comprador no solo evalúa el producto, también evalúa su propio riesgo.',
'Un gerente de TI que elige una marca reconocida y algo sale mal puede decir que eligió la opción segura. Si elige una opción menos conocida y falla, la culpa es suya. Por eso la reputación de un proveedor vale tanto como sus características técnicas.',
'Para un integrador, la marca cumple la misma función. Casos de éxito, certificaciones, años de operación y referencias reducen el riesgo percibido por quien te contrata.'],
q:'¿Qué evidencia concreta puede mostrar hoy Coresolutions para que un gerente de TI se sienta seguro eligiéndola frente a un integrador nacional más grande?'}},

operaciones:{x:[
['Para medir la utilización con datos confiables, todas las horas deben registrarse, incluidas las no facturables: preventa, capacitación, tareas internas, soporte no cobrado. Sin ese registro, la utilización parece baja cuando en realidad hay trabajo invisible que nadie cobra.','Cuando el registro es completo, aparecen los patrones: clientes que consumen mucho soporte gratuito, proyectos que siempre se exceden, personas sobrecargadas mientras otras tienen capacidad.'],
['Un registro de cambios simple tiene cinco campos: fecha, quién lo pidió, qué se pidió, impacto en horas y costo, y decisión. Se revisa con el cliente en cada reunión de seguimiento. No hace falta que todos se cobren, pero todos deben quedar visibles.','Al cierre del proyecto, el registro de cambios explica las diferencias entre el presupuesto y el costo real, y es la base para negociar cambios cobrables.'],
['Para encontrar el cuello de botella, pregunta qué trabajo espera siempre a la misma persona o al mismo recurso. Si las configuraciones de almacenamiento esperan a un ingeniero, si las propuestas esperan tu revisión o si las compras esperan una aprobación, ahí está.','Goldratt propone cinco pasos: identificar el cuello de botella, aprovecharlo al máximo, subordinar todo lo demás a él, ampliarlo y repetir. A veces basta con quitarle tareas que otros pueden hacer.']],
c:{t:'Toyota y la cuerda andon',tag:'Caso real',p:[
'En el sistema de producción de Toyota, cualquier operario puede tirar de una cuerda, llamada andon, para detener la línea de montaje si detecta un problema de calidad. Parece contradictorio: detener la línea cuesta dinero.',
'La lógica es que un defecto detectado temprano cuesta mucho menos que uno descubierto al final o por el cliente. Además, cada parada obliga a encontrar la causa y corregir el proceso, de modo que el mismo problema no vuelve a ocurrir.',
'El sistema de Toyota inspiró la manufactura esbelta y prácticas de mejora continua en muchas industrias, incluido el software y los servicios de TI.'],
q:'¿Quién en Coresolutions tiene permiso, y la confianza, para detener un proyecto cuando ve un problema de calidad antes de que llegue al cliente?'}},

personas:{x:[
['Grove tiene una idea práctica sobre bajo desempeño: cuando alguien no rinde, hay solo dos causas posibles. O no sabe hacerlo, o no está motivado. Si no sabe, la solución es entrenamiento. Si no está motivado, la conversación es otra.','Antes de concluir que alguien no quiere, verifica que sepa exactamente qué se espera, que tenga las herramientas y que haya recibido entrenamiento. La mayoría de los problemas de desempeño empiezan por expectativas poco claras.'],
['Kim Scott propone el concepto de franqueza radical: preocuparse personalmente por la persona y, al mismo tiempo, desafiarla directamente. Si solo te preocupas sin desafiar, eres complaciente. Si desafías sin preocuparte, eres agresivo. Si no haces ninguna de las dos, eres indiferente.','Para alguien que antes fue compañero de los ingenieros, el riesgo más común es la complacencia: evitar conversaciones difíciles para no dañar la relación. A la larga, eso daña más la relación y al equipo.'],
['Las conversaciones de carrera son distintas del 1:1 semanal. Una o dos veces al año, pregunta a cada persona clave: ¿qué quieres estar haciendo en 3 años?, ¿qué habilidades necesitas para eso?, ¿cómo puede ayudarte la empresa? Después, conecta sus respuestas con oportunidades reales.','Las certificaciones VCF, un rol de líder técnico o la responsabilidad sobre un servicio gestionado pueden ser pasos de carrera visibles que retienen más que un aumento.']],
c:{t:'Google y el Proyecto Oxígeno',tag:'Caso real',p:[
'Alrededor de 2008, Google se preguntó si los gerentes realmente importaban. Muchos de sus ingenieros pensaban que los gerentes eran un mal necesario. La empresa analizó evaluaciones de desempeño, encuestas a empleados y entrevistas.',
'El resultado fue el contrario: los equipos con mejores gerentes tenían mejor desempeño, más satisfacción y menos rotación. Google identificó conductas comunes de sus mejores gerentes: ser buen coach, dar autonomía sin microgestionar, interesarse por el bienestar y el éxito de las personas, comunicar con claridad y ayudar al desarrollo de carrera.',
'Un hallazgo llamó la atención: la capacidad técnica aparecía en el último lugar de la lista. Importaba, pero mucho menos que las conductas de liderazgo.'],
q:'De esas conductas, ¿cuál te sale natural y cuál vas a tener que practicar a propósito?'}}
});

Object.assign(X,{
organizacion:{x:[
['Una señal de que la estructura no funciona: las mismas decisiones suben siempre al gerente. Si cada descuento, cada asignación de ingeniero y cada compra pasan por ti, la estructura no tiene responsables reales, aunque el organigrama diga otra cosa.','Revisa durante dos semanas qué decisiones llegan a ti. Las que se repiten necesitan un dueño en el nivel de abajo.'],
['Para cada rol nuevo, define el resultado antes que las tareas. "Responsable de servicios gestionados: hacer crecer el ingreso recurrente 30% al año con 95% de cumplimiento de nivel de servicio" orienta más que una lista de diez tareas.','Las tareas cambian; el resultado esperado da criterio para decidir qué hacer cuando aparece algo no previsto.'],
['Al promover a un buen técnico a líder de área, recuerda tu propia transición: es otro trabajo. Dale formación, un periodo de acompañamiento y expectativas claras. Promover sin preparar convierte a un excelente ingeniero en un líder frustrado.','Otra opción es crear carrera técnica paralela: arquitecto o especialista senior, con reconocimiento y sueldo, sin obligación de dirigir personas.']],
c:{t:'Los equipos de dos pizzas de Amazon',tag:'Caso real',p:[
'A comienzos de los 2000, Jeff Bezos propuso que los equipos de Amazon fueran lo bastante pequeños como para alimentarse con dos pizzas, unas 6 a 10 personas. Cada equipo tendría un objetivo claro y autonomía para lograrlo.',
'La idea detrás no era el tamaño en sí, sino reducir la coordinación. Equipos grandes necesitan muchas reuniones y aprobaciones. Equipos pequeños con responsabilidad clara pueden decidir y moverse más rápido.',
'El principio se aplica a empresas mucho más pequeñas: cada área con un responsable, un resultado medible y la autoridad para decidir dentro de límites claros.'],
q:'¿Qué áreas de Coresolutions tienen hoy un responsable con resultado medible y autoridad real? ¿Cuáles dependen de que tú decidas?'}},

negociacion:{x:[
['Una herramienta simple para preparar cualquier negociación es una hoja con seis líneas: mi alternativa, su alternativa probable, mis intereses, sus intereses probables, mi precio de reserva y mi ancla. Si no puedes llenar alguna, todavía no estás listo para negociar.','La línea más difícil suele ser la alternativa del otro. Investiga: ¿con quién más está hablando?, ¿qué le pasa si no cierra contigo?, ¿qué plazo tiene?'],
['Voss propone técnicas de escucha que bajan la tensión. **Etiquetar:** nombrar lo que el otro siente ("parece que el presupuesto está muy ajustado este año"). **Reflejar:** repetir las últimas palabras del otro como pregunta para que siga hablando. **Preguntas calibradas:** "¿cómo se supone que haga eso?" obliga al otro a ver tu restricción.','Estas técnicas funcionan porque las personas negocian mejor cuando se sienten escuchadas, y revelan intereses cuando hablan más.'],
['Cuando negocias con tu propio equipo, como aumentos o cambios de rol, la relación a largo plazo vale más que el resultado de una conversación. Prepara criterios objetivos: rangos de mercado, desempeño, responsabilidades nuevas. Así la conversación es sobre criterios y no sobre quién presiona más.','Fisher y Ury llaman a esto negociar con criterios objetivos. Es la forma de llegar a acuerdos que ambos lados consideran justos.']],
c:{t:'Camp David, 1978',tag:'Caso real',p:[
'En 1978, Egipto e Israel negociaron en Camp David, con mediación del presidente estadounidense Jimmy Carter, el futuro de la península del Sinaí, ocupada por Israel desde 1967. Las posiciones parecían irreconciliables: Egipto quería todo el territorio de vuelta; Israel quería conservar parte de él.',
'Al explorar los intereses detrás de las posiciones, apareció la diferencia: Egipto quería soberanía, recuperar un territorio que consideraba propio. Israel quería seguridad, no tener tanques egipcios cerca de su frontera.',
'El acuerdo devolvió el Sinaí a Egipto, con zonas desmilitarizadas que daban seguridad a Israel. Fisher y Ury usan este caso en "Getting to Yes" para mostrar cómo pasar de posiciones a intereses abre soluciones que nadie veía al inicio.'],
q:'Piensa en una negociación trabada que tengas hoy. ¿Qué interés hay detrás de la posición del otro lado?'}},

cambio:{x:[
['Antes de lanzar un cambio, haz el mapa de las personas afectadas: quién gana, quién pierde algo (tiempo, control, comodidad) y quién tiene influencia sobre los demás. Los que pierden algo necesitan una conversación individual antes del anuncio general.','Los aliados con influencia no siempre son los jefes. A veces es el ingeniero más respetado del equipo. Si él adopta el cambio primero, los demás lo siguen.'],
['Los Heath llaman "puntos brillantes" a los casos donde el cambio ya funciona. Si un PM ya cierra sus proyectos con postmortem y eso le ha evitado problemas, ese caso convence más que cualquier argumento del gerente.','Busca primero quién ya hace lo que quieres, entiende por qué le funciona y úsalo como ejemplo y como guía para los demás.'],
['Para medir la adopción, elige una métrica simple que se pueda contar sin esfuerzo: porcentaje de proyectos con postmortem, porcentaje de horas registradas, porcentaje de oportunidades actualizadas en la semana. Publícala cada mes al equipo sin culpar a nadie.','La medición visible crea presión positiva. Cuando la métrica pasa de 90% durante tres meses seguidos, el hábito se consolidó y puedes pasar al siguiente.']],
c:{t:'Alan Mulally en Ford, 2006',tag:'Caso real',p:[
'Cuando Alan Mulally llegó a Ford como CEO en 2006, la empresa perdía miles de millones de dólares. Mulally instauró una reunión semanal de revisión del plan de negocio con su equipo directivo, donde cada responsable presentaba sus indicadores con colores: verde, amarillo o rojo.',
'Durante las primeras semanas, todos los indicadores aparecían en verde, aunque la empresa perdía dinero. Nadie quería ser el que mostrara un problema. Hasta que Mark Fields, responsable de las Américas, presentó un problema de producción en rojo. Mulally aplaudió y preguntó al grupo cómo podían ayudar.',
'A la semana siguiente, los tableros se llenaron de amarillo y rojo. A partir de ahí, los problemas se discutían a tiempo. Ford fue el único de los tres grandes fabricantes de Detroit que no necesitó rescate del gobierno durante la crisis de 2008 y 2009.'],
q:'Si en la reunión semanal de Coresolutions alguien muestra un indicador en rojo, ¿qué pasa? ¿Lo celebran, lo ignoran o lo castigan?'}},

gobierno:{x:[
['En una empresa sin directorio formal, un consejo asesor puede cumplir parte de su función: dos o tres personas externas con experiencia que se reúnen cada trimestre con el gerente y los accionistas. No tienen poder de decisión, pero aportan preguntas y experiencia que dentro de la empresa no existen.','Para un gerente nuevo, un consejo asesor también protege: las decisiones difíciles se discuten con criterios externos y no solo dentro de la familia o del grupo de socios.'],
['El acuerdo de transición debería responder por escrito al menos seis preguntas: ¿qué decisiones son del gerente sin consulta?, ¿cuáles requieren aprobación de accionistas?, ¿cuál es el rol del gerente saliente y hasta cuándo?, ¿cómo se comunica la transición a clientes y equipo?, ¿cómo se evalúa al nuevo gerente?, ¿qué pasa si hay desacuerdo?','Escribirlo con calma, cuando todos están de acuerdo, evita discusiones difíciles cuando aparezcan los primeros conflictos.'],
['La comunicación a clientes clave es una parte del plan de sucesión que suele improvisarse. Lo ideal es que el gerente saliente y el nuevo visiten juntos a los diez clientes más importantes. El mensaje para el cliente: la relación continúa, la empresa se fortalece y hay un responsable claro.','Algo parecido aplica con los fabricantes principales: el gerente de canal debe saber quién decide desde ahora.']],
c:{t:'Disney: la sucesión que no funcionó',tag:'Caso real',p:[
'Bob Iger dirigió Disney entre 2005 y 2020. En febrero de 2020 anunció a Bob Chapek como su sucesor, pero se quedó como presidente ejecutivo del directorio y a cargo de la dirección creativa durante la transición.',
'Diversos reportes de prensa describieron tensiones entre ambos y confusión sobre quién tomaba ciertas decisiones. La pandemia complicó aún más el período. En noviembre de 2022, el directorio despidió a Chapek y trajo de vuelta a Iger como CEO.',
'El caso se estudia como ejemplo de los riesgos de una sucesión donde el líder saliente sigue cerca, los roles no están del todo claros y el nuevo líder no termina de consolidar su autoridad.'],
q:'¿Qué tendría que estar escrito y acordado para que tu transición no se parezca a esta?'}},

crecimiento:{x:[
['Antes de crecer en ventas, verifica que el crecimiento sea rentable. Crecer con proyectos de bajo margen consume caja, capacidad del equipo y atención del gerente, y puede dejar a la empresa más frágil que antes.','Una prueba simple: si duplicaras las ventas de una línea mañana, ¿aumentaría la utilidad o solo la carga de trabajo y el capital necesario?'],
['Al comprar una cartera de servicios, revisa la calidad de los contratos uno por uno: plazo restante, cláusulas de terminación, si se pueden ceder, margen real y satisfacción del cliente. Una cartera con muchos contratos mes a mes vale mucho menos que una con contratos de 2 o 3 años.','Habla con los principales clientes antes de cerrar, con permiso del vendedor. Su disposición a seguir es el dato más importante de la compra.'],
['La integración después de comprar es donde se pierde la mayor parte del valor. Define antes de cerrar quién atenderá a los nuevos clientes, cómo se migran a tus herramientas y procesos y cómo se retiene a las personas clave del vendedor.','Un plan de 100 días para la integración, con responsables y métricas de retención de clientes, es tan importante como el precio.']],
c:{t:'HP compra Autonomy, 2011',tag:'Caso real',p:[
'En 2011, HP compró la empresa británica de software Autonomy por unos 11.000 millones de dólares. Era parte de un giro estratégico para reducir la dependencia de hardware.',
'Un año después, HP registró un cargo de cerca de 8.800 millones de dólares relacionado con la compra, y atribuyó buena parte a irregularidades contables en Autonomy antes de la adquisición. Hubo años de litigios en el Reino Unido y Estados Unidos.',
'Más allá de las responsabilidades legales, el caso se estudia por las preguntas que una due diligence rigurosa debe hacerse y por el riesgo de pagar un precio alto por una apuesta estratégica bajo presión de tiempo.'],
q:'Si mañana te ofrecen comprar la cartera de un competidor pequeño, ¿qué tres cosas revisarías antes de hacer una oferta?'}},

ia:{x:[
['Para medir el ahorro, cronometra el proceso antes de automatizarlo: tres o cuatro casos reales, de principio a fin. Después de automatizar, mide igual. Incluye el tiempo de revisión humana, que suele olvidarse.','Con esos números puedes decidir qué automatizar después y mostrar a los accionistas un retorno concreto, no una promesa.'],
['El riesgo principal de la IA interna en una empresa como Coresolutions es la dependencia de una persona. Si los sistemas que construiste solo los entiendes tú, cuando asumas la gerencia y tengas menos tiempo, se detendrán o fallarán sin que nadie sepa arreglarlos.','Documenta cada sistema: qué hace, qué datos usa, cómo se ejecuta, qué hacer si falla. Y asigna un responsable técnico distinto de ti.'],
['Al vender IA, el diagnóstico inicial evita el error más común de los clientes: comprar tecnología antes de saber para qué. Un diagnóstico de dos o tres semanas identifica casos de uso con valor medible, datos disponibles y riesgos.','Con ese diagnóstico, el cliente decide mejor entre plataforma o infraestructura propia, y tú construyes una relación de asesor, no de proveedor.']],
c:{t:'Klarna y su asistente de IA',tag:'Caso real',p:[
'En febrero de 2024, la empresa sueca de pagos Klarna anunció que su asistente de IA para atención al cliente hacía el trabajo equivalente a unos 700 agentes humanos, con tiempos de resolución más cortos.',
'El anuncio tuvo mucha difusión como ejemplo de reemplazo de trabajo con IA. Sin embargo, en 2025 la propia empresa dijo públicamente que volvería a contratar personas para atención al cliente, reconociendo que el foco en reducir costos había afectado la calidad del servicio en algunos casos.',
'El caso muestra que la IA puede generar ahorros reales, pero que medir solo el costo y no la calidad lleva a decisiones que luego hay que corregir.'],
q:'Para cada proceso que automatices en Coresolutions, ¿cómo vas a medir la calidad además del tiempo ahorrado?'}},

ritmo:{x:[
['El ritmo de reuniones funciona solo si las reuniones son cortas, con agenda fija y con decisiones. Una reunión semanal que dura dos horas y no termina con responsables y fechas es peor que no tenerla, porque consume tiempo y da sensación de control sin serlo.','Una regla útil: cada punto de la agenda termina con una de tres salidas: decidido, asignado o descartado.'],
['Harnish recomienda además una reunión diaria muy corta, de 10 a 15 minutos, para equipos operativos: qué pasó ayer, qué viene hoy y dónde hay bloqueos. En un integrador, una reunión diaria del área de implementación y soporte puede evitar que pequeños problemas crezcan durante días.','No es para el gerente; es para los líderes de área. El gerente solo se entera de lo que no se pudo resolver allí.'],
['Las prioridades trimestrales funcionan mejor cuando cada persona del equipo directivo tiene también sus propias prioridades conectadas a las de la empresa. Si la prioridad de empresa es aumentar el ingreso recurrente, la del comercial puede ser cerrar 5 contratos de servicio y la de implementación, entregar el informe mensual automatizado a 3 clientes nuevos.','Revisa el avance de las prioridades cada semana con una sola pregunta: ¿va en camino o no? Si no, ¿qué se necesita?']],
c:{t:'Intel, Google y los OKR',tag:'Caso real',p:[
'Andy Grove desarrolló en Intel un sistema de objetivos y resultados clave, OKR: un objetivo cualitativo acompañado de tres a cinco resultados medibles que indican si se logró. John Doerr, que trabajó con Grove, llevó el sistema a Google en 1999, cuando la empresa tenía unas pocas decenas de empleados.',
'Google adoptó los OKR trimestrales para toda la empresa. Los objetivos son públicos dentro de la organización, de modo que cualquiera puede ver en qué trabaja cada equipo y cómo se conecta con las prioridades generales.',
'Doerr contó la historia en "Measure What Matters". El sistema se volvió muy popular en empresas de tecnología de todos los tamaños.'],
q:'¿Cuál sería el objetivo de Coresolutions para el próximo trimestre y qué tres resultados medibles te dirían que se cumplió?'}},

final:{x:[
['La tesis es la parte más difícil y la más importante. Debe caber en un párrafo y responder: qué tipo de empresa será Coresolutions, para quién, con qué ventaja y qué deja de hacer. Si la tesis no incomoda a nadie, probablemente no elige nada.','Escribe varias versiones y léelas en voz alta a alguien que no conozca la empresa. Si puede repetirla con sus palabras, está clara.'],
['Los números del plan no necesitan ser perfectos, pero sí coherentes: las ventas proyectadas deben ser alcanzables con el pipeline y la capacidad del equipo, y la caja debe sostener el crecimiento. Muestra los supuestos principales para que los accionistas puedan discutirlos.','Incluye una página de riesgos con sus respuestas. Mostrar que conoces los riesgos genera más confianza que un plan sin riesgos.'],
['Prepara la reunión con los accionistas como una negociación: qué quieres que aprueben, qué alternativas tienes si no aprueban todo, cuáles serán sus preocupaciones y qué evidencia tienes para cada una.','Después de la reunión, envía un resumen escrito con lo que se acordó, quién hace qué y cuándo se revisa. Ese documento se vuelve tu mandato como gerente.']],
c:{t:'La carta de Bezos a los accionistas, 1997',tag:'Caso real',p:[

calc:v=>{const g=[v.r1*v.m1/100,v.r2*v.m2/100,v.r3*v.m3/100];const R=v.r1+v.r2+v.r3,G=g[0]+g[1]+g[2];const L=['Reventa','Servicios','Recurrente'],rv=[v.r1,v.r2,v.r3];

pipe:{tag:'Herramienta · Pipeline necesario',f:[['meta','Meta de venta anual (USD)',2000000],['win','Tasa de cierre %',25],['tk','Ticket promedio (USD)',60000],['cic','Ciclo de venta (meses)',4]],
calc:v=>{const p=v.meta/(v.win/100),n=p/v.tk,m=n/12;

function simNew(){return {i:0,caja:220,ubp:290,mrr:12,fijo:300,moral:65,rep:60,grow:0,pend:{caja:0,extra:0},log:[],ops:[]}}
function simOp(s,extra){return s.ubp+s.mrr*3*0.55-s.fijo+extra}
function simPick(j){
  const s=S.sim,Q=SIMQ[s.i],[,fx,msg]=Q.o[j];
  let extra=(fx.extra||0)+s.pend.extra;
  s.ubp+=fx.ubp||0; s.fijo+=fx.fijo||0; s.mrr+=(fx.mrr||0)+s.grow; s.grow+=fx.grow||0;
  s.moral=Math.max(0,Math.min(100,s.moral+(fx.moral||0))); s.rep=Math.max(0,Math.min(100,s.rep+(fx.rep||0)));
  let note=msg;
  if(s.moral<50){extra-=15;note+=' La moral baja redujo la productividad.'}
  const op=simOp(s,extra);
  s.caja+=op+(fx.caja||0)+s.pend.caja;
  if(s.caja<0){const pen=Math.abs(s.caja)*0.1;s.caja-=pen;s.moral=Math.max(0,s.moral-10);note+=' Caja negativa: crédito de emergencia caro y nómina en riesgo.'}
  s.pend={caja:fx.cajaNext||0,extra:fx.extraNext||0};
  s.ops.push(op);s.log.push([Q.q,note,op]);s.i++;save();vSim();
}
function simEnd(s){
  const ebitda=s.ops.slice(-4).reduce((a,b)=>a+b,0),ubr=s.mrr*3*0.55,share=ubr/(ubr+s.ubp)*100;
  const mult=Math.max(2,3+Math.min(share,80)/100*5);const val=Math.max(0,ebitda)*mult+s.caja;
  return {ebitda,share,mult,val};
}

function radarSVG(cur,first){

  const poly=vals=>R.map((k,i)=>pt(i,vals[k[0]]||0).map(x=>x.toFixed(1)).join(',')).join(' ');
  let g='';for(let l=2;l<=10;l+=2)g+=`<polygon points="${R.map((k,i)=>pt(i,l).join(',')).join(' ')}" fill="none" stroke="var(--line)"/>`;
  R.forEach((k,i)=>{const[x,y]=pt(i,10);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`;
    const[lx,ly]=pt(i,12.2);const anc=Math.abs(lx-cx)<8?'middle':(lx>cx?'start':'end');

  const f=first?`<polygon points="${poly(first)}" fill="none" stroke="var(--muted)" stroke-dasharray="3 3"/>`:'';
  return `<svg viewBox="0 0 380 340" role="img" aria-label="Radar de competencias de gerente">${g}${f}<polygon points="${poly(cur)}" fill="var(--accent-soft)" fill-opacity=".8" stroke="var(--fg)" stroke-width="1.5"/>${R.map((k,i)=>{const[x,y]=pt(i,cur[k[0]]||0);return`<circle cx="${x}" cy="${y}" r="3" fill="var(--fg)"/>`}).join('')}</svg>`;
}

function kStatus(dir,a,t){
  if(isNaN(a)||isNaN(t))return['—',''];
  if(dir>0?a>=t:a<=t)return['Bien','ok'];
  const gap=dir>0?(t-a)/Math.max(Math.abs(t),1):(a-t)/Math.max(Math.abs(t),1);
  return gap<=.15?['Cerca','warn']:['Atención','bad'];
}

}
function seenCount(m){const s=S.seen[m.id]||{};return stepsOf(m).filter(x=>s[x.k]).length}

/* ---------- router ---------- */
function show(v,arg,step){
  cur=v;if(v!=='modulo')curMod=null;
  const R2={inicio:vInicio,perfil:vPerfil,radar:vRadar,plan:vPlan,modulo:()=>vModulo(arg,step),practica:vPractica,tablero:vTablero,glosario:vGlosario};
  (R2[v]||vInicio)();

  view.style.animation='none';void view.offsetWidth;view.style.animation='';
  renderTabs();progress();
}
function toProgress(){const el=document.getElementById('prog');if(!el)return;const top=el.getBoundingClientRect().top+window.scrollY-(window.innerWidth>=1024?120:70);if(window.scrollY>top)window.scrollTo({top})}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  const y=window.scrollY;
  if(t.dataset.prac&&!t.dataset.v){pracTab=t.dataset.prac;S.pos._prac=pracTab;save();show('practica');return}
  if(t.dataset.v){if(t.dataset.prac){pracTab=t.dataset.prac;S.pos._prac=pracTab;save()}show(t.dataset.v);window.scrollTo({top:0});return}
  if(t.dataset.blk){show('plan');const el=document.getElementById('blk-'+t.dataset.blk);if(el)window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-80});return}
  if(t.dataset.open){show('modulo',t.dataset.open,t.dataset.first?0:undefined);window.scrollTo({top:0});return}
  if(t.dataset.step!==undefined&&curMod){vModulo(curMod,+t.dataset.step);renderTabs();toProgress();return}
  if(t.dataset.q!==undefined){S.quiz[curMod]=S.quiz[curMod]||{};S.quiz[curMod][t.dataset.q]=+t.dataset.qo;save();vModulo(curMod);window.scrollTo({top:y});return}
  if(t.dataset.qreset){delete S.quiz[curMod];save();vModulo(curMod);window.scrollTo({top:y});return}
  if(t.dataset.done){const id=t.dataset.done;S.done[id]=!S.done[id];save();t.classList.toggle('on',!!S.done[id]);t.textContent=S.done[id]?'✓ Módulo completado':'Marcar módulo como completado';progress();return}
  if(t.dataset.case!==undefined){S.cases[t.dataset.case]=+t.dataset.o;save();vCasos();window.scrollTo({top:y});return}
  if(t.dataset.reset!==undefined){delete S.cases[t.dataset.reset];save();vCasos();window.scrollTo({top:y});return}
  if(t.dataset.sim!==undefined){simPick(+t.dataset.sim);return}
  if(t.id==='simstart'){S.sim=simNew();save();vSim();return}
  if(t.id==='simreset'){S.sim=simNew();save();vSim();window.scrollTo({top:0});return}
  if(t.id==='rsave'){const d=new Date();S.radar.push({d:d.toLocaleDateString('es-EC',{day:'numeric',month:'short',year:'numeric'}),v:Object.assign({},radarDraft)});save();vRadar();window.scrollTo({top:y});return}
  if(t.id==='kreset'){S.kpi={};save();vTablero();return}
});
document.addEventListener('keydown',e=>{
  if(cur!=='modulo'||!curMod)return;
  const tg=e.target.tagName;if(tg==='INPUT'||tg==='TEXTAREA')return;
  const n=stepsOf(M.find(m=>m.id===curMod)).length,p=S.pos[curMod]||0;
  if(e.key==='ArrowRight'&&p<n-1){vModulo(curMod,p+1);renderTabs();toProgress()}
  if(e.key==='ArrowLeft'&&p>0){vModulo(curMod,p-1);renderTabs();toProgress()}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.ck!==undefined&&curMod){S.chk[curMod]=S.chk[curMod]||{};S.chk[curMod][el.dataset.ck]=el.checked;save();el.closest('.check').classList.toggle('on',el.checked);
    const m=M.find(x=>x.id===curMod),ck=S.chk[curMod],nd=m.steps.filter((s,si)=>ck[si]).length;const h=[...document.querySelectorAll('.lesson h3')].find(x=>x.textContent.startsWith('Pasos'));if(h)h.textContent=`Pasos · ${nd} de ${m.steps.length}`}
});
let timer;
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='glq'){glq=el.value;document.getElementById('glres').innerHTML=glList();return}
  const tool=el.closest('[data-tool]');if(tool){recalc(tool);return}
  if(el.dataset.r){radarDraft[el.dataset.r]=+el.value;document.getElementById('rv-'+el.dataset.r).textContent=el.value;
    const first=S.radar.length>1?S.radar[0].v:null;document.getElementById('radarsvg').innerHTML=radarSVG(radarDraft,first);return}
  if(el.dataset.note){S.notes[el.dataset.note]=el.value;clearTimeout(timer);const sid='saved-'+el.dataset.note;const s0=document.getElementById(sid);if(s0)s0.textContent='Guardando…';timer=setTimeout(()=>{save();const s=document.getElementById(sid);if(s)s.textContent='Guardado'},400);return}
  const k=el.closest('[data-kpi]');if(k){const id=k.dataset.kpi,def=K.find(x=>x[0]===id);
    K.forEach(([kid,,,,a,t])=>{if(!S.kpi[kid])S.kpi[kid]={a,t}});
    S.kpi[id]={a:k.querySelector('[data-f=a]').value,t:k.querySelector('[data-f=t]').value};save();
    const[s,c]=kStatus(def[3],parseFloat(S.kpi[id].a),parseFloat(S.kpi[id].t));const st=k.querySelector('[data-st]');st.textContent=s;st.className='chip '+c}
});

const h0=(location.hash||'').slice(1);
if(['inicio','perfil','radar','plan','practica','tablero','glosario'].includes(h0))show(h0);else if(M.some(m=>m.id===h0))show('modulo',h0);else show('inicio');

</script>

</body>
