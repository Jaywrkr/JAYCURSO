<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Programa GM Coresolutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&family=Geist+Mono:wght@300;400;500&display=swap">
<style>
/* Layout: app shell — slim top bar, one reading column, bottom tab bar on phones, step outline beside lessons on desktop. Monochrome; color only for state. */
:root{
  --bg:#ffffff; --fg:#0a0a0a; --muted:#6b6b6b; --faint:#a8a8a8; --line:#ececec; --soft:#f6f6f6; --seen:#9c9c9c;
  --accent:#0a0a0a; --accent-soft:#eeeeee;
  --ok:#2f7d4f; --warn:#a5701b; --bad:#b23a2e;
  --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --bar:58px; --tab:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0a0a; --fg:#f4f4f4; --muted:#9b9b9b; --faint:#5e5e5e; --line:#222222; --soft:#141414; --seen:#6e6e6e;
  --accent:#f4f4f4; --accent-soft:#1d1d1d; --ok:#5cc28a; --warn:#e0a84e; --bad:#ef7d70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0a0a; --fg:#f4f4f4; --muted:#9b9b9b; --faint:#5e5e5e; --line:#222222; --soft:#141414; --seen:#6e6e6e;
  --accent:#f4f4f4; --accent-soft:#1d1d1d; --ok:#5cc28a; --warn:#e0a84e; --bad:#ef7d70; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--sans);font-weight:300;font-size:15px;line-height:1.6;margin:0;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
p{margin:0 0 12px;max-width:62ch}
strong{font-weight:500}
a{color:var(--fg);text-underline-offset:3px}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--fg);outline-offset:3px}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:1120px;margin:0 auto;height:var(--bar);display:flex;align-items:center;gap:16px;padding-inline:20px}
.brand{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;background:none;border:0;padding:0;cursor:pointer;display:flex;align-items:center;gap:10px;white-space:nowrap}
.brand i{width:9px;height:9px;background:var(--fg);display:inline-block}
.crumb{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top-tabs{display:none;gap:4px;margin-left:auto}
.top-tabs button{background:none;border:0;font-family:var(--mono);font-size:12px;letter-spacing:.05em;color:var(--muted);padding:8px 12px;border-radius:99px;cursor:pointer;transition:color .15s,background .15s}
.top-tabs button:hover{color:var(--fg)}
.top-tabs button[aria-selected="true"]{color:var(--bg);background:var(--fg)}
.ring{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.ring svg{width:22px;height:22px;transform:rotate(-90deg)}
@media (min-width:900px){.top-tabs{display:flex}.ring{margin-left:12px}}

/* ---------- bottom bar (phones) ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar-in{height:var(--tab);display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar-in button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--faint);cursor:pointer;transition:color .15s}
.tabbar-in button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.4}
.tabbar-in button[aria-selected="true"]{color:var(--fg)}
.stepbar{height:var(--tab);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding-inline:16px}
.stepbar .cnt{text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
@media (min-width:900px){.tabbar{display:none}}

/* ---------- page ---------- */
main{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:8px calc(var(--tab) + 56px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){main{padding-block:8px 96px}}
.col{max-width:720px;margin:0 auto}
.wide{max-width:1000px;margin:0 auto}
.view{animation:rise .28s ease both}
@keyframes rise{from{transform:translateY(6px)}to{transform:none}}
section{padding-top:36px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--mono);font-weight:400;font-size:clamp(30px,6vw,46px);letter-spacing:-.025em;line-height:1.08;margin:12px 0 14px;text-wrap:balance}
h2{font-family:var(--mono);font-weight:400;font-size:clamp(21px,3.6vw,26px);letter-spacing:-.015em;line-height:1.25;margin:0 0 18px;text-wrap:balance}
h3{font-family:var(--mono);font-weight:400;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:48px 0 14px}
.lede{color:var(--muted);max-width:56ch;font-size:16px}
.why{font-size:clamp(17px,2.4vw,20px);line-height:1.5;max-width:52ch;margin:0;color:var(--fg)}
.meta{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:16px;display:flex;gap:6px 18px;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted);margin-top:14px;max-width:62ch}
.score{font-family:var(--mono);font-size:12px;color:var(--muted)}

.btn{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:13px 20px;border:1px solid var(--fg);background:var(--fg);color:var(--bg);border-radius:99px;cursor:pointer;transition:transform .12s,opacity .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.sec{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.sec:hover{border-color:var(--fg)}
.btn.on{background:transparent;color:var(--fg);border-color:var(--fg)}
.btn.icon{padding:12px 16px}
.ghost{font-family:var(--mono);font-size:12px;background:none;border:0;color:var(--muted);cursor:pointer;padding:0;text-align:left}
.ghost:hover{color:var(--fg)}
.endrow{margin-top:44px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.chip{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border:1px solid var(--line);border-radius:99px;color:var(--muted);white-space:nowrap;font-style:normal}
.chip.done{border-color:var(--fg);color:var(--fg)}
.chip.next{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chip.ok{border-color:var(--ok);color:var(--ok)} .chip.warn{border-color:var(--warn);color:var(--warn)} .chip.bad{border-color:var(--bad);color:var(--bad)}
ul.core{list-style:none;padding:0;margin:0;display:grid;gap:12px}
ul.core li{padding-left:24px;position:relative;max-width:64ch}
ul.core li::before{content:"→";position:absolute;left:0;font-family:var(--mono);color:var(--fg)}
ul.core.neg li::before{content:"—";color:var(--faint)}

/* ---------- home ---------- */
.hello{padding-top:44px}
.thesis{font-family:var(--mono);font-size:clamp(18px,3.4vw,24px);line-height:1.35;letter-spacing:-.01em;max-width:32ch;margin:6px 0 14px;text-wrap:balance}
.cont{margin-top:32px;border:1px solid var(--fg);border-radius:14px;padding:24px;display:grid;gap:18px}
.cont .ct{font-family:var(--mono);font-size:clamp(19px,3.4vw,24px);line-height:1.25;letter-spacing:-.01em;margin:6px 0 0}
.cont .cs{color:var(--muted);font-size:14px}
.cont .crow{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.segs{display:flex;gap:4px}
.segs i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.segs i.s{background:var(--seen)} .segs i.c{background:var(--fg)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:28px}
.stat{border-top:1px solid var(--line);padding-top:12px}
.stat b{display:block;font-family:var(--mono);font-weight:300;font-size:clamp(22px,4.4vw,30px);letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
@media (max-width:520px){.stats{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:20px}}
.route{display:grid;gap:4px}
.rb{display:grid;grid-template-columns:22px minmax(0,1fr) 140px 40px;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;cursor:pointer;width:100%}
.rb .n{font-family:var(--mono);font-size:11px;color:var(--faint)}
.rb .t{font-family:var(--mono);font-size:13px;min-width:0}
.rb .t small{display:block;font-family:var(--sans);font-size:12px;color:var(--muted)}
.rb .p{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.track{height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.track i{display:block;height:100%;background:var(--fg);transition:width .4s}
@media (max-width:520px){.rb{grid-template-columns:22px minmax(0,1fr) 40px}.rb .track{grid-column:2/4;grid-row:2}}
.links{display:grid}
.lk{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:18px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer}
.lk:first-child{border-top:1px solid var(--line)}
.lk .t{font-family:var(--mono);font-size:14px}
.lk .s{font-size:13px;color:var(--muted)}
.lk .a{font-family:var(--mono);color:var(--muted);transition:transform .15s}
.lk:hover .a{transform:translateX(4px);color:var(--fg)}

/* ---------- plan ---------- */
.block{margin-top:44px}
.blockhead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:baseline}
.blockhead .bt{font-family:var(--mono);font-size:16px}
.blockhead .bm{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.04em;text-align:right}
.blockhead .track{grid-column:1/-1;margin-top:8px}
.blockdesc{font-size:13px;color:var(--muted);margin:10px 0 6px;max-width:62ch}
.row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.row .rn{font-family:var(--mono);font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.row .rt{font-family:var(--mono);font-size:15px;transition:transform .15s;display:block}
.row:hover .rt{transform:translateX(3px)}
.row .rs{font-size:12px;color:var(--muted);margin-top:2px}
.row .rr{display:flex;align-items:center;gap:10px}
.row .mini{display:flex;gap:2px;width:64px}
.row .mini i{flex:1;height:3px;border-radius:2px;background:var(--line)} .row .mini i.s{background:var(--fg)}
.row.isnext{background:var(--soft);margin-inline:-12px;padding-inline:12px;border-radius:10px;border-bottom-color:transparent;width:calc(100% + 24px)}
.tick{width:18px;height:18px;border-radius:50%;background:var(--fg);display:inline-grid;place-items:center}
.tick svg{width:10px;height:10px;stroke:var(--bg);stroke-width:2;fill:none}
@media (max-width:520px){.row .mini{width:40px}}

/* ---------- module ---------- */
.modhead{padding-top:28px}
.back{font-family:var(--mono);font-size:12px;background:none;border:0;color:var(--muted);cursor:pointer;padding:0;margin-bottom:22px}
.back:hover{color:var(--fg)}
.modhead h1{font-size:clamp(26px,5vw,38px);margin-bottom:12px}
.progress{margin-top:26px;position:sticky;top:calc(var(--bar) + env(safe-area-inset-top,0px));background:var(--bg);z-index:5;padding-block:12px 10px}
.progress .segs{gap:3px}
.progress .segs button{flex:1;height:18px;background:none;border:0;padding:7px 0;cursor:pointer}
.progress .segs button i{display:block;height:4px;border-radius:2px;background:var(--line);transition:background .2s}
.progress .segs button.s i{background:var(--seen)} .progress .segs button.c i{background:var(--fg)}
.progress .pl{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:4px}
.progress .pl span:first-child{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0}
.modgrid{display:block}
.outline{display:none}
@media (min-width:1024px){
  .modgrid{display:grid;grid-template-columns:200px minmax(0,1fr);gap:56px;align-items:start}
  .outline{display:grid;gap:2px;position:sticky;top:calc(var(--bar) + 24px);padding-top:28px}
  .outline button{display:grid;grid-template-columns:14px 1fr;gap:8px;align-items:center;text-align:left;background:none;border:0;padding:7px 0;font-family:var(--mono);font-size:12px;color:var(--faint);cursor:pointer}
  .outline button i{width:6px;height:6px;border-radius:50%;border:1px solid var(--faint)}
  .outline button.s{color:var(--muted)} .outline button.s i{background:var(--seen);border-color:var(--seen)}
  .outline button.c{color:var(--fg)} .outline button.c i{background:var(--fg);border-color:var(--fg)}
  .outline button:hover{color:var(--fg)}
  .progress{position:static}
}
.lesson{padding-top:24px;min-width:0}
.lesson .ln{font-family:var(--mono);font-size:56px;font-weight:300;line-height:1;color:var(--line);letter-spacing:-.04em;margin-bottom:10px}
.lesson p{font-size:17px;line-height:1.75;max-width:62ch;margin-bottom:18px}
@media (max-width:560px){.lesson p{font-size:16px}.lesson .ln{font-size:44px}}
.stepnav{display:none}
@media (min-width:900px){.stepnav{display:flex;justify-content:space-between;gap:12px;margin-top:48px;padding-top:24px;border-top:1px solid var(--line)}}
.exbox{background:var(--soft);border-radius:12px;padding:22px 24px;margin:28px 0 12px}
.exbox .et{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.exbox table{width:100%;border-collapse:collapse;font-size:14px}
.exbox td{padding:9px 0;border-top:1px solid var(--line);vertical-align:top}
.exbox td:first-child{font-family:var(--mono);font-size:12px;color:var(--muted);padding-right:18px;width:42%}
.exbox td:last-child{font-variant-numeric:tabular-nums}
.exbox tr:first-child td{border-top:0}
.exbox .en{font-size:13px;color:var(--muted);margin:14px 0 0}
@media (max-width:520px){.exbox{padding:18px}.exbox td{display:block;width:auto!important;padding:2px 0}.exbox td:first-child{padding-top:10px}.exbox td:last-child{border-top:0}}
.quote{border-left:2px solid var(--fg);padding:4px 0 4px 18px;margin:28px 0 12px}
.quote .et{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.quote p{font-size:17px;margin:0}

/* forms & tools */
.tool{background:var(--soft);border-radius:12px;padding:24px;margin-top:8px}
.tool .tag{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:16px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
label.f{display:grid;gap:5px;font-family:var(--mono);font-size:11px;color:var(--muted);align-content:end}
input[type=number],input[type=text],input[type=search]{font-family:var(--mono);font-size:15px;padding:11px 12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;width:100%;font-variant-numeric:tabular-nums;transition:border-color .15s}
input[type=number]:focus,input[type=search]:focus,textarea:focus{border-color:var(--fg);outline:none}
input[type=range]{width:100%;accent-color:var(--fg)}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:18px;height:18px;border:1px solid var(--faint);border-radius:5px;margin:3px 0 0;cursor:pointer;display:grid;place-items:center;background:var(--bg)}
input[type=checkbox]:checked{background:var(--fg);border-color:var(--fg)}
input[type=checkbox]:checked::after{content:"";width:5px;height:9px;border:solid var(--bg);border-width:0 1.5px 1.5px 0;transform:translateY(-1px) rotate(45deg)}
.out{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;border-top:1px solid var(--line);padding-top:18px}
.out div span{display:block;font-family:var(--mono);font-size:11px;color:var(--muted)}
.out div b{font-family:var(--mono);font-weight:300;font-size:22px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.split{display:grid;gap:10px;margin-top:18px}
.split .ln{display:grid;grid-template-columns:120px 1fr 52px;gap:10px;align-items:center;font-family:var(--mono);font-size:12px}
.split .tr{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.split .tr i{display:block;height:100%;background:var(--fg)}
.split .tr.b i{background:var(--seen)}
.split .ln em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
textarea{width:100%;min-height:160px;font-family:var(--sans);font-size:15px;font-weight:300;line-height:1.6;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);resize:vertical;transition:border-color .15s}
.saved{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:6px;min-height:16px}
.check{display:grid;grid-template-columns:24px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;align-items:start}
.check span{max-width:62ch;transition:color .15s}
.check.on span{color:var(--faint);text-decoration:line-through}
.read{border-top:1px solid var(--line);padding-top:14px;margin-top:12px}
.read .t{font-family:var(--mono);font-size:14px}
.read .a{font-size:13px;color:var(--muted)}
.read .c{font-size:13px;margin-top:6px}
.src{font-size:13px;display:grid;gap:6px}
.gl{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:8px 20px;font-size:14px}
.gl dt{font-family:var(--mono);font-size:13px}
.gl dd{margin:0;color:var(--muted)}
@media (max-width:520px){.gl{grid-template-columns:1fr}.gl dd{margin-bottom:12px}}

/* quiz & cases */
.case{padding-block:28px;border-bottom:1px solid var(--line)}
.case .sit{font-size:16px;max-width:60ch;margin:8px 0 16px}
.opts{display:grid;gap:8px}
.opt{text-align:left;font-weight:300;font-size:15px;padding:15px 16px;border:1px solid var(--line);border-radius:10px;background:var(--bg);cursor:pointer;display:grid;grid-template-columns:24px 1fr;gap:8px;transition:border-color .15s,transform .12s}
.opt:hover:not(:disabled){border-color:var(--fg)}
.opt:active:not(:disabled){transform:scale(.99)}
.opt .k{font-family:var(--mono);color:var(--faint)}
.opt:disabled{cursor:default;color:var(--muted)}
.opt.pick{color:var(--fg)}
.opt.pick.s2,.opt.right{border-color:var(--ok)} .opt.pick.s1{border-color:var(--warn)} .opt.pick.s0{border-color:var(--bad)}
.fb{margin-top:12px;padding:16px 18px;background:var(--soft);border-radius:10px;font-size:14px;max-width:64ch}
.fb .v{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.v.s2{color:var(--ok)} .v.s1{color:var(--warn)} .v.s0{color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:99px;padding:3px;margin-top:28px}
.seg button{background:none;border:0;font-family:var(--mono);font-size:12px;padding:8px 16px;border-radius:99px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}

/* profile, radar, sim, kpi */
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:28px}
.item{border-top:1px solid var(--line);padding-top:14px}
.item .h{font-family:var(--mono);font-size:13px;margin-bottom:4px}
.item .d{color:var(--muted);font-size:14px}
.item .e{font-family:var(--mono);font-size:11px;color:var(--fg);margin-top:8px}
.horizon{display:grid;grid-template-columns:120px 1fr;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.horizon .rt{font-family:var(--mono);font-size:15px}
.horizon .w{font-family:var(--mono);font-size:12px;color:var(--muted)}
@media (max-width:560px){.horizon{grid-template-columns:1fr;gap:4px}}
.radarwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:640px){.radarwrap{grid-template-columns:1fr}}
.radar svg{width:100%;max-width:380px;display:block;margin:0 auto}
.sl{display:grid;gap:2px;padding:9px 0;border-bottom:1px solid var(--line)}
.sl .top{display:flex;justify-content:space-between;font-family:var(--mono);font-size:12px}
.sl .top b{font-weight:400;font-variant-numeric:tabular-nums}
.legend{display:flex;gap:18px;font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:10px;justify-content:center;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:6px}
.simstate{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:14px;padding:18px 0;border-top:1px solid var(--fg);border-bottom:1px solid var(--line)}
.simstate div span{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.simstate div b{font-family:var(--mono);font-weight:300;font-size:20px;font-variant-numeric:tabular-nums}
.simstate div b.neg{color:var(--bad)}
.qdots{display:flex;gap:4px;margin:18px 0 6px}
.qdots i{flex:1;height:3px;background:var(--line);border-radius:2px}
.qdots i.on{background:var(--fg)}
.log div{display:grid;grid-template-columns:70px 1fr 80px;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.log div span:first-child{font-family:var(--mono);color:var(--muted)}
.log div span:last-child{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.kpi{display:grid;grid-template-columns:1fr 100px 100px 78px;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.kpi .n{font-family:var(--mono);font-size:13px}
.kpi .h{font-size:12px;color:var(--muted)}
.kpi input{padding:8px 10px;font-size:13px}
.kpihead{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--fg);padding:8px 0;margin-top:24px}
@media (max-width:560px){
  .kpi{grid-template-columns:1fr 1fr 78px}
  .kpi>div:first-child{grid-column:1/-1}
  .kpihead>span:first-child{display:none}
  .tool{padding:18px}
  .split .ln{grid-template-columns:96px 1fr 48px}
  .log div{grid-template-columns:56px 1fr 64px}
}
.foot{margin-top:72px;font-family:var(--mono);font-size:11px;color:var(--faint);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  <button class="brand" data-v="inicio" aria-label="Inicio"><i></i>Programa GM</button>
  <span class="crumb" id="crumb"></span>

<script>
const M=[];const X={};
/* BLOQUE 1 · Tú: de PM a gerente */
M.push(
{id:'transicion',b:'b1',t:'De PM a gerente general',s:'Qué cambia en el cargo',min:45,
why:'El cargo no es una versión más grande de lo que haces hoy. Cambia qué produces, con quién pasas el tiempo y cómo te miden.',
L:[
{t:'Tres cambios de fondo',p:[
'Como PM produces proyectos entregados. Tu éxito se ve en una fecha cumplida, un cliente satisfecho y un margen que se respetó. Como gerente produces algo menos visible: una empresa que funciona. Tu producto son decisiones, personas preparadas y caja suficiente.',
'El segundo cambio es el tiempo. Hoy pasas la mayor parte del día con ingenieros y clientes de proyecto. Como gerente, el tiempo se reparte entre clientes clave, fabricantes, accionistas, tu equipo directivo y tiempo para pensar. Si sigues dedicando la mayor parte a la operación, nadie dirige la empresa.',
'El tercer cambio es cómo te miden. A un PM se le mide por entregas. A un gerente, por utilidad, caja, crecimiento, salud del equipo y valor de la empresa. Puedes trabajar 70 horas por semana y fallar, porque el esfuerzo no es la medida.',
'La pregunta que cambia: el PM pregunta "¿esto es bueno para el proyecto?". El gerente pregunta "¿esto es bueno para Coresolutions hoy y dentro de 18 meses?". Casi siempre coinciden. Cuando no, ahí está el trabajo real del cargo.'],
ex:{t:'Ejemplo: misma situación, dos lecturas',rows:[['Situación','Un cliente pide 3 días extra de soporte gratis'],['Lectura de PM','Darlos: el cliente queda contento y el proyecto cierra'],['Lectura de gerente','¿Qué precedente creo? ¿Quién deja de atender a otro cliente esos 3 días? ¿Cuánto margen se va?'],['Decisión de gerente','Darlos solo si se cambian por algo: referencia, caso de éxito o una renovación anticipada']]}},
{t:'Las tres trampas del ascenso',p:[
'**Seguir haciendo el trabajo anterior.** Es lo que sabes hacer bien y da satisfacción inmediata. Pero cada hora que pasas resolviendo un problema técnico es una hora en que nadie decide hacia dónde va la empresa.',
'**Querer caer bien a todos.** Como gerente tendrás que decir no a clientes, a ingenieros que fueron tus compañeros y a ideas que te gustan. Si buscas aprobación, la empresa pierde dirección.',
'**Cambiar todo en el primer mes.** Llegar con una lista larga de cambios genera resistencia. Primero se entiende, después se cambia. La excepción son los problemas que ponen en riesgo la caja o a un cliente clave: esos se atienden de inmediato.'],
},
{t:'Los primeros 90 días',p:[
'Michael Watkins, el autor de referencia en transiciones, propone que los primeros 90 días definen cómo te verán los accionistas y el equipo. Se dividen en tres etapas de unas 4 semanas.',
'**Días 1–30: aprender.** Entrevistas individuales con cada persona clave, con clientes principales y con los 3 fabricantes más importantes. Revisión de estados financieros, contratos y proyectos en riesgo. Al final tienes un diagnóstico escrito.',
'**Días 31–60: victorias tempranas.** Eliges 2 o 3 problemas visibles que puedes resolver rápido. Por ejemplo, cobrar cartera vencida, cerrar proyectos atrasados o lanzar el ritmo semanal de gestión. Las victorias tempranas dan credibilidad para los cambios grandes.',
'**Días 61–90: dirección.** Presentas a los accionistas tu diagnóstico, tus prioridades del año y tu equipo directivo. A partir de aquí empiezan los cambios estructurales.'],
ex:{t:'Ejemplo de victorias tempranas para Coresolutions',rows:[['Cobranza','Recuperar la cartera de más de 90 días con un plan por cliente'],['Proyectos','Cerrar formalmente los proyectos pasados de fecha'],['Soporte','Resolver los servicios con horas de soporte excedidas: cobrar, renegociar o cerrar'],['Ritmo','Primera reunión semanal de gestión con tablero']],note:'Elige victorias que se noten en números, no solo en ánimo.'}}
],
err:['Tomar el cargo sin acordar por escrito qué significa éxito el primer año.','Seguir siendo el PM principal "solo mientras tanto". El mientras tanto se vuelve permanente.','Anunciar cambios grandes antes de entender por qué las cosas son como son.','Evitar la conversación con quien no rinde porque fue tu compañero.'],
core:['Hoy eres quien resuelve y construye. Eso te trajo hasta aquí y es justo lo que tienes que soltar.','Define con los accionistas qué significa éxito en tu primer año, en números.','Empieza la transición antes del cargo: asume una responsabilidad de gerente cada trimestre (presupuesto, comité comercial, relación con un fabricante).'],
quiz:[
{q:'Como gerente, ¿cuál es la mejor medida de tu trabajo?',o:['Las horas que trabajas por semana','La utilidad, la caja y la salud del equipo','Cuántos problemas técnicos resuelves tú'],a:1,e:'El esfuerzo no es la medida. El gerente responde por resultados de la empresa.'},
{q:'¿Qué conviene hacer en los primeros 30 días?',o:['Reestructurar el organigrama','Entrevistar, revisar números y escribir un diagnóstico','Lanzar una nueva línea de negocio'],a:1,e:'Primero se entiende. Los cambios estructurales llegan después del día 60.'},
{q:'¿Para qué sirven las victorias tempranas?',o:['Para demostrar que trabajas mucho','Para ganar credibilidad antes de los cambios grandes','Para reemplazar la estrategia'],a:1,e:'Resultados visibles y rápidos dan el permiso para cambios más difíciles.'}],
ex:'Escribe tu plan de 90 días como gerente.',steps:['Lista 10 personas a entrevistar en las primeras 2 semanas: equipo, clientes y fabricantes.','Escribe 5 preguntas que harás en cada entrevista.','Elige 3 victorias tempranas medibles con fecha.','Escribe qué dejarás de hacer desde el día 1.','Define cómo medirás el éxito del primer año, en números.'],
gl:[['Victoria temprana','Resultado visible que se logra en semanas y genera credibilidad.'],['Transición','Periodo en el que alguien asume un cargo nuevo y su autoridad.']],
read:[['The First 90 Days','Michael Watkins','El método estándar para asumir un cargo de dirección.','Capítulos 1 a 5: prepararte, acelerar el aprendizaje, ajustar la estrategia a la situación y asegurar victorias tempranas.']]},

{id:'foco',b:'b1',t:'Foco y energía',s:'Tu riesgo principal es la dispersión',min:40,
why:'Tu mayor riesgo no es la falta de capacidad. Es tener demasiados frentes abiertos al mismo tiempo.',
L:[
{t:'El costo real de tener muchos frentes',p:[
'Cada proyecto activo tiene un costo fijo de atención: recordarlo, revisar en qué va, retomar el contexto. Con 3 proyectos ese costo es pequeño. Con 12, se come buena parte del día aunque no avances en ninguno.',
'Gerald Weinberg estimó que con 2 proyectos simultáneos pierdes cerca del 20% del tiempo cambiando de contexto, con 3 cerca del 40% y con 5 cerca del 75%. Las cifras exactas se discuten, pero la dirección es clara: cada frente adicional cuesta más que el anterior.',
'Para un gerente esto es grave, porque las decisiones importantes necesitan bloques largos de concentración. Un presupuesto, una estrategia o una negociación no se piensan en ratos de 15 minutos entre otras cosas.'],
ex:{t:'Tiempo útil según frentes abiertos (referencia de Weinberg)',rows:[['1 frente','100% del tiempo útil'],['2 frentes','40% cada uno · 20% perdido'],['3 frentes','20% cada uno · 40% perdido'],['5 frentes','5% cada uno · 75% perdido']],note:'Es una referencia, no una ley. Sirve para ver la tendencia.'}},
{t:'Esencialismo aplicado',p:[
'Greg McKeown lo resume así: si no eliges tus prioridades, alguien más las elegirá por ti. Esencialismo es decidir conscientemente qué no hacer.',
'Una prueba simple para cada proyecto: si no lo estuviera haciendo hoy, ¿lo empezaría? Si la respuesta no es un sí claro, es candidato a pausar.',
'Pausar no es abandonar. Un proyecto pausado con fecha de revisión libera atención sin perder lo avanzado. ANKLA, J-Drums o el rig VJ pueden esperar 6 meses sin perder valor. La transición al cargo no puede esperar.'],
},
{t:'Agenda por diseño',p:[
'La agenda de un gerente se diseña. Si no, la llenan las urgencias de otros.',
'**Bloques fijos.** Dos mañanas por semana de 2 a 3 horas para pensar: estrategia, números, decisiones grandes. Un bloque semanal para 1:1 con el equipo. Un bloque para clientes y fabricantes.',
'**Energía.** Decisiones difíciles en tus horas de más energía. Correos y aprobaciones simples en las de menos. El entrenamiento y el sueño son parte del trabajo: un gerente cansado decide peor.',
'**Construir con IA.** Es tu ventaja y tu distracción favorita. Antes de construir una herramienta, pregunta: ¿esto debería hacerlo yo o alguien del equipo? ¿Resuelve un problema de la empresa o es un problema interesante?'],
ex:{t:'Ejemplo de semana tipo de gerente',rows:[['Lunes 8:30–9:30','Reunión semanal de gestión'],['Martes y jueves 8:00–10:30','Bloque de pensamiento, sin reuniones'],['Miércoles','1:1 con el equipo directivo'],['Jueves tarde','Clientes clave y fabricantes'],['Viernes 16:00','Revisión de la semana y plan de la siguiente']]}}
],
err:['Creer que la dispersión es productividad porque el día se siente lleno.','Pausar proyectos sin fecha de revisión: se vuelven culpa en vez de decisión.','Dejar que la agenda la llenen otros.','Sacrificar sueño y entrenamiento en los meses de más presión.'],
core:['Haz inventario de todos tus proyectos activos, personales y de trabajo. Si son más de 7, algo tiene que pausarse.','ANKLA, @jaywrkr y tus apps tienen valor. Dales un horario fijo para que no compitan con la gerencia.','Antes de construir, pregunta: ¿esto lo debería hacer yo?'],
quiz:[
{q:'¿Qué pasa al pasar de 3 a 5 frentes abiertos?',o:['Avanzas más porque haces más cosas','Pierdes mucho más tiempo cambiando de contexto','No cambia nada si trabajas más horas'],a:1,e:'Cada frente adicional aumenta el costo de cambiar de contexto.'},
{q:'¿Qué prueba ayuda a decidir si pausar un proyecto?',o:['¿Me gusta?','Si no lo estuviera haciendo hoy, ¿lo empezaría?','¿Ya invertí mucho tiempo?'],a:1,e:'El tiempo ya invertido no es razón para seguir. La pregunta es si hoy lo elegirías.'},
{q:'¿Para qué sirven los bloques fijos de pensamiento?',o:['Para responder correos','Para las decisiones que necesitan concentración larga','Para atender urgencias'],a:1,e:'Estrategia, presupuesto y negociación no se piensan en ratos sueltos.'}],
ex:'Haz el inventario de tus frentes y tu semana tipo.',steps:['Lista todos tus proyectos activos, personales y de trabajo.','Marca cada uno: seguir, pausar con fecha o delegar.','Quédate con un máximo de 7 activos.','Diseña tu semana con bloques fijos.','Pon los bloques en el calendario de las próximas 8 semanas.'],
gl:[['Cambio de contexto','Tiempo y energía que se pierde al pasar de una tarea a otra.'],['Esencialismo','Elegir pocas prioridades y decir no al resto.']],
read:[['Essentialism','Greg McKeown','Cómo elegir lo esencial y decir no sin culpa.','Partes 1 y 2: la esencia del esencialista y cómo explorar y eliminar.'],['Deep Work','Cal Newport','Por qué el trabajo de concentración profunda es escaso y valioso.','Parte 2, reglas 1 y 4.']]},

{id:'decisiones',b:'b1',t:'Decisiones bajo incertidumbre',s:'Decidir bien sin tener toda la información',min:45,
why:'El gerente casi nunca tiene toda la información. Su trabajo es decidir bien igual.',
L:[
{t:'Dos tipos de decisión',p:[
'Jeff Bezos las llama puertas de una vía y de dos vías. Una decisión de dos vías se puede revertir con bajo costo: probar un proveedor, cambiar un proceso interno, probar un precio. Una de una vía es difícil o caro revertir: contratar un senior, firmar un contrato largo, invertir en equipos.',
'El error común es tratar todas igual. Si tratas las reversibles como irreversibles, la empresa se vuelve lenta. Si tratas las irreversibles como reversibles, cometes errores caros.',
'Regla práctica: las reversibles se deciden rápido y lo más abajo posible en la organización. Las irreversibles se piensan con calma, con datos y llegan al gerente.'],
ex:{t:'Clasificación de decisiones en Coresolutions',rows:[['Probar una plantilla nueva de propuesta','Reversible · la decide el área'],['Dar un descuento puntual de 5%','Reversible · comercial con límite'],['Contratar un arquitecto senior','Irreversible · gerente'],['Participar en una licitación de $1 millón','Irreversible · gerente con pre-mortem'],['Comprar un laboratorio de GPUs','Irreversible · gerente y accionistas']]}},
{t:'Pensar en probabilidades',p:[
'Annie Duke, campeona de póker, explica que una buena decisión puede tener un mal resultado por azar, y una mala puede salir bien por suerte. Juzgar decisiones solo por el resultado se llama "resulting" y enseña lecciones falsas.',
'En vez de preguntar "¿va a funcionar?", pregunta "¿qué probabilidad tiene de funcionar y qué pasa en cada caso?". Eso obliga a pensar en escenarios.',
'Un método simple: valor esperado. Multiplica cada resultado posible por su probabilidad y suma. No es exacto, pero ordena el pensamiento.'],
ex:{t:'Valor esperado de una licitación',rows:[['Costo de preparar la oferta','$4.000'],['Utilidad si ganas','$60.000'],['Probabilidad de ganar','20%'],['Valor esperado','20% × $60.000 − $4.000 = $8.000'],['Si la probabilidad fuera 5%','5% × $60.000 − $4.000 = −$1.000']],note:'Con 5% de probabilidad, preparar la oferta destruye valor. Saber tu tasa real de cierre por tipo de proceso cambia qué licitaciones persigues.'}},
{t:'Herramientas para decidir mejor',p:[
'**Pre-mortem.** Antes de decidir, imagina que pasó un año y la decisión fue un desastre. Escribe por qué. Aparecen riesgos que el entusiasmo esconde. Gary Klein, su creador, mostró que este ejercicio identifica más riesgos que preguntar "¿qué podría salir mal?".',
'**Segundo orden.** Pregunta "¿y después qué?". Un descuento hoy cierra la venta, pero enseña al cliente a esperar descuentos. Contratar rápido llena un hueco, pero una mala contratación cuesta meses.',
'**Diario de decisiones.** Anota las decisiones grandes: qué decidiste, por qué, qué esperabas y con qué probabilidad. Revisa cada trimestre. Es la única forma de mejorar tu criterio con evidencia y no con memoria.'],
}
],
err:['Juzgar una decisión solo por cómo salió.','Esperar información completa que nunca llegará.','Subir al gerente decisiones reversibles que el equipo puede tomar.','Decidir algo irreversible en una reunión sin preparación.'],
core:['Lleva un diario de decisiones grandes y revísalo cada trimestre.','Haz un pre-mortem antes de toda oferta pública grande y de toda contratación senior.','Escribe qué decisiones toma cada persona del equipo sin consultarte.'],
quiz:[
{q:'Una licitación cuesta $3.000 preparar, deja $50.000 si ganas y tienes 10% de probabilidad. ¿Valor esperado?',o:['$2.000','$5.000','$47.000'],a:0,e:'10% × $50.000 = $5.000, menos $3.000 de preparación = $2.000.'},
{q:'¿Qué es un pre-mortem?',o:['Analizar un proyecto fracasado','Imaginar que la decisión fracasó y escribir por qué, antes de tomarla','Una reunión de cierre'],a:1,e:'Se hace antes, para encontrar riesgos que el entusiasmo esconde.'},
{q:'¿Quién debería decidir un cambio reversible en un proceso interno?',o:['El gerente siempre','Los accionistas','El responsable del área'],a:2,e:'Las reversibles se deciden rápido y abajo.'}],
ex:'Aplica el método a una decisión real pendiente.',steps:['Escribe la decisión en una frase.','Clasifícala: reversible o irreversible.','Escribe 3 opciones.','Haz el pre-mortem de tu favorita: 5 razones por las que fracasó.','Estima probabilidades y valor esperado si aplica.','Escribe tu decisión y qué esperas que pase. Revísala en 3 meses.'],
gl:[['Valor esperado','Suma de cada resultado multiplicado por su probabilidad.'],['Pre-mortem','Ejercicio de imaginar el fracaso antes de decidir.'],['Resulting','Juzgar una decisión solo por su resultado.']],
read:[['Thinking in Bets','Annie Duke','Decidir como un jugador de póker.','Capítulos 1 y 2: la vida es póker, no ajedrez; y qué significa apostar.'],['Decisive','Chip y Dan Heath','Un proceso de 4 pasos para decidir mejor.','Introducción y capítulo 1.']]},

{id:'comunicacion',b:'b1',t:'Comunicación de gerente',s:'Dirigir con palabras',min:40,
why:'Un gerente dirige con memos, reuniones y conversaciones. Si no es claro, el equipo adivina.',
L:[
{t:'Primero la conclusión',p:[
'Barbara Minto, consultora de McKinsey, creó el principio de la pirámide: empieza por la conclusión, después las razones, después el detalle. Quien lee entiende en 10 segundos qué quieres y decide si necesita el resto.',
'La mayoría escribe al revés: contexto, historia, análisis y al final la recomendación. El lector se pierde antes de llegar a lo importante.',
'Una estructura útil para todo mensaje es SCR: situación, complicación, resolución. Qué pasa, qué problema hay y qué propones.'],
ex:{t:'El mismo correo, dos versiones',rows:[['Versión débil','"Como saben, en los últimos meses hemos visto cambios en el mercado de licencias, y después de analizar varias opciones..." (la propuesta aparece en el párrafo 4)'],['Versión pirámide','"Propongo crear un servicio de migración desde VMware. Tres razones: 3 clientes ya lo piden, el margen es de 40% y tenemos el equipo certificado. Necesito aprobación para 2 semanas de preventa."']]}},
{t:'El memo de una página',p:[
'Amazon reemplazó las diapositivas en reuniones directivas por memos narrativos. La razón: escribir obliga a pensar con claridad. Las viñetas esconden huecos en el razonamiento.',
'Un memo de una página para decidir tiene cinco partes: situación, problema, opciones con pros y contras, recomendación y qué necesitas del lector.',
'Tu formación en diseño es una ventaja aquí. Una página bien jerarquizada, con un número clave destacado y una recomendación clara, se decide más rápido que diez diapositivas.'],
},
{t:'Tres audiencias, tres mensajes',p:[
'**Accionistas.** Quieren saber riesgo, retorno y si la empresa va bien. Dales números, tendencias y decisiones que necesitas de ellos. No los llenes de detalle operativo.',
'**Equipo.** Quiere saber hacia dónde vamos, qué se espera de cada uno y si su trabajo se ve. Repite la prioridad hasta que la digan sin ti. Reconoce en público, corrige en privado.',
'**Clientes.** Quieren resultados y tranquilidad. Habla de su negocio, no de tu tecnología.',
'Regla para todas: cuando creas que ya lo repetiste demasiado, recién lo están escuchando.'],
ex:{t:'Estructura de un informe mensual a accionistas',rows:[['1. Resumen','3 líneas: cómo fue el mes'],['2. Números','Ventas, utilidad bruta, caja, cartera, pipeline'],['3. Riesgos','Top 3 con acción'],['4. Decisiones','Lo que necesitas que aprueben'],['Extensión','Una página']]}}
],
err:['Enterrar la recomendación al final.','Usar diapositivas para esconder que no hay una recomendación clara.','Hablar de tecnología con quien quiere hablar de negocio.','Decir la prioridad una vez y asumir que todos la entendieron.'],
core:['Envía un memo mensual al equipo: números, prioridades y reconocimientos.','Prepara cada reunión con accionistas con una sola pregunta: qué decisión necesito de ellos.','Usa tu oficio de diseño en los informes: una página, jerarquía clara, un número destacado.'],
quiz:[
{q:'¿Qué va primero según el principio de la pirámide?',o:['El contexto','La conclusión o recomendación','El análisis de datos'],a:1,e:'El lector entiende qué quieres de inmediato y decide si lee el resto.'},

/* BLOQUE 2 · Fundamentos de negocio */
M.push(
{id:'contabilidad',b:'b2',t:'Contabilidad para decidir',s:'Balance, resultados y flujo',min:60,
why:'El balance dice cuánto tiene y cuánto debe la empresa. El estado de resultados dice si gana. El flujo dice si sobrevive. Necesitas leer los tres.',
L:[
{t:'El estado de resultados, línea por línea',p:[
'El estado de resultados mide lo que pasó en un periodo: un mes, un trimestre, un año. Va de arriba hacia abajo restando costos hasta llegar a la utilidad.',
'**Ventas** es todo lo facturado. **Costo de ventas** es lo que cuesta directamente lo que vendiste: hardware, licencias, horas de ingenieros asignados al proyecto. La resta es la **utilidad bruta**. Para un integrador es el número más importante, porque con ella se paga todo lo demás.',
'**Gastos operativos** son los que existen vendas o no: sueldos administrativos y comerciales, oficina, sistemas, marketing. Utilidad bruta menos gastos operativos da el **EBITDA**. Después se restan depreciación, intereses, la participación de trabajadores y el impuesto a la renta.',
'En Ecuador, el 15% de la utilidad contable va a los trabajadores, y el impuesto a la renta de sociedades se calcula después de esa participación. Ese orden importa al proyectar cuánto queda para los accionistas.'],
ex:{t:'Estado de resultados ilustrativo de un integrador',rows:[['Ventas','$2.400.000'],['Costo de ventas','−$1.800.000'],['Utilidad bruta','$600.000 · 25%'],['Gastos operativos','−$450.000'],['EBITDA','$150.000'],['Depreciación','−$20.000'],['Intereses','−$10.000'],['Utilidad antes de participación','$120.000'],['15% trabajadores','−$18.000'],['Impuesto a la renta 25%','−$25.500'],['Utilidad neta','$76.500 · 3,2% de las ventas']],note:'Cifras de ejemplo. Por cada $100 vendidos quedan $3,20 para los accionistas. Por eso el margen bruto importa tanto.'}},
{t:'El balance general',p:[
'El balance es una foto en un día. Muestra lo que la empresa tiene (activos), lo que debe (pasivos) y lo que es de los accionistas (patrimonio). Siempre se cumple: activos = pasivos + patrimonio.',
'**Activo corriente** es lo que se convierte en dinero en menos de un año: caja, cuentas por cobrar, inventario. **Pasivo corriente** es lo que hay que pagar en menos de un año: proveedores, impuestos, préstamos de corto plazo.',
'Para un integrador, la línea más vigilada es **cuentas por cobrar**. Es dinero que ya ganaste pero que todavía está en manos del cliente. Si crece más rápido que las ventas, tienes un problema de cobranza.',
'Cuatro indicadores resumen la salud: **liquidez corriente** (activo corriente / pasivo corriente, sano sobre 1,5), **endeudamiento** (pasivo total / patrimonio), **días de cobro** y **días de pago**.'],
ex:{t:'Indicadores con el balance de ejemplo',rows:[['Activo corriente / pasivo corriente','$900.000 / $600.000 = 1,5'],['Pasivo total / patrimonio','$800.000 / $500.000 = 1,6'],['Días de cobro','$420.000 / $2.400.000 × 365 = 64 días'],['Días de pago','$280.000 / $1.800.000 × 365 = 57 días']],note:'La empresa cobra en 64 días y paga en 57. Financia a sus clientes una semana con su propio dinero.'}},
{t:'Por qué la utilidad no es caja',p:[
'La contabilidad registra una venta cuando se factura, no cuando se cobra. Por eso una empresa puede tener utilidad y no tener dinero.',
'El estado de flujo de efectivo explica la diferencia. Parte de la utilidad neta, suma lo que no es salida de dinero (como la depreciación) y ajusta por cambios en capital de trabajo: si las cuentas por cobrar suben, la caja baja; si las cuentas por pagar suben, la caja sube.',
'Tiene tres partes: flujo operativo (el negocio), flujo de inversión (equipos, compras de empresas) y flujo de financiamiento (préstamos, dividendos). Un negocio sano genera caja en la parte operativa.'],
ex:{t:'De utilidad a caja en un año',rows:[['Utilidad neta','$76.500'],['+ Depreciación','$20.000'],['− Aumento de cuentas por cobrar','−$120.000'],['+ Aumento de cuentas por pagar','$30.000'],['Flujo operativo','$6.500']],note:'Ganaste $76.500 pero solo entraron $6.500. El resto quedó en facturas por cobrar.'}}
],
err:['Mirar solo las ventas y no la utilidad bruta.','Confundir utilidad con caja disponible.','Leer los estados financieros una vez al año, cuando ya no se puede corregir nada.','No separar el costo de ventas por línea de negocio.'],
core:['Pide los estados financieros de los últimos 3 años y léelos con el contador hasta entender cada línea.','Hay facturas sin vínculo claro a proyectos o servicios. Sin esa conexión no sabes qué es rentable.','Calcula los días de cobro por tipo de cliente: público, financiero y privado.'],
tool:'ratios',
quiz:[
{q:'Ventas $1.000.000, costo de ventas $780.000. ¿Margen bruto?',o:['78%','22%','12%'],a:1,e:'Utilidad bruta $220.000 / ventas $1.000.000 = 22%.'},
{q:'La utilidad neta es alta pero la caja bajó. ¿Causa más probable?',o:['Subieron las cuentas por cobrar','Bajó la depreciación','Subieron las cuentas por pagar'],a:0,e:'Facturaste pero no cobraste. El dinero está en manos del cliente.'},
{q:'Cuentas por cobrar $300.000 y ventas anuales $1.825.000. ¿Días de cobro?',o:['30','60','90'],a:1,e:'$300.000 / $1.825.000 × 365 = 60 días.'}],
ex:'Calcula la salud financiera de Coresolutions.',steps:['Pide balance y estado de resultados de los últimos 3 años.','Calcula utilidad bruta y margen bruto de cada año.','Calcula los 4 indicadores con la herramienta.','Calcula el flujo operativo aproximado de cada año.','Escribe qué cambió y por qué en 5 líneas.'],
gl:[['Utilidad bruta','Ventas menos costo directo de lo vendido.'],['EBITDA','Utilidad antes de intereses, impuestos, depreciación y amortización.'],['Activo corriente','Lo que se convierte en dinero en menos de un año.'],['Días de cobro (DSO)','Días promedio que tardas en cobrar.']],
read:[['Financial Intelligence','Karen Berman y Joe Knight','Finanzas para gerentes que no son contadores.','Partes 1 a 4: el arte de las finanzas, estado de resultados, balance y flujo.']]},

{id:'caja',b:'b2',t:'Caja y capital de trabajo',s:'Rentable no es lo mismo que solvente',min:55,
why:'Las empresas de integración rara vez quiebran por falta de ventas. Quiebran por falta de caja.',
L:[
{t:'El ciclo de caja',p:[
'El ciclo de conversión de caja mide cuántos días está tu dinero fuera de la empresa. Se calcula como días de inventario + días de cobro − días de pago.',
'Un integrador suele tener poco inventario, pero días de cobro altos, sobre todo con clientes públicos. Si pagas a tu mayorista a 45 días y cobras a 90, financias 45 días de cada venta con tu dinero.',
'Cada día que reduces el ciclo libera caja. Cobrar 10 días antes, en una empresa que vende $2,4 millones al año, libera cerca de $66.000.'],
ex:{t:'Cuánto vale un día de cobro',rows:[['Ventas anuales','$2.400.000'],['Ventas por día','$2.400.000 / 365 = $6.575'],['Reducir 10 días de cobro','Libera unos $65.750'],['Reducir 30 días','Libera unos $197.000']]}},
{t:'Crecer consume caja',p:[
'Es contraintuitivo: vender más puede dejarte sin dinero. Cuando las ventas suben, también suben las cuentas por cobrar, y ese aumento hay que financiarlo antes de cobrarlo.',
'Por eso las empresas de servicios en crecimiento necesitan crédito aunque sean rentables. El crédito se negocia cuando no lo necesitas: cuando lo necesitas, es caro o no hay.',
'Las fuentes de capital de trabajo son: anticipos del cliente, mayor plazo con mayoristas, líneas de crédito bancarias, factoring (vender facturas por cobrar con descuento) y utilidades retenidas.'],
ex:{t:'Caja que consume crecer 20%',rows:[['Ventas actuales','$2.400.000'],['Crecimiento 20%','+$480.000'],['Días de cobro','64'],['Cuentas por cobrar adicionales','$480.000 × 64 / 365 = $84.000'],['Lectura','Necesitas $84.000 más de capital solo para sostener el crecimiento']]}},
{t:'Proyectos públicos con las reglas de 2026',p:[
'El reglamento de contratación pública reformado el 30 de julio de 2026 da al Estado hasta dos meses para pagar desde que se cumplen los requisitos contractuales. Antes eran 30 días. Si sumas el tiempo de recepción y trámite, el cobro real puede pasar de 90 días.',
'Además, en contratos de $1 millón o más, se retiene una contribución de 0,4% de cada factura neta, que el SERCOP puede subir hasta 0,5%. Va directo contra tu margen.',
'Todo proyecto público con hardware debe evaluarse con su brecha de caja antes de ofertar: cuánto capital necesitas, por cuántos días, a qué costo y de dónde sale.',
'La herramienta proyección de 13 semanas es el estándar para controlar esto: una tabla semana a semana con cobros esperados, pagos comprometidos y saldo. Se actualiza cada lunes.'],
ex:{t:'Brecha de caja de un proyecto público',rows:[['Valor del proyecto','$280.000'],['Costo de producto 75%','$210.000'],['Pagas al mayorista','Día 45'],['Cobras al Estado','Día 100'],['Brecha','55 días con $210.000 fuera'],['Costo financiero al 12% anual','$3.797'],['Impacto en margen','Se come 5,4% de los $70.000 de margen']]}}
],
err:['Celebrar una venta grande sin calcular cuánta caja consume.','Pedir crédito cuando ya lo necesitas.','No tener una proyección de caja semanal.','Cobrar solo cuando el cliente se acuerda de pagar.'],
core:['Cada proyecto público necesita más capital de trabajo que antes de julio de 2026.','Los contratos de $1 millón o más aportan 0,4% de cada factura neta. Va en el precio.','Ten una línea de crédito aprobada cuando no la necesitas.'],
tool:'cash',
quiz:[
{q:'Días de inventario 5, días de cobro 70, días de pago 45. ¿Ciclo de caja?',o:['30 días','120 días','20 días'],a:0,e:'5 + 70 − 45 = 30 días.'},
{q:'¿Por qué crecer puede dejar sin caja a una empresa rentable?',o:['Porque baja el margen','Porque suben las cuentas por cobrar antes de cobrarlas','Porque suben los impuestos'],a:1,e:'Más ventas significa más dinero esperando cobro.'},
{q:'¿Cuándo conviene negociar una línea de crédito?',o:['Cuando falta caja','Cuando la empresa está sana','Nunca, es caro'],a:1,e:'Con la empresa sana consigues mejores condiciones.'}],
ex:'Arma una proyección de caja de 13 semanas.',steps:['Lista la caja disponible hoy.','Lista cobros esperados por semana, cliente por cliente.','Lista pagos comprometidos: nómina, proveedores, impuestos, IESS.','Calcula el saldo semana a semana.','Marca las semanas con saldo bajo el mínimo y escribe qué harás.'],
gl:[['Capital de trabajo','Recursos necesarios para operar entre que pagas y cobras.'],['Ciclo de caja','Días de inventario + días de cobro − días de pago.'],['Factoring','Vender facturas por cobrar a cambio de dinero inmediato con descuento.']],
read:[['Scaling Up','Verne Harnish','Las palancas para liberar caja atrapada.','La sección de caja completa: las 7 palancas del flujo.'],['Profit First','Mike Michalowicz','Un sistema simple para proteger caja.','Capítulos 1 a 4.']],
src:['regl']},

{id:'inversion',b:'b2',t:'Evaluar inversiones',s:'VAN, TIR y payback',min:60,
why:'Contratar, comprar GPUs, abrir oficina o comprar cartera: todo es inversión. Se evalúa con el mismo método.',
L:[
{t:'El valor del dinero en el tiempo',p:[
'Un dólar hoy vale más que un dólar en un año. Puedes invertirlo, y además el dólar futuro tiene riesgo de no llegar. Por eso, para comparar dinero de distintos años, se lo trae a valor presente.',
'La fórmula es simple: valor presente = flujo futuro / (1 + tasa)^años. Con una tasa de 14%, $100 dentro de un año valen hoy $87,72. Dentro de dos años, $76,95.',
'La tasa de descuento representa lo que te cuesta el dinero o lo que podrías ganar en otra inversión de riesgo parecido. En Ecuador es alta: el crédito empresarial y el riesgo país la empujan hacia arriba. Un 12% a 16% es una referencia razonable para una empresa mediana.'],
ex:{t:'$100 en el futuro, traídos a hoy al 14%',rows:[['En 1 año','$87,72'],['En 2 años','$76,95'],['En 3 años','$67,50'],['En 4 años','$59,21']]}},
{t:'VAN, TIR y payback',p:[
'**VAN (valor actual neto).** Traes todos los flujos futuros a valor presente y restas la inversión. Si es positivo, la inversión crea valor a esa tasa. Es la medida más confiable.',
'**TIR (tasa interna de retorno).** Es la tasa a la que el VAN es cero. Si la TIR es mayor que tu tasa de descuento, el proyecto conviene. Es fácil de comunicar, pero puede engañar al comparar proyectos de distinto tamaño.',
'**Payback.** Cuántos años tardas en recuperar lo invertido, sin descontar. Es simple y útil cuando la caja es limitada, pero ignora lo que pasa después y el valor del dinero en el tiempo.',
'Usa las tres juntas. El ejemplo de abajo muestra por qué: el payback parece aceptable y aun así la inversión no crea valor.'],
ex:{t:'Inversión de $120.000 a 4 años, tasa 14%',rows:[['Flujos','$30.000 · $36.000 · $43.200 · $51.840'],['Payback','3,2 años'],['TIR','11,7%'],['VAN al 14%','−$6.131'],['Lectura','Se recupera en 3 años, pero rinde menos que el costo del dinero. No crea valor.']]}},
{t:'Comprar o arrendar: el caso GPU',p:[
'La pregunta de la IA on-premise es una decisión de inversión: comprar GPUs propias, arrendar capacidad o revender una plataforma.',
'Para comparar, trae a valor presente el costo de cada opción en el mismo horizonte. Incluye todo: energía, mantenimiento, personal, y el riesgo de que el equipo quede obsoleto antes de tiempo.',
'Comprar da control y margen si el uso es alto y constante. Arrendar da flexibilidad si la demanda es incierta. Con la crisis eléctrica, la energía y el respaldo son costos reales de comprar.',
'Contratar también es una inversión. Un ingeniero senior que cuesta $30.000 al año debe generar más que eso en utilidad bruta. Calcula su payback antes de abrir la vacante.'],
ex:{t:'Comprar vs arrendar (ilustrativo)',rows:[['Comprar','$120.000 hoy + energía y mantenimiento'],['Arrendar','$3.500 al mes = $42.000 al año'],['Valor presente del arriendo, 4 años al 14%','$122.376'],['Lectura','Casi iguales antes de energía. Si la demanda es incierta, arrendar primero reduce el riesgo.']]}}
],
err:['Decidir inversiones solo por payback.','Usar una tasa de descuento baja para que el proyecto "dé".','Olvidar costos ocultos: energía, personal, obsolescencia.','Comparar solo el precio de compra y no el costo total en el tiempo.'],
core:['IA on-premise: compara GPUs propias contra arrendar capacidad o revender una plataforma.','En Ecuador la tasa de descuento es alta: el costo del crédito y el riesgo país la empujan hacia arriba.','Contratar un ingeniero senior es una inversión con payback. Calcúlalo antes de abrir la vacante.'],
tool:'van',
quiz:[
{q:'Un proyecto tiene TIR de 10% y tu tasa de descuento es 14%. ¿Conviene?',o:['Sí, la TIR es positiva','No, rinde menos que el costo del dinero','Depende solo del payback'],a:1,e:'Si la TIR es menor que la tasa, el VAN es negativo.'},
{q:'¿Cuánto valen hoy $1.000 dentro de un año al 10%?',o:['$900','$909','$1.100'],a:1,e:'$1.000 / 1,10 = $909.'},
{q:'¿Cuál es la medida más confiable para decidir?',o:['Payback','VAN','Precio de compra'],a:1,e:'El VAN considera todos los flujos y el valor del dinero en el tiempo.'}],
ex:'Evalúa una inversión real con la herramienta.',steps:['Elige una inversión real: laboratorio de IA, nuevo ingeniero o una herramienta.','Estima la inversión inicial completa.','Estima el flujo neto de cada año por 4 años.','Usa una tasa de 14%.','Calcula VAN, TIR y payback.','Escribe tu decisión y qué supuesto, si cambia, la cambiaría.'],
gl:[['VAN','Valor actual neto: flujos futuros descontados menos la inversión.'],['TIR','Tasa a la que el VAN es cero.'],['Payback','Tiempo para recuperar la inversión.'],['Tasa de descuento','Costo del dinero o rendimiento alternativo exigido.']],
read:[['Corporate Finance Essentials','IESE Business School (curso en Coursera)','Finanzas corporativas con casos, en pocas semanas.','Módulos de valor del dinero en el tiempo y evaluación de proyectos.'],['Valuation','McKinsey & Company','La referencia profesional en valoración.','Capítulos introductorios sobre creación de valor.']]},

{id:'presupuesto',b:'b2',t:'Presupuesto y plan anual',s:'La estrategia en números',min:50,
why:'El presupuesto es la estrategia traducida a números. Sin él, cada gasto se discute desde cero.',
L:[
{t:'Construirlo hacia atrás',p:[
'Un presupuesto útil empieza por la utilidad que quieres y va hacia atrás: qué utilidad bruta necesitas, de qué líneas sale, cuántas ventas implica y cuánto pipeline necesitas para lograrlas.',
'Esto obliga a ver si la meta es posible. Si para ganar $150.000 necesitas vender el doble que el año pasado sin más equipo, la meta no es real.',
'El gasto fijo se presupuesta una vez al año y se aprueba en bloque. Así no se discute cada gasto pequeño y el gerente revisa solo las desviaciones.'],
ex:{t:'Presupuesto hacia atrás (ilustrativo)',rows:[['Meta de EBITDA','$150.000'],['Gasto fijo','$450.000'],['Utilidad bruta necesaria','$600.000'],['De servicios (margen 40%)','$200.000 → ventas $500.000'],['De recurrente (margen 55%)','$110.000 → ventas $200.000'],['De reventa (margen 12%)','$290.000 → ventas $2.416.667'],['Ventas totales','$3.116.667']],note:'Mira cuánto hay que vender en reventa para generar la misma utilidad que poco ingreso recurrente.'}},
{t:'Escenarios',p:[
'Un solo número es una apuesta. Tres escenarios son un plan. El base es lo que esperas; el pesimista, lo que pasa si dos cosas importantes salen mal; el optimista, si salen bien.',
'Lo importante del pesimista no es el número sino la respuesta: qué gastos recortas, qué contrataciones congelas y en qué momento lo decides. Decidirlo con calma en noviembre es mejor que improvisar en julio.',
'Para 2027 hay un riesgo concreto: el Banco Central estima que un fenómeno de El Niño podría restar entre 0,5 y 1,4 puntos al crecimiento del país. Sumado al estiaje y a los plazos de pago públicos, merece un escenario propio.'],
ex:{t:'Tres escenarios 2027 (ilustrativo)',rows:[['Optimista','Ventas +15% · EBITDA $210.000'],['Base','Ventas +8% · EBITDA $150.000'],['Pesimista','Ventas −5%, cobro público +30 días · EBITDA $40.000'],['Disparador','Si al cierre de marzo las ventas van −10%, se activa el plan pesimista']]}},
{t:'Control mensual',p:[
'El presupuesto sirve si se compara cada mes con lo real. Las diferencias de más de 10% se explican por escrito: qué pasó y qué se hace.',
'Usa un forecast móvil: cada trimestre actualizas la proyección del año con lo que ya sabes. El presupuesto original queda como referencia; el forecast es tu mejor estimación actual.',
'Asigna un dueño a cada línea. Comercial responde por ventas y margen; operaciones por costos de entrega; administración por gastos fijos.'],
}
],
err:['Hacer el presupuesto sumando 10% al año anterior.','Presupuestar ventas sin calcular el pipeline que las sostiene.','No tener escenario pesimista ni disparadores.','Aprobar el presupuesto y no volver a mirarlo.'],
core:['Arma el presupuesto 2027 como tu primer entregable de gerente, aunque todavía no lo seas.','Incluye un escenario El Niño 2027.','Asigna presupuesto propio a la apuesta de IA, separado del negocio actual.'],
tool:'mix',
quiz:[
{q:'Quieres $100.000 de EBITDA con $400.000 de gasto fijo. ¿Qué utilidad bruta necesitas?',o:['$400.000','$500.000','$300.000'],a:1,e:'Utilidad bruta − gasto fijo = EBITDA. $500.000 − $400.000 = $100.000.'},
{q:'¿Qué es lo más útil del escenario pesimista?',o:['El número final','Las acciones y el momento en que se activan','Mostrarlo a los clientes'],a:1,e:'El valor está en decidir la respuesta antes de necesitarla.'},
{q:'¿Qué es un forecast móvil?',o:['Cambiar el presupuesto cada mes','Actualizar la proyección del año con lo que ya sabes','Una herramienta de ventas'],a:1,e:'El presupuesto queda de referencia y el forecast muestra la mejor estimación actual.'}],
ex:'Arma el presupuesto 2027 en una página.',steps:['Define la meta de EBITDA.','Lista el gasto fijo anual.','Calcula la utilidad bruta necesaria.','Distribúyela por línea y calcula las ventas de cada una.','Calcula el pipeline necesario con tu tasa de cierre.','Arma escenarios base, pesimista y optimista con disparadores.'],
gl:[['Forecast','Proyección actualizada con la información más reciente.'],['Disparador','Condición que activa un plan predefinido.']],
read:[['Profit First','Mike Michalowicz','Un sistema simple para proteger utilidad y caja.','Capítulos 1 a 5.'],['Beyond Budgeting','Jeremy Hope y Robin Fraser','Críticas al presupuesto rígido y alternativas.','Capítulos 1 y 2.']]},

{id:'precios',b:'b2',t:'Precios y márgenes',s:'La palanca más fuerte de la utilidad',min:50,
why:'El precio es la decisión con más impacto en la utilidad. Un punto de precio vale más que un punto de volumen.',
L:[
{t:'Por qué el precio pesa tanto',p:[
'En una empresa con 25% de margen bruto, subir el precio 1% sin perder clientes sube la utilidad bruta 4%. Vender 1% más solo la sube 1%.',
'Lo inverso también es cierto. Un descuento de 10% con 25% de margen reduce la utilidad por venta de 25 a 15. Para ganar lo mismo necesitas vender 67% más.',
'Por eso los descuentos se controlan con una política: quién puede dar cuánto y qué se recibe a cambio.'],
ex:{t:'El efecto de un descuento de 10%',rows:[['Precio','$100 → $90'],['Costo','$75'],['Margen','$25 → $15'],['Volumen necesario para ganar lo mismo','25 / 15 = 1,67 veces'],['Lectura','67% más ventas solo para quedar igual']]}},
{t:'Tres formas de fijar precio',p:[
'**Costo más margen.** Sumas costo directo y un margen. Es simple y seguro, pero ignora cuánto vale el resultado para el cliente.',
'**Precio de mercado.** Te alineas con la competencia. Útil en productos comparables como hardware y licencias, donde el cliente compara cotizaciones.',
'**Precio por valor.** Cobras según el resultado para el cliente: horas de caída evitadas, multas regulatorias evitadas, horas de su personal liberadas. Es la forma de cobrar más por servicios.',
'La clave del precio por valor es cuantificar. Si no puedes poner un número al valor, el cliente comparará solo tu costo.'],
ex:{t:'Precio por valor en continuidad',rows:[['Costo para un banco por hora de caída','$5.000 (supuesto)'],['Horas de caída evitadas por año','10'],['Valor para el cliente','$50.000 al año'],['Precio del servicio','$15.000 al año'],['Lectura','El cliente recibe 3 veces lo que paga. Tu costo real es irrelevante para él.']]}},
{t:'Paquetes y política de descuentos',p:[
'Ofrecer tres paquetes (básico, estándar, premium) cambia la pregunta del cliente de "¿compro o no?" a "¿cuál compro?". La mayoría elige el del medio.',
'El paquete premium sirve aunque se venda poco: hace que el estándar parezca razonable.',
'Una política de descuentos tiene límites por rol (por ejemplo, comercial hasta 5%, gerente hasta 10%, más requiere accionistas) y exige algo a cambio: pago anticipado, contrato más largo, volumen o referencia.',

],

{id:'valuacion',b:'b2',t:'Cuánto vale Coresolutions',s:'Trabajar para el valor de la empresa',min:45,
why:'El gerente trabaja para los accionistas, y lo que ellos tienen es el valor de la empresa. Tu trabajo es hacerlo crecer.',
L:[
{t:'Cómo se valora una empresa de servicios',p:[
'El método más común para empresas medianas es un múltiplo de EBITDA. Un comprador paga cierto número de veces la utilidad operativa anual, más la caja neta de deuda.',
'El múltiplo cambia mucho según la empresa. Uno bajo refleja riesgo: utilidad que depende del dueño, de pocos clientes o de proyectos que no se repiten. Uno alto refleja ingresos previsibles y crecimiento.',
'Otro método es el flujo de caja descontado: proyectas los flujos futuros y los traes a valor presente, como en el módulo de inversiones. Es más preciso, pero depende mucho de los supuestos.'],
ex:{t:'Valor con distinto múltiplo (ilustrativo)',rows:[['EBITDA','$250.000'],['Con múltiplo 3,75x','$937.500 + caja neta $100.000 = $1.037.500'],['Con múltiplo 5x','$1.250.000 + $100.000 = $1.350.000'],['Diferencia','$312.500 sin cambiar la utilidad']],note:'Los múltiplos reales dependen del comprador y del momento. Úsalos para ver la dirección, no como precio.'}},
{t:'Qué sube y qué baja el valor',p:[
'**Sube:** contratos recurrentes, crecimiento sostenido, márgenes estables, clientes diversificados, procesos documentados, equipo que opera sin el dueño, certificaciones y alianzas sólidas.',
'**Baja:** un cliente que pesa más de 20–25% de la utilidad, dependencia de una sola marca, dependencia de una persona clave, contabilidad desordenada, contingencias legales o tributarias.',
'Por eso el trabajo diario del gerente tiene impacto en el valor. Documentar un proceso, firmar un contrato recurrente o diversificar clientes aumenta lo que vale la empresa aunque no cambie la utilidad del año.'],
},
{t:'Activos que no están en el balance',p:[
'Coresolutions tiene activos que la contabilidad no registra: más de 20 años de relaciones, certificación ISO 27001, base instalada en clientes que renovarán equipos, ingenieros certificados y reputación en el Austro.',
'Un comprador o un banco los valora si puedes mostrarlos con evidencia: contratos firmados, renovaciones previstas, tasa de retención de clientes, certificaciones vigentes.',
'Pregunta a los accionistas su horizonte: crecer, mantener o vender algún día. La respuesta cambia las prioridades. Si quieren vender en 5 años, la recurrencia y la independencia del dueño son la prioridad absoluta.'],
}
],
err:['Medir el éxito solo por ventas del año.','Ignorar la concentración de clientes hasta que uno se va.','Tener la utilidad dependiendo del conocimiento de una persona.','No documentar los procesos clave.'],
core:['20 años de relaciones y la certificación ISO 27001 son activos que no aparecen en el balance.','La palanca más grande que tienes a mano: pasar ingreso de proyectos a contratos recurrentes.','Pregunta a los accionistas su horizonte: crecer, mantener o vender algún día.'],
tool:'valor',
quiz:[
{q:'¿Qué sube más el múltiplo de una empresa de servicios?',o:['Más ventas de hardware','Más ingreso recurrente y menos dependencia del dueño','Más empleados'],a:1,e:'Los compradores pagan por previsibilidad y autonomía.'},
{q:'EBITDA $200.000, múltiplo 4x, caja neta $50.000. ¿Valor?',o:['$800.000','$850.000','$250.000'],a:1,e:'$200.000 × 4 + $50.000 = $850.000.'},
{q:'Un cliente representa 35% de la utilidad. ¿Qué efecto tiene en el valor?',o:['Lo sube','Lo baja por concentración','No tiene efecto'],a:1,e:'Si ese cliente se va, la empresa pierde un tercio de su utilidad.'}],
ex:'Estima el valor de Coresolutions y cómo subirlo.',steps:['Calcula el EBITDA del último año.','Estima la caja neta de deuda.','Usa la herramienta con tu porcentaje recurrente y concentración real.','Lista lo que hoy baja el valor.','Escribe 3 acciones que lo suben en 3 años, con responsable.'],
gl:[['Múltiplo','Número de veces el EBITDA que se paga por una empresa.'],['Caja neta','Caja menos deuda financiera.'],['Concentración','Peso de un cliente o proveedor en el total.']],
read:[['Built to Sell','John Warrillow','Cómo una empresa de servicios se vuelve valiosa y deja de depender del dueño.','Libro completo; es corto y en forma de historia.']]}
);

M.push(
{id:'economia',b:'b3',t:'Economía dolarizada',s:'Por qué te pagan cuando te pagan',min:55,
why:'Ecuador no emite moneda. La liquidez depende de cuántos dólares entran al país. Eso decide cuándo te pagan.',
L:[
{t:'Cómo funciona una economía sin moneda propia',p:[
'Desde el año 2000 Ecuador usa el dólar. El Banco Central no puede imprimir dinero, así que la cantidad de dólares en la economía depende de los que entran y salen del país.',
'Entran por exportaciones (petróleo, camarón, banano, cacao, minería), remesas de migrantes, inversión extranjera y deuda externa. Salen por importaciones, pago de deuda y salida de capitales.',
'Cuando entran más dólares de los que salen, hay liquidez: los bancos prestan, las empresas invierten y el Estado paga a tiempo. Cuando entran menos, todo se aprieta. No hay devaluación que amortigüe el golpe: el ajuste llega por menos crédito, menos gasto público y pagos atrasados.',
'La ventaja para una empresa como Coresolutions: no hay riesgo cambiario con tus fabricantes, que facturan en dólares. La desventaja: no hay herramientas monetarias para suavizar una crisis.'],
ex:{t:'Cadena de efectos de un precio del petróleo bajo',rows:[['1','Entran menos dólares por exportación petrolera'],['2','Bajan los ingresos fiscales'],['3','El Estado recorta inversión y atrasa pagos'],['4','Entidades públicas postergan proyectos de TI'],['5','Tu cartera pública cobra más tarde']]}},
{t:'El Estado como cliente',p:[
'El gasto público sigue a la caja fiscal. Cuando el fisco tiene liquidez, las entidades ejecutan su presupuesto; cuando no, aparecen los atrasos con proveedores.',
'Las empresas públicas con ingresos propios, como algunas eléctricas y empresas municipales de servicios, suelen pagar mejor que las entidades que dependen del presupuesto central. Pero también dependen de transferencias y tarifas.',
'Para un integrador, esto significa clasificar a los clientes públicos por su fuente de ingresos, no solo por su tamaño. Y medir días de cobro reales por cliente, no los del contrato.'],
},
{t:'Los indicadores que debes seguir',p:[
'**Crecimiento.** El Banco Central subió en septiembre de 2026 su previsión de crecimiento para 2026 de 2,5% a 2,7%. Proyecta consumo de hogares +3,3% e inversión +5,8%. Para 2027–2030 espera un promedio de 2,5% anual.',
'**Riesgo país.** Mide cuánto más que Estados Unidos le cobran a Ecuador por prestarle. Durante 2026 bajó a mínimos de más de una década, cerca de 380 puntos, y volvió a 496 a fines de septiembre después de cambios en el gabinete económico. Cuando sube, el crédito se encarece para el Estado y para tus clientes.',
'**Inflación.** El Banco Central proyecta un promedio de 2,1% para 2026. Baja, por efecto de la dolarización.',
'**Remesas.** Se proyectan cerca de $8.000 millones en 2026. Sostienen el consumo y la liquidez de cooperativas, un segmento grande de tus clientes.',
'**El Niño 2027.** El Banco Central estima que podría restar entre 0,5 y 1,4 puntos al crecimiento de 2027, según su intensidad. Afectaría exportaciones como camarón, banano y cacao.'],
ex:{t:'Tablero macro de referencia · octubre 2026',rows:[['Crecimiento 2026 (previsión BCE)','2,7%'],['Inflación promedio 2026 (previsión)','2,1%'],['Riesgo país a fines de septiembre','496 puntos'],['Remesas 2026 (previsión)','≈ $8.020 millones'],['Reservas internacionales (previsión)','≈ $11.239 millones'],['Impacto El Niño en 2027','−0,5 a −1,4 puntos']],note:'Actualiza estos números cada mes. Cambian rápido.'}}
],
err:['Planificar el año sobre el mejor mes del riesgo país.','Tratar a todos los clientes públicos igual.','Ignorar la economía porque "lo nuestro es tecnología".','Suponer que los plazos de pago del contrato son los reales.'],
core:['El Banco Central subió su previsión de crecimiento 2026 a 2,7%.','El riesgo país es volátil. No planifiques sobre el mejor mes.','Un fenómeno de El Niño podría restar entre 0,5 y 1,4 puntos al crecimiento de 2027.'],
quiz:[
{q:'¿Por qué el Estado ecuatoriano atrasa pagos cuando cae el petróleo?',o:['Porque devalúa la moneda','Porque entran menos dólares y baja la caja fiscal','Porque sube la inflación'],a:1,e:'Sin moneda propia, menos dólares significa menos caja para pagar.'},
{q:'¿Qué mide el riesgo país?',o:['La inflación','Cuánto más le cobran a Ecuador por prestarle','El desempleo'],a:1,e:'Es el diferencial de tasa frente a bonos de Estados Unidos.'},
{q:'¿Qué ventaja da la dolarización a Coresolutions?',o:['El Estado paga más rápido','No hay riesgo cambiario con fabricantes que facturan en dólares','Los márgenes suben'],a:1,e:'Compras y vendes en la misma moneda.'}],
ex:'Arma tu tablero macro mensual.',steps:['Elige 6 indicadores: crecimiento, riesgo país, inflación, petróleo, remesas y atrasos del Estado.','Anota el valor actual y su fuente.','Escribe cómo afecta cada uno a Coresolutions.','Define un umbral de alerta para cada uno.','Programa una revisión mensual de 15 minutos.'],
gl:[['Dolarización','Uso del dólar como moneda oficial.'],['Riesgo país','Prima que paga un país sobre la tasa de Estados Unidos.'],['Remesas','Dinero que envían los migrantes a sus familias.']],

{id:'energia',b:'b3',t:'Energía y continuidad',s:'Riesgo operativo y oportunidad comercial',min:45,
why:'La crisis eléctrica es un riesgo para tu operación y una oportunidad para tu oferta.',
L:[
{t:'Qué está pasando',p:[
'Ecuador depende mayoritariamente de hidroeléctricas. Cuando llega el estiaje, la temporada seca, los embalses bajan y falta generación. En 2024 eso llevó a cortes programados de hasta 14 horas diarias en varias zonas del país.',
'Para el estiaje de 2026 se estima un déficit de hasta 1.391 MW, con las semanas más críticas entre octubre de 2026 y comienzos de 2027. El Gobierno afirma que no habrá cortes residenciales.',
'Para lograrlo, 185 grandes consumidores industriales enfrentan desconexiones de 24 a 48 horas o más. Evitar cortes más amplios depende de que el estiaje sea menos severo de lo previsto, de los caudales en Coca Codo Sinclair y Mazar, de barcazas y de nuevas térmicas previstas hacia abril de 2027.'],
ex:{t:'Datos del estiaje 2026',rows:[['Déficit estimado','Hasta 1.391 MW'],['Periodo crítico','Octubre 2026 a comienzos de 2027'],['Grandes consumidores afectados','185, con cortes de 24 a 48 horas o más'],['Nueva térmica esperada','650 MW hacia abril de 2027']]}},
{t:'El riesgo para Coresolutions',p:[
'Tu operación depende de electricidad: oficinas, cloud propio, servicios de monitoreo, equipos de laboratorio. Un corte largo puede afectar el servicio que das a clientes con contrato.',
'Revisa tres cosas: respaldo eléctrico en cada sitio y cuántas horas aguanta; qué servicios a clientes dependen de tu infraestructura y qué dicen los contratos sobre disponibilidad; y si tu monitoreo sigue funcionando cuando tu propia oficina se queda sin luz.',
'También hay riesgo en la cartera: clientes industriales con cortes de 48 horas pierden producción y pueden atrasar pagos o postergar proyectos.'],
},
{t:'La oportunidad comercial',p:[
'Las empresas necesitan seguir operando con cortes. Eso es continuidad de negocio: respaldo eléctrico, sitio alterno, replicación de datos, pruebas de arranque y monitoreo.',
'Tu proyecto de migración de datacenter con sitio de contingencia, replicación activo-activo y pruebas de arranque desde el sitio alterno es exactamente lo que este mercado necesita. Ya tienes un caso que contar.',
'Una oferta clara de entrada: evaluación de continuidad ante cortes. Revisas qué sistemas son críticos, cuánto aguantan sin energía, qué pasa si cae el sitio principal y qué se necesita. Precio fijo, entregable en 2 semanas y una propuesta de solución al final.',
'Los mejores objetivos son clientes industriales y financieros, que pierden más por hora de caída.'],
ex:{t:'Oferta de entrada (ilustrativo)',rows:[['Nombre','Evaluación de continuidad ante cortes'],['Alcance','Inventario de sistemas críticos, autonomía eléctrica, prueba de recuperación'],['Entregable','Informe con riesgos, prioridades y presupuesto'],['Precio','Fijo, por ejemplo $3.000 a $6.000'],['Siguiente paso','Proyecto de respaldo, replicación o sitio alterno']]}}
],
err:['Vender UPS y generadores sin vender el plan de continuidad.','No probar el propio respaldo antes de venderlo.','Esperar a que el cliente pida ayuda cuando ya empezaron los cortes.','Prometer disponibilidad en contratos sin tener respaldo propio.'],
core:['Tu proyecto de datacenter con sitio de contingencia es un caso de éxito para esta oferta.','Lista tus clientes industriales y financieros expuestos a cortes. Ofréceles una evaluación.','Revisa tu propia continuidad: oficinas, cloud propio y monitoreo.'],
quiz:[
{q:'¿Por qué el estiaje causa déficit eléctrico en Ecuador?',o:['Por falta de térmicas','Porque la generación depende mucho de hidroeléctricas','Por exceso de demanda residencial'],a:1,e:'Sin lluvia, bajan los embalses y la generación hidroeléctrica.'},
{q:'¿Qué clientes son mejor objetivo para una oferta de continuidad?',o:['Los que pierden más por hora de caída','Los más pequeños','Los que ya tienen generador'],a:0,e:'El valor de la continuidad crece con el costo de estar caído.'},
{q:'¿Cuál es una buena oferta de entrada?',o:['Un generador con descuento','Una evaluación de precio fijo que termina en propuesta','Un contrato de 3 años sin diagnóstico'],a:1,e:'Bajo riesgo para el cliente y abre el proyecto grande.'}],
ex:'Diseña la oferta de continuidad.',steps:['Define nombre, alcance y entregable.','Fija un precio.','Lista 10 clientes objetivo y su exposición a cortes.','Escribe el mensaje para contactarlos en 4 líneas.','Prepara el caso del datacenter con contingencia como prueba.'],
gl:[['Estiaje','Temporada seca que reduce la generación hidroeléctrica.'],['Continuidad de negocio','Capacidad de seguir operando ante una interrupción.'],['RTO / RPO','Tiempo máximo para recuperar un sistema / pérdida máxima de datos aceptable.']],
read:[['Disaster Recovery Planning','Jon William Toigo','Base técnica y de negocio para vender continuidad.','Capítulos sobre análisis de impacto y estrategias de recuperación.']],
