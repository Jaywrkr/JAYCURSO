{id:'compras',b:'b3',t:'Contratación pública 2026',s:'Las reglas cambiaron en julio',min:55,
why:'Una parte grande de tus clientes es pública. El reglamento cambió el 30 de julio de 2026 con el Decreto 461.',
L:[
{t:'Lo que cambió',p:[
'**Plazo de pago.** El artículo 378 del reglamento ahora da al Estado hasta dos meses para pagar desde que se cumplen los requisitos contractuales. Antes eran 30 días.',
'**Contribución.** Los contratos de $1 millón o más aportan 0,4% del valor neto de cada factura. El directorio del SERCOP puede subir el porcentaje hasta 0,5% y ajustar el monto mínimo.',
'**Registro Único de Proveedores.** La habilitación se revisa en tres momentos: apertura de ofertas, antes de adjudicar y al firmar. Si se pierde en cualquiera, el proveedor queda excluido o se declara adjudicatario fallido. Los cambios de datos se actualizan dentro de 10 días. El SERCOP fijará tarifas de inscripción.',
'**Experiencia.** Las entidades ya no pueden exigir experiencia limitada a una geografía, una marca o una especificación técnica exacta. Deben aceptar experiencia equivalente en actividades similares.',
'El SERCOP tiene 120 días para publicar modelos obligatorios de pliegos y contratos, y 140 días para actualizar el portal.'],
ex:{t:'Antes y después del Decreto 461',rows:[['Plazo de pago','30 días → hasta 2 meses'],['Contratos ≥ $1 millón','Contribución 0,4% por factura (hasta 0,5%)'],['RUP','Revisión en 3 momentos · actualizar en 10 días'],['Experiencia','Ya no puede limitarse a una marca o geografía']]}},
{t:'Las garantías y su costo',p:[
'La ley exige garantías que inmovilizan capacidad de crédito. La de **fiel cumplimiento** es 5% del valor del contrato, desde cierto monto. La de **buen uso del anticipo** cubre el 100% del anticipo recibido. La **técnica** respalda los bienes suministrados.',
'Las garantías suelen emitirse como póliza de seguro o garantía bancaria. Ambas tienen costo y ocupan cupo con tu banco o aseguradora. Las multas por retraso se fijan en el contrato y pueden cobrarse con cargo a la garantía de fiel cumplimiento.',
'En obras o servicios no normalizados, si tu oferta es 10% o más inferior al presupuesto referencial, la garantía de fiel cumplimiento aumenta. Ofertar muy bajo cuesta más de lo que parece.'],
},
{t:'Cómo cambia tu estrategia pública',p:[
'**Más competencia.** Si ya no se puede exigir experiencia en una marca específica, más integradores califican. Tu ventaja tiene que estar en la propuesta técnica, el equipo certificado y el historial de ejecución.',
'**Más capital.** Cobro más lento significa más capital de trabajo por proyecto. El precio debe incluir el costo financiero.',
'**Más disciplina administrativa.** Perder la habilitación en el RUP al momento de firmar es perder un contrato ganado. Necesitas un responsable con revisión mensual.',
'**Selección.** No todas las licitaciones valen la pena. Mide tu tasa de cierre real por tipo de entidad y por tipo de proceso, y persigue solo donde el valor esperado es positivo.'],
ex:{t:'Costo real de un contrato público de $1.200.000 (ilustrativo)',rows:[['Margen bruto ofertado','6% = $72.000'],['Contribución 0,4%','−$4.800'],['Costo financiero, $1.128.000 por 55 días al 12%','−$20.396'],['Margen que queda','$46.804 = 3,9%'],['Una multa de 1% del contrato','−$12.000 → queda 2,9%']]}}
],
err:['Usar el mismo modelo de precio que antes de julio de 2026.','No tener un responsable del RUP.','Ofertar muy por debajo del presupuesto referencial sin calcular la garantía mayor.','Perseguir toda licitación que aparece.'],
core:['Experiencia sin marca específica significa más competidores. Tu ventaja debe estar en la propuesta técnica y el servicio.','Nombra un responsable del RUP con revisión mensual.','Actualiza tu modelo de precio público: cobro más largo y contribución de 0,4%.'],
quiz:[
{q:'Desde julio de 2026, ¿cuánto plazo tiene el Estado para pagar?',o:['15 días','30 días','Hasta dos meses'],a:2,e:'El reglamento reformado amplió el plazo a un máximo de dos meses.'},
{q:'¿A qué contratos aplica la contribución de 0,4%?',o:['A todos','A los de $1 millón o más','Solo a obras'],a:1,e:'Contratos con valor igual o superior a $1 millón, sobre cada factura neta.'},
{q:'¿Qué pasa si pierdes la habilitación en el RUP al firmar?',o:['Firmas igual','Puedes ser declarado adjudicatario fallido','Te multan'],a:1,e:'La habilitación se verifica también en la firma del contrato.'}],
ex:'Revisa tus últimas 5 ofertas públicas.',steps:['Lista las 5 últimas con valor y resultado.','Para las ganadas: días reales de cobro y margen real.','Calcula cómo cambiarían con las reglas nuevas.','Escribe tu nuevo modelo de precio público.','Define quién es responsable del RUP y cada cuánto se revisa.'],
gl:[['RUP','Registro Único de Proveedores del SERCOP.'],['Garantía de fiel cumplimiento','Respaldo de 5% del contrato que asegura su ejecución.'],['Adjudicatario fallido','Proveedor que gana pero no firma el contrato.'],['Presupuesto referencial','Monto estimado por la entidad para el proceso.']],

{id:'legal',b:'b3',t:'Marco legal, laboral y tributario',s:'Proteger la utilidad que ya ganaste',min:60,
why:'Un contrato mal firmado, un error laboral o una sanción regulatoria puede borrar la utilidad de un año.',
L:[
{t:'Lo laboral: el costo real de una persona',p:[
'El sueldo es solo una parte del costo. En Ecuador el empleador paga además el aporte patronal al IESS, el décimo tercero, el décimo cuarto, los fondos de reserva desde el segundo año y, al cierre del ejercicio, el 15% de las utilidades a los trabajadores.',
'El salario básico unificado para 2026 es $482. El aporte patronal general es 11,15% y el personal 9,45%, sobre la remuneración. Los fondos de reserva equivalen a 8,33% desde el segundo año. El décimo tercero equivale a un doceavo de lo ganado en el año. El décimo cuarto es un salario básico.',
'Esto importa al fijar tarifas y al presupuestar contrataciones. Un ingeniero cuesta cerca de 30% más que su sueldo, antes de utilidades.'],
ex:{t:'Costo anual de un ingeniero con sueldo de $1.500',rows:[['Sueldo anual','$18.000'],['Aporte patronal 11,15%','$2.007'],['Décimo tercero','$1.500'],['Décimo cuarto','$482'],['Fondos de reserva 8,33% (desde el 2.º año)','$1.499'],['Costo total','≈ $23.488 · 1,30 veces el sueldo'],['Además','15% de utilidades al cierre del año']]}},
{t:'Lo tributario y lo societario',p:[
'**IVA.** Se mantiene en 15% durante 2026. Lo cobras en tus facturas y lo pagas al SRI, compensando con el IVA de tus compras. Si tus clientes te retienen IVA y tus compras son grandes, puedes acumular crédito tributario que es caja inmovilizada.',
'**Retenciones.** Tus clientes, sobre todo públicos y grandes contribuyentes, retienen una parte del impuesto a la renta y del IVA al pagarte. Cobras menos de lo facturado en ese momento. Hay que planificarlo en la caja.',
'**Impuesto a la renta.** La tarifa general de sociedades es 25%, aplicada después de la participación de trabajadores.',
'**Societario.** Coresolutions responde ante la Superintendencia de Compañías: juntas de accionistas, estados financieros anuales, nombramientos del representante legal. Tu nombramiento como gerente general se inscribe formalmente.'],
},
{t:'Protección de datos y contratos',p:[
'La Ley Orgánica de Protección de Datos Personales ya se aplica con sanciones. La Superintendencia de Protección de Datos multó a LigaPro con $259.644 y a la Federación Ecuatoriana de Fútbol con $194.856 por consentimiento inválido en sus aplicaciones.',
'Para el sector privado, las multas por infracciones graves van de 0,7% a 1% del volumen de negocios del año anterior. Las leves, de 0,1% a 0,7%.',
'Esto tiene dos caras. Riesgo: Coresolutions tiene acceso a datos de sus clientes y debe cumplir. Oportunidad: bancos, cooperativas, hospitales y universidades necesitan ayuda para cumplir. Ciberseguridad más cumplimiento es una oferta.',
'En contratos, revisa siempre cinco cláusulas: alcance exacto, criterios de aceptación, multas, garantías y límite de responsabilidad. El límite de responsabilidad es el que te protege si algo sale muy mal.'],
ex:{t:'Multa grave posible por protección de datos',rows:[['Volumen de negocios del cliente','$20.000.000'],['Multa grave 0,7% a 1%','$140.000 a $200.000'],['Lectura','Para tu cliente, un proyecto de cumplimiento de $30.000 es barato.']]}}
],
err:['Calcular tarifas con el sueldo y no con el costo real.','No planificar las retenciones en la caja.','Firmar contratos sin límite de responsabilidad.','Tratar la protección de datos solo como un riesgo y no como una línea de negocio.'],
core:['La protección de datos es oportunidad: clientes financieros y de salud tienen que cumplirla.','Revisa tus contratos: alcance, aceptación, multas y límite de responsabilidad.','Los servicios con horas de soporte excedidas son trabajo sin cobrar o un conflicto contractual esperando.'],
quiz:[
{q:'Un ingeniero gana $1.000 al mes. ¿Costo anual aproximado para la empresa, antes de utilidades?',o:['$12.000','≈ $15.600','$24.000'],a:1,e:'Cerca de 1,30 veces el sueldo anual por aportes, décimos y fondos de reserva.'},
{q:'¿Cuál es el salario básico unificado 2026?',o:['$460','$470','$482'],a:2,e:'El SBU 2026 es $482.'},
{q:'Multa grave de protección de datos para el sector privado:',o:['Fija de $10.000','0,7% a 1% del volumen de negocios','5% de la utilidad'],a:1,e:'Se calcula sobre el volumen de negocios del ejercicio anterior.'}],
ex:'Arma el registro de riesgos de Coresolutions.',steps:['Lista 10 riesgos: legales, laborales, tributarios, contractuales, de datos y operativos.','Califica probabilidad e impacto de 1 a 5.','Asigna un responsable a cada uno.','Escribe una acción concreta por riesgo.','Agenda revisión trimestral.'],

{id:'mercado',b:'b3',t:'Mapa del mercado ecuatoriano',s:'A quién vendes y contra quién compites',min:45,
why:'Saber a quién le vendes, quién regula a tus clientes y contra quién compites.',
L:[
{t:'Los sectores y lo que los mueve',p:[
'**Financiero.** Bancos regulados por la Superintendencia de Bancos y cooperativas reguladas por la SEPS. Tienen normas de seguridad de la información y continuidad, y manejan datos sensibles. La regulación empuja su demanda de seguridad, respaldo y monitoreo.',
'**Eléctrico y público.** Distribuidoras, empresas municipales y ministerios. Compran por contratación pública, con ciclos largos y dependencia del presupuesto fiscal.',
'**Educación y salud.** Universidades y hospitales. Manejan datos sensibles, tienen presupuestos ajustados y nuevas necesidades de cómputo para investigación e IA.',
'**Industria y comercio.** Manufactura, distribución y retail. Les preocupa la continuidad operativa, la energía y el costo.'],
ex:{t:'Tu base actual por sector',rows:[['Financiero','Banco de Loja, Jardín Azuayo, COOPMEGO, CACPE Biblián'],['Eléctrico y servicios','CENTROSUR, EERSSA, ETAPA'],['Educación','Universidad de Cuenca, Universidad del Azuay'],['Salud','SOLCA, Clínica San Marcos'],['Industria','CARTOPEL, Indurama']]}},
{t:'Las cinco fuerzas',p:[
'Michael Porter explicó que la rentabilidad de un sector depende de cinco fuerzas: el poder de los proveedores, el poder de los clientes, la amenaza de nuevos competidores, la amenaza de sustitutos y la rivalidad entre competidores.',
'**Proveedores.** Fabricantes como Broadcom tienen mucho poder: pueden cambiar precios y reglas. Por eso conviene diversificar marcas.',
'**Clientes.** El sector público tiene mucho poder por el proceso de compra. El privado, menos, sobre todo si hay relación y servicio continuo.',
'**Sustitutos.** La nube pública es un sustituto de la infraestructura propia. Pero también abre servicios: migración, nube híbrida, repatriación.',
'**Rivalidad.** En hardware y licencias compites por precio. En servicios, por confianza y capacidad. La rentabilidad está donde la rivalidad es menor.'],
},
{t:'Dónde ganar',p:[
'El Austro es tu fortaleza: relaciones de 20 años, presencia local y casos conocidos. Quito y Guayaquil son mercados más grandes, con más competencia y con clientes que no te conocen.',
'Para crecer fuera del Austro necesitas una razón clara para que te elijan: una especialidad, un caso de éxito replicable o un fabricante que te lleve.',
'Arma un mapa de competidores con lo que ya sabes: quién gana las licitaciones que pierdes, con qué marcas, a qué precio y con qué argumento.'],
}
],
err:['Querer vender todo a todos los sectores.','No conocer la regulación que mueve a tus clientes.','Competir por precio en todo.','No registrar contra quién pierdes y por qué.'],
core:['Tu base ya cubre todos los sectores. La pregunta es en cuáles profundizar.','El Austro es tu fortaleza. Guayaquil y Quito son el crecimiento.','Arma el mapa de competidores con lo que sabes de cada licitación perdida.'],
quiz:[
{q:'¿Qué fuerza de Porter explica el riesgo de Broadcom?',o:['Poder de los proveedores','Amenaza de sustitutos','Poder de los clientes'],a:0,e:'Un proveedor concentrado puede cambiar las reglas.'},
{q:'¿Qué regula a las cooperativas en Ecuador?',o:['Superintendencia de Bancos','SEPS','SERCOP'],a:1,e:'La Superintendencia de Economía Popular y Solidaria.'},
{q:'¿Dónde suele estar la mejor rentabilidad para un integrador?',o:['En hardware comparable','En servicios donde la rivalidad es menor','En licitaciones grandes'],a:1,e:'Menos rivalidad por precio, más margen.'}],
ex:'Arma el mapa del mercado.',steps:['Lista 5 sectores.','Para cada uno: clientes actuales, potenciales y regulador.','Lista 5 competidores y dónde te ganan.','Marca dónde ganas y dónde pierdes.','Elige 2 sectores para profundizar en 2027.'],
gl:[['SEPS','Superintendencia de Economía Popular y Solidaria.'],['Cinco fuerzas','Modelo de Porter para entender la rentabilidad de un sector.']],
read:[['Las cinco fuerzas competitivas que le dan forma a la estrategia','Michael Porter (Harvard Business Review)','La herramienta clásica para entender un sector.','Artículo completo, 2008.']]}
);

M.push(
{id:'canal',b:'b4',t:'La cadena del canal TI',s:'Fabricante, mayorista, integrador',min:50,
why:'Coresolutions vive de alianzas con IBM, Lenovo, VMware, Veeam, Check Point, HPE, Aruba y Synology. Gestionarlas bien es margen directo.',
L:[
{t:'Cómo se reparte el margen',p:[
'El fabricante vende al mayorista, el mayorista al integrador y el integrador al cliente. Cada eslabón toma una parte. El integrador suele quedarse con el margen más pequeño en producto, pero es el único que tiene la relación directa con el cliente.',
'El fabricante quiere volumen y cobertura de mercado. El mayorista aporta crédito, logística y stock. El integrador aporta conocimiento, implementación y confianza del cliente.',
'Por eso tu poder de negociación no está en el volumen de producto, sino en el acceso al cliente y la capacidad de implementar. Un fabricante necesita integradores que sepan vender y desplegar sus soluciones.'],
ex:{t:'Margen típico de un integrador por tipo de venta (referencia)',rows:[['Hardware','Bajo: compites con cotizaciones comparables'],['Licencias y suscripciones','Bajo a medio, más incentivos del fabricante'],['Implementación','Alto: es tu conocimiento'],['Servicios gestionados','Alto y recurrente']],note:'Los porcentajes exactos varían por marca, nivel de partner y negociación. Mide los tuyos.'}},
{t:'Programas de partner',p:[
'Cada fabricante tiene niveles de partner. Subir de nivel da mejores descuentos, soporte, acceso a preventa del fabricante y oportunidades que el fabricante deriva.',
'Los niveles se ganan con certificaciones del equipo, volumen de ventas y a veces cumplimiento de procesos. Por eso el plan de certificaciones VCF no es solo capacitación: es una herramienta de margen.',
'Tres mecanismos que muchos integradores no aprovechan: **registro de oportunidades**, que protege tu precio frente a otros integradores si registras primero; **rebates**, devoluciones por cumplir metas; y **fondos de marketing**, dinero del fabricante para eventos y campañas.'],
},
{t:'Gestionar fabricantes como cuentas',p:[
'Trata a tus fabricantes principales como clientes clave. Cada uno necesita un plan anual: metas de venta, certificaciones, acciones conjuntas, fondos a solicitar y una persona responsable en Coresolutions.',
'Ordénalos por utilidad bruta que generan, no por venta. Un fabricante con mucha venta y poco margen puede valer menos que uno pequeño con servicios asociados.',
'Vigila la concentración. Si una marca supera el 40% de tu utilidad bruta, un cambio de reglas como el de Broadcom con VMware afecta a toda la empresa.',
'La relación con el gerente de canal del fabricante es personal. Él decide a quién le pasa oportunidades. Reúnete con él cada trimestre con resultados concretos.'],
ex:{t:'Plan anual con un fabricante (ejemplo)',rows:[['Meta','Crecer 15% en venta con servicios asociados'],['Certificaciones','2 nuevas en el año'],['Acciones','1 evento conjunto, 2 casos de éxito'],['Fondos','Solicitar fondos de marketing para el evento'],['Registro','100% de oportunidades registradas'],['Revisión','Trimestral con el gerente de canal']]}}
],
err:['No registrar oportunidades y perder margen frente a otro integrador.','No pedir rebates ni fondos de marketing.','Medir fabricantes por venta y no por utilidad.','Depender de una sola marca.'],
core:['Ordena los fabricantes por utilidad bruta, no por venta.','Plan anual con los 3 principales: metas, certificaciones, fondos y acciones conjuntas.','Tu plan de certificaciones VCF y los eventos con fabricantes son activos de negociación.'],
quiz:[
{q:'¿Para qué sirve el registro de oportunidades?',o:['Para cumplir un trámite','Para proteger tu precio frente a otros integradores','Para conseguir crédito'],a:1,e:'El fabricante protege al primero que registra.'},
{q:'¿Cómo deberías ordenar a tus fabricantes?',o:['Por venta','Por utilidad bruta que generan','Por antigüedad'],a:1,e:'La utilidad es lo que paga la empresa.'},
{q:'¿Cuál es tu principal poder frente al fabricante?',o:['El volumen de compra','El acceso al cliente y la capacidad de implementar','El precio'],a:1,e:'El fabricante necesita quien venda y despliegue su solución.'}],
ex:'Haz el mapa de tus fabricantes.',steps:['Lista los 8 fabricantes.','Para cada uno: venta anual, utilidad bruta, nivel de partner y certificaciones.','Calcula qué porcentaje de la utilidad representa cada uno.','Elige los 3 principales.','Escribe un pedido concreto para cada uno en el próximo trimestre.'],
gl:[['Mayorista','Distribuidor entre el fabricante y el integrador.'],['Rebate','Devolución del fabricante por cumplir metas.'],['MDF','Fondos de desarrollo de mercado del fabricante.']],

{id:'modelos',b:'b4',t:'Modelos de negocio en TI',s:'VAR, MSP, MSSP, consultora',min:50,
why:'Cada modelo tiene otra economía. Coresolutions hoy es una mezcla. El gerente decide hacia dónde se mueve.',
L:[
{t:'Cuatro modelos',p:[
'**VAR (revendedor de valor agregado).** Vende hardware y licencias con implementación. Volumen alto, margen bajo, ingresos que dependen de ciclos de renovación. Necesita capital de trabajo.',
'**MSP (proveedor de servicios gestionados).** Opera la infraestructura del cliente por una tarifa mensual: monitoreo, soporte, parches, respaldo. Margen alto y estable. Exige procesos maduros y herramientas.',
'**MSSP (servicios de seguridad gestionados).** Un MSP especializado en seguridad: monitoreo de eventos, respuesta a incidentes, gestión de firewalls, cumplimiento.',
'**Consultora.** Vende conocimiento: arquitectura, diagnósticos, estrategia. Margen alto, pero limitado por las horas de personas expertas.'],
ex:{t:'Comparación de modelos',rows:[['VAR','Margen bajo · ingresos por proyecto · capital alto'],['MSP','Margen medio-alto · mensual · procesos'],['MSSP','Margen alto · mensual · especialización'],['Consultora','Margen alto · por proyecto · personas clave']]}},
{t:'La economía de un MSP',p:[
'Un MSP gana cuando cada ingeniero atiende a muchos clientes con procesos estándar y herramientas automatizadas. Si cada cliente es distinto, el margen desaparece.',
'Las métricas clave son ingreso recurrente mensual, margen por contrato, clientes por ingeniero, churn y tiempo de respuesta.',
'Lo difícil de pasar de VAR a MSP es cultural. En un proyecto, el éxito es terminar. En un servicio, el éxito es que no pase nada. Requiere disciplina, documentación y métricas de servicio.'],
},
{t:'Hacia dónde mover Coresolutions',p:[
'Ya tienes piezas de un MSP: la plataforma de monitoreo multi-cliente en construcción con Terraform, Ansible, Prometheus y Grafana; el informe mensual de Quski; contratos de soporte.',
'Y piezas de un MSSP: Check Point, la certificación ISO 27001 y proyectos de ciberseguridad como CENTROSUR.',
'La decisión de gerente no es elegir un solo modelo, sino definir la mezcla objetivo. Por ejemplo: pasar de 85% de la utilidad en proyectos y reventa a 60%, y de 15% en recurrente a 40%, en 3 años.',
'Cada punto de esa mezcla necesita capacidades: herramientas, procesos, personas y una oferta con precio.'],
ex:{t:'Mezcla objetivo (ilustrativo)',rows:[['Hoy','Reventa 55% · proyectos 30% · recurrente 15% de la utilidad'],['En 3 años','Reventa 35% · proyectos 25% · recurrente 40%'],['Qué falta','Plataforma de monitoreo en producción, oferta MSP con precio, mesa de servicio con métricas']]}}
],
err:['Llamar MSP a un contrato de soporte por horas.','Personalizar cada contrato de servicio hasta que no deja margen.','Pasar a servicios sin procesos ni herramientas.','Medir los servicios con la lógica de proyectos.'],
core:['Tu plataforma de monitoreo multi-cliente es la base técnica de un MSP. Falta convertirla en oferta con contrato.','Check Point, monitoreo e ISO 27001 son la base de un servicio de seguridad gestionada.','Define qué porcentaje de utilidad quieres de cada modelo en 3 años.'],
quiz:[
{q:'¿Qué hace rentable a un MSP?',o:['Personalizar todo para cada cliente','Procesos estándar y automatización que permiten atender muchos clientes por ingeniero','Vender más hardware'],a:1,e:'Estandarizar es lo que crea margen en servicios.'},
{q:'¿Qué es un MSSP?',o:['Un revendedor de licencias','Un proveedor de servicios de seguridad gestionados','Una consultora de estrategia'],a:1,e:'Es un MSP especializado en seguridad.'},
{q:'¿Cuál es el mayor reto de pasar de VAR a MSP?',o:['Técnico','Cultural: el éxito es que no pase nada','Legal'],a:1,e:'Cambia la forma de medir el éxito y de trabajar.'}],
ex:'Define tu mezcla objetivo.',steps:['Estima qué porcentaje de la utilidad viene hoy de cada modelo.','Define la mezcla objetivo en 3 años.','Lista las capacidades que faltan para cada modelo.','Estima la inversión y quién lo lidera.','Elige el primer servicio gestionado a lanzar.'],
gl:[['VAR','Revendedor de valor agregado.'],['MSP','Proveedor de servicios gestionados.'],['MSSP','Proveedor de servicios de seguridad gestionados.']],
read:[['Managed Services in a Month','Karl Palachuk','Cómo pasar de proyectos a servicios gestionados, paso a paso.','Capítulos sobre definición de oferta y precio.']]},

{id:'recurrente',b:'b4',t:'Ingresos recurrentes',s:'De proyectos a contratos mensuales',min:50,
why:'Un proyecto se cobra una vez. Un servicio se cobra cada mes. La recurrencia da estabilidad y aumenta el valor de la empresa.',
L:[
{t:'Las métricas',p:[
'**MRR** es el ingreso recurrente mensual. **ARR** es el anual: MRR × 12. Solo cuenta lo que tiene contrato y se repite, no proyectos ni renovaciones puntuales.',
'**Churn** es el porcentaje de MRR que pierdes cada mes por clientes que se van o reducen. Un churn de 2% mensual parece poco, pero es perder cerca de 22% del ingreso recurrente al año.',
'**Retención neta** compara el MRR de un grupo de clientes hoy con el de hace un año, incluyendo lo que compraron de más. Si es mayor que 100%, creces aunque no entren clientes nuevos.'],
ex:{t:'El efecto del churn en un año',rows:[['MRR inicial','$12.000'],['Churn 1% mensual','Quedan $10.637 al año (−11%)'],['Churn 2% mensual','Quedan $9.417 (−22%)'],['Churn 3% mensual','Quedan $8.326 (−31%)']],note:'Sin clientes nuevos. Retener vale tanto como vender.'}},
{t:'Productizar un servicio',p:[
'Un servicio productizado tiene nombre, alcance fijo, precio fijo y un entregable estándar. Se vende igual, se entrega igual y se puede delegar.',
'Los cinco elementos: qué incluye, qué no incluye, nivel de servicio (tiempos de respuesta), entregable periódico y precio.',
'El entregable periódico es clave. Si el cliente no ve nada cada mes, al renovar se pregunta para qué paga. Un informe mensual como el de Quski hace visible el valor.'],
ex:{t:'Ficha de un servicio productizado',rows:[['Nombre','Monitoreo Core'],['Incluye','Monitoreo 24/7 de hasta 50 equipos, alertas, informe mensual'],['No incluye','Resolución de incidentes fuera del alcance, cambios mayores'],['Nivel de servicio','Alerta crítica notificada en 15 minutos'],['Precio','$1.200/mes, contrato de 12 meses']]}},
{t:'Convertir proyectos en recurrencia',p:[
'Cada proyecto terminado es la mejor oportunidad de vender un servicio. El cliente acaba de invertir y quiere que funcione.',
'Regla simple: ninguna propuesta de implementación sale sin una opción de servicio continuo. Monitoreo, soporte, respaldo gestionado, seguridad gestionada.',
'Mide la tasa de conversión: de cada 10 proyectos cerrados, cuántos terminan con un contrato recurrente. Es un indicador de gerente.'],
}
],
err:['Contar renovaciones de licencias como ingreso recurrente propio.','Vender servicios sin entregable visible.','No medir churn.','Ofrecer el servicio continuo solo cuando el cliente pregunta.'],
core:['El informe mensual de Quski ya es un servicio productizado. Repite el modelo con otros clientes.','Cada implementación debe cerrar con una oferta de servicio continuo.','CoreAI Adoption y CoreAI Managed deben tener precio mensual.'],
tool:'recur',
quiz:[
{q:'MRR de $10.000. ¿ARR?',o:['$10.000','$120.000','$100.000'],a:1,e:'ARR = MRR × 12.'},
{q:'¿Qué significa retención neta mayor a 100%?',o:['Pierdes clientes','Los clientes actuales te compran más de lo que pierdes','Tienes muchos clientes nuevos'],a:1,e:'Creces solo con la base actual.'},
{q:'¿Por qué importa el entregable mensual?',o:['Por obligación legal','Porque hace visible el valor y protege la renovación','Para justificar horas'],a:1,e:'Si el cliente no ve nada, al renovar duda.'}],
ex:'Diseña un servicio recurrente.',steps:['Nombre del servicio.','Qué incluye y qué no.','Nivel de servicio.','Entregable mensual.','Precio y plazo.','5 clientes actuales a quienes ofrecérselo este trimestre.'],
gl:[['MRR','Ingreso recurrente mensual.'],['ARR','Ingreso recurrente anual.'],['Churn','Porcentaje de ingreso recurrente perdido por periodo.'],['Retención neta','MRR actual de un grupo de clientes frente al de hace un año.']],
read:[['The Automatic Customer','John Warrillow','Modelos de suscripción para empresas de servicios.','Partes 1 y 2.']]},

{id:'tendencias',b:'b4',t:'Tendencias 2026–2030',s:'Lo que cambia tu negocio en 3 años',min:45,
why:'Las tendencias no son noticias. Son líneas de negocio que se abren o se cierran.',
L:[
{t:'Consolidación de fabricantes',p:[
'La compra de VMware por Broadcom mostró cómo un fabricante puede cambiar licencias, precios y programas de partner en poco tiempo, moviendo toda una base instalada.',
'Para un integrador esto genera dos efectos. Riesgo: clientes molestos, márgenes que cambian, programas de partner que exigen más. Oportunidad: clientes que necesitan evaluar alternativas, optimizar licencias o migrar.',
'La lección general: no depender de un solo fabricante y estar listo para ofrecer evaluaciones honestas cuando el mercado cambia.'],
},
{t:'Nube híbrida e IA',p:[
'**Nube híbrida y repatriación.** Muchas empresas usan nube pública y propia al mismo tiempo. Algunas traen cargas de vuelta a infraestructura propia por costo, control o soberanía de datos. La Universidad de Cuenca busca hacerlo con sus servicios de IA.',
'**IA empresarial.** Hay dos caminos. El primero, plataformas como ChatGPT Enterprise: rápidas de adoptar, con necesidad de gobierno, capacitación e integración. El segundo, cómputo propio con GPUs: control de datos y costo predecible si el uso es alto.',
'Ambos caminos necesitan un integrador: diagnóstico, implementación, seguridad, adopción y operación. CoreAI y la IA on-premise cubren los dos.'],
},
{t:'Seguridad por regulación y cómo decidir',p:[
'La protección de datos ya tiene sanciones en Ecuador, y los reguladores financieros exigen seguridad y continuidad. Eso convierte la seguridad de gasto opcional en obligación.',
'No puedes perseguir todas las tendencias. Usa tres preguntas para cada una: ¿tenemos clientes que ya lo piden?, ¿tenemos una ventaja para ganarlo?, ¿cuánto cuesta entrar?',
'Elige dos apuestas para 2027 y deja las demás en observación. Revisa el radar cada trimestre.'],

],

M.push(
{id:'estrategia',b:'b5',t:'Estrategia',s:'Dónde jugar, cómo ganar, qué dejar',min:60,
why:'Estrategia es elegir qué no hacer. Una empresa con 20 años y muchas marcas corre el riesgo de hacer de todo un poco.',
L:[
{t:'Estrategia buena y estrategia mala',p:[
'Richard Rumelt explica que la mayoría de lo que las empresas llaman estrategia son objetivos decorados: "ser líderes", "crecer 20%", "ser el socio tecnológico preferido". Eso no dice cómo ni qué se deja de hacer.',
'Una estrategia real tiene tres partes. **Diagnóstico:** qué está pasando y cuál es el desafío central. **Política guía:** el enfoque elegido para enfrentarlo. **Acciones coherentes:** pasos concretos que se refuerzan entre sí.',
'Señales de mala estrategia: frases vacías, objetivos sin plan, listas de 15 prioridades y no enfrentar el problema principal.'],
ex:{t:'Mala vs buena estrategia',rows:[['Mala','"Ser el integrador líder del sur del país, con excelencia y foco en el cliente"'],['Diagnóstico','La utilidad depende de reventa de bajo margen y de pocos fabricantes; el ingreso recurrente es pequeño'],['Política guía','Convertir la base instalada en contratos de servicio gestionado'],['Acciones','1. Lanzar monitoreo gestionado con precio fijo · 2. Toda implementación incluye oferta de servicio · 3. Contratar un responsable de servicios']]}},
{t:'Dónde jugar y cómo ganar',p:[
'A.G. Lafley y Roger Martin, desde Procter & Gamble, resumieron la estrategia en cinco preguntas: cuál es la aspiración, dónde jugar, cómo ganar, qué capacidades necesitas y qué sistemas de gestión las sostienen.',
'**Dónde jugar** define clientes, sectores, geografías y servicios. Decirlo en voz alta obliga a decir también dónde no.',
'**Cómo ganar** responde por qué un cliente te elige a ti y no a otro integrador con las mismas marcas. Si la respuesta es "por precio", no hay ventaja: hay una guerra.',
'Para Coresolutions, una ventaja posible es la combinación de profundidad técnica certificada, relación de largo plazo y capacidad de convertir proyectos en servicios con entregables visibles.'],
},
{t:'Tres horizontes',p:[
'McKinsey propuso pensar el negocio en tres horizontes. **Horizonte 1:** el negocio actual, que genera la caja de hoy. **Horizonte 2:** negocios en crecimiento que serán importantes en 2 a 4 años. **Horizonte 3:** opciones para el futuro, pequeñas hoy.',
'El error común es dedicar todo al horizonte 1 porque es el urgente. Entonces el negocio envejece sin reemplazo.',
'Una regla de referencia es repartir recursos 70/20/10. No es exacta, pero obliga a reservar algo para el futuro.'],
ex:{t:'Los tres horizontes de Coresolutions',rows:[['H1 · hoy','Infraestructura, licenciamiento, implementación'],['H2 · crecimiento','Seguridad gestionada, monitoreo, continuidad'],['H3 · futuro','IA empresarial y on-premise'],['Recursos sugeridos','70% · 20% · 10%']]}}
],
err:['Confundir objetivos con estrategia.','Tener más de 3 prioridades.','No decir qué se deja de hacer.','Poner todo el esfuerzo en el negocio de hoy.'],
core:['Responde: ¿Coresolutions es un revendedor con servicios o una empresa de servicios que también vende producto?','Decide qué línea reducir. Cerrar compromisos poco rentables, como hiciste con SARA, es estrategia.','La IA es el horizonte 3. Necesita responsable, presupuesto y métrica.'],
quiz:[
{q:'¿Cuáles son las tres partes de una buena estrategia según Rumelt?',o:['Visión, misión y valores','Diagnóstico, política guía y acciones coherentes','Metas, presupuesto y KPIs'],a:1,e:'Sin diagnóstico ni acciones, es una lista de deseos.'},
{q:'Si la respuesta a "¿por qué te eligen?" es "por precio", ¿qué significa?',o:['Tienes ventaja','No tienes una ventaja diferencial','Tu estrategia es buena'],a:1,e:'Ganar solo por precio es una guerra, no una ventaja.'},
{q:'¿Qué es el horizonte 3?',o:['El negocio de hoy','Opciones para el futuro, pequeñas hoy','El negocio que hay que cerrar'],a:1,e:'Pequeño hoy, importante mañana.'}],
ex:'Escribe la estrategia en una página.',steps:['Diagnóstico en 3 líneas.','Política guía en 1 línea.','3 acciones coherentes para 12 meses.','2 cosas que Coresolutions dejará de hacer.','Reparto de recursos entre los 3 horizontes.'],
gl:[['Política guía','El enfoque elegido para enfrentar el desafío central.'],['Tres horizontes','Modelo para equilibrar negocio actual, crecimiento y futuro.']],
read:[['Good Strategy Bad Strategy','Richard Rumelt','Distingue estrategia real de objetivos decorados.','Capítulos 1 a 5.'],['Playing to Win','A.G. Lafley y Roger Martin','El marco de dónde jugar y cómo ganar.','Capítulos 1 a 4.']]},

{id:'ventas',b:'b5',t:'Ventas y cuentas clave',s:'El gerente responde por el número',min:55,
why:'Si el pipeline no alcanza hoy, el próximo trimestre ya está perdido.',
L:[
{t:'El pipeline como sistema',p:[
'El pipeline es la lista de oportunidades abiertas con valor, probabilidad, etapa y fecha esperada de cierre. Es la mejor predicción de las ventas futuras.',
'Las etapas deben estar definidas por hechos, no por sensaciones. Por ejemplo: calificada (hay necesidad, presupuesto y quien decide), propuesta enviada, negociación, ganada o perdida.',
'El pipeline ponderado multiplica cada oportunidad por su probabilidad. No es exacto, pero ordena las expectativas.',
'La cobertura es pipeline dividido por meta. Con 25% de tasa de cierre necesitas 4 veces la meta en pipeline calificado.'],
ex:{t:'Pipeline ponderado (ejemplo)',rows:[['Oportunidad A · $200.000 · negociación 70%','$140.000'],['Oportunidad B · $80.000 · propuesta 40%','$32.000'],['Oportunidad C · $150.000 · calificada 20%','$30.000'],['Total ponderado','$202.000'],['Meta del trimestre','$300.000 → falta pipeline']]}},
{t:'Venta consultiva',p:[
'Neil Rackham estudió miles de reuniones de venta compleja y encontró que los mejores vendedores hacen más preguntas y hablan menos de su producto. Su método SPIN tiene cuatro tipos de preguntas.',
'**Situación:** cómo está hoy el cliente. **Problema:** qué le cuesta o le preocupa. **Implicación:** qué consecuencias tiene ese problema. **Necesidad:** qué valor tendría resolverlo.',
'Las preguntas de implicación son las más poderosas. Convierten un problema técnico en un problema de negocio que justifica la inversión.'],
ex:{t:'Preguntas SPIN para una cooperativa',rows:[['Situación','¿Cómo respaldan hoy sus sistemas críticos?'],['Problema','¿Han tenido caídas en los últimos meses?'],['Implicación','¿Qué pasa con los socios si el sistema core cae 8 horas un viernes de pago?'],['Necesidad','¿Cuánto valdría recuperar el servicio en 1 hora?']]}},
{t:'Cuentas clave',p:[
'El principio de Pareto suele cumplirse: cerca del 20% de los clientes trae la mayor parte de la utilidad. Esos clientes necesitan un plan propio, no solo atención reactiva.',
'Un plan de cuenta tiene: qué tiene instalado el cliente, qué vence en los próximos 12 meses, quiénes deciden y qué les importa, qué oportunidades hay y quién de Coresolutions es responsable.',
'Revisa los planes de cuenta cada trimestre. Las renovaciones previsibles nunca deberían sorprenderte.'],
}
],
err:['Llenar el pipeline de oportunidades no calificadas.','Revisar el pipeline solo al fin de mes.','Presentar producto antes de entender el problema.','Atender a los clientes clave solo cuando llaman.'],
core:['CoreOportunidades es la única fuente de verdad del pipeline. Lo que no está ahí no existe.','Separa público y privado: ciclos, márgenes y riesgos distintos.','Plan de cuenta para los 10 clientes principales.'],
tool:'pipe',
quiz:[
{q:'Meta $1.000.000, tasa de cierre 25%. ¿Pipeline necesario?',o:['$1.000.000','$2.500.000','$4.000.000'],a:2,e:'$1.000.000 / 0,25 = $4.000.000.'},
{q:'¿Qué tipo de pregunta SPIN es más poderosa?',o:['Situación','Implicación','Producto'],a:1,e:'Convierte un problema técnico en uno de negocio.'},
{q:'¿Qué define bien una etapa del pipeline?',o:['La sensación del vendedor','Hechos verificables','El tamaño del cliente'],a:1,e:'Etapas por hechos hacen el pipeline confiable.'}],
ex:'Plan para tus 10 clientes principales.',steps:['Lista los 10 por utilidad del último año.','Para cada uno: instalado, vencimientos 12 meses y quién decide.','Siguiente oportunidad y valor estimado.','Responsable en Coresolutions.','Fecha de la próxima reunión.'],
gl:[['Pipeline','Oportunidades abiertas con valor, etapa y fecha.'],['Cobertura','Pipeline dividido por meta.'],['SPIN','Situación, problema, implicación, necesidad.']],
read:[['SPIN Selling','Neil Rackham','Preguntas para descubrir el problema real.','Capítulos 1 a 5.'],['The Challenger Sale','Matthew Dixon y Brent Adamson','Enseñar al cliente algo nuevo de su negocio.','Capítulos 1 a 3.']]},

{id:'marca',b:'b5',t:'Marca y marketing B2B',s:'Lo que dicen de ti cuando no estás',min:45,
why:'En B2B el cliente compra confianza. La marca convierte promesas en evidencia.',
L:[
{t:'Posicionamiento',p:[
'El posicionamiento es el lugar que ocupas en la mente del cliente. Se resume en una frase: para quién, qué problema resuelves y por qué tú.',
'La mayoría de integradores dice lo mismo: soluciones integrales, socio tecnológico, excelencia. Si quitas el logo, nadie sabe de quién es. Un buen posicionamiento es específico y se puede comprobar.',
'Ejemplo de fórmula: "Para [tipo de cliente] que necesita [resultado], Coresolutions es [categoría] que [diferencia], a diferencia de [alternativa]."'],
ex:{t:'Genérico vs específico',rows:[['Genérico','"Soluciones tecnológicas integrales con excelencia"'],['Específico','"Para bancos, cooperativas y empresas del sur del país que no pueden detenerse: infraestructura, seguridad y continuidad con ingenieros certificados y 20 años de operación"']]}},
{t:'Prueba y contenido',p:[
'En B2B, la prueba vale más que la promesa. Casos de éxito con números, certificaciones, referencias de clientes y años de operación.',
'Un caso de éxito tiene cuatro partes: situación del cliente, problema, qué se hizo y resultado medible. Con permiso del cliente y una cita suya, vale el doble.',
'El contenido útil construye reputación antes de la reunión: explicar un problema real, cómo resolverlo, qué errores evitar. Tu experiencia en contenido con @jaywrkr es una ventaja aplicable a Coresolutions.'],
},
{t:'Eventos y medición',p:[
'Ya organizas eventos con fabricantes: Veeam Day en Cuenca, IBM, VCF en Loja. Son el canal más directo con quienes deciden.',
'Un evento se mide por oportunidades, no por asistentes. Antes: lista de invitados objetivo. Durante: conversaciones agendadas. Después: oportunidades registradas en 30 días y ventas en 6 meses.',
'Pide fondos de marketing a los fabricantes para cubrir los eventos.'],
ex:{t:'Medición de un evento',rows:[['Invitados objetivo','40'],['Asistentes','25'],['Reuniones agendadas','8'],['Oportunidades en 30 días','5'],['Venta en 6 meses','$120.000'],['Costo del evento','$6.000 (parte cubierta por el fabricante)']]}}
],
err:['Usar frases que podría decir cualquier competidor.','Medir eventos por asistentes.','Publicar sin casos ni números.','No pedir permiso ni citas a clientes satisfechos.'],
core:['Mide cuántas oportunidades sale de cada evento.','Tu oficio de diseño y contenido aplicado a Coresolutions es una ventaja.','Publica un caso de éxito por trimestre: CENTROSUR, el datacenter con contingencia, el monitoreo de Quski.'],
quiz:[

{q:'¿Qué indica un posicionamiento débil?',o:['Que es específico','Que cualquier competidor podría decir lo mismo','Que menciona un segmento'],a:1,e:'Si no diferencia, no posiciona.'}],
ex:'Posicionamiento y plan de marketing 12 meses.',steps:['Escribe el posicionamiento con la fórmula.','Elige 4 casos de éxito y pide permiso a los clientes.','Planifica 4 eventos con fabricante.','Define un tema de contenido mensual.','Define cómo medirás cada acción.'],
gl:[['Posicionamiento','Lugar que ocupas en la mente del cliente.'],['Caso de éxito','Historia verificable de un cliente con resultado medible.']],
read:[['Building a StoryBrand','Donald Miller','Comunicar para que el cliente se vea en tu historia.','Partes 1 y 2.'],['Positioning','Al Ries y Jack Trout','El libro original sobre posicionamiento.','Capítulos 1 a 6.']]},

{id:'operaciones',b:'b5',t:'Operaciones y entrega',s:'Donde se gana o se pierde el margen',min:55,
why:'Vender bien y entregar mal destruye el margen y la reputación.',
L:[
{t:'Utilización y margen de entrega',p:[
'La utilización es el porcentaje de horas disponibles que se facturan. En empresas de servicios TI se apunta a 65–80% para ingenieros de entrega. Menos indica capacidad ociosa; más de 85% sostenido indica riesgo de agotamiento y errores.',
'El margen de entrega compara lo que se cobra por un servicio con lo que cuesta entregarlo. Se pierde por horas no registradas, trabajo fuera de alcance, retrabajo y tiempos muertos entre proyectos.',
'Diez puntos de utilización pueden valer más que contratar un ingeniero. Antes de contratar, revisa dónde se van las horas.'],
ex:{t:'Valor de 10 puntos de utilización',rows:[['Ingenieros','8'],['Horas disponibles al mes','160 c/u'],['Tarifa','$45/hora'],['De 60% a 70%','+128 horas facturables al mes'],['Valor anual','+$69.120']]}},
{t:'Control de alcance',p:[
'Lo que no está escrito se hace gratis. Cada pedido fuera de alcance, por pequeño que sea, debe registrarse y decidirse: se cobra, se cambia por otra cosa o se rechaza.',
'Herramientas: acta de inicio con alcance firmado, registro de cambios, criterios de aceptación claros y cierre formal del proyecto.',
'Los servicios con horas de soporte excedidas son el mismo problema en contratos recurrentes. Hay que revisarlos uno por uno: cobrar el exceso, renegociar el contrato o ajustar el alcance.'],
},
{t:'Estandarizar y aprender',p:[
'Atul Gawande mostró en hospitales que una lista de verificación simple reduce errores graves. En TI pasa lo mismo: checklists por tipo de implementación hacen que el resultado no dependa de quién lo hace.',
'Eliyahu Goldratt explicó que todo sistema avanza al ritmo de su recurso más escaso, el cuello de botella. Mejorar cualquier otra cosa no acelera el sistema. Si un solo ingeniero sabe configurar algo, ese ingeniero es tu límite de crecimiento.',
'Cierra cada proyecto con un postmortem breve: qué salió bien, qué no y qué cambia en el proceso. Sin buscar culpables. Guárdalo en CoreTrack.'],
ex:{t:'Postmortem en 15 minutos',rows:[['Horas','Presupuestadas vs reales'],['Margen','Previsto vs real'],['Qué salió bien','3 puntos'],['Qué no','3 puntos'],['Cambio de proceso','1 acción con responsable']]}}
],
err:['Contratar antes de revisar la utilización.','Aceptar cambios de alcance sin registro.','Depender de un solo ingeniero para tareas críticas.','Cerrar proyectos sin aprender nada.'],
core:['CorePlanificación, CoreGestión y CoreTrack ya existen. El reto es que todo el equipo los use igual, siempre.','Tickets suspendidos por más de 600 días y horas de soporte excedidas son síntomas de falta de control operativo.','En contratos públicos, plazos y multas entran al cronograma desde la oferta.'],
tool:'util',
quiz:[
{q:'¿Qué rango de utilización es sano para ingenieros de entrega?',o:['30–50%','65–80%','95–100%'],a:1,e:'Menos es capacidad ociosa; más es riesgo de agotamiento.'},
{q:'¿Qué es un cuello de botella?',o:['El proyecto más grande','El recurso más escaso que limita todo el sistema','Un cliente difícil'],a:1,e:'Mejorar lo demás no acelera el sistema.'},
{q:'Un cliente pide un cambio pequeño fuera de alcance. ¿Qué haces?',o:['Hacerlo gratis','Registrarlo y decidir si se cobra o se cambia por algo','Ignorarlo'],a:1,e:'Lo no registrado se vuelve costumbre.'}],
ex:'Postmortem del último proyecto terminado.',steps:['Horas presupuestadas vs reales.','Margen previsto vs real.','Cambios de alcance no cobrados.','Qué salió bien y qué no.','3 cambios de proceso con responsable.'],
gl:[['Utilización','Horas facturadas sobre horas disponibles.'],['Cuello de botella','Recurso que limita la capacidad de todo el sistema.'],['Postmortem','Revisión de un proyecto terminado para aprender.']],
read:[['La Meta','Eliyahu Goldratt','Novela sobre cuellos de botella y flujo.','Libro completo.'],['The Checklist Manifesto','Atul Gawande','Por qué las listas simples evitan errores graves.','Capítulos 1 a 4.']]},

{id:'personas',b:'b5',t:'Personas y cultura',s:'Construir el equipo que resuelve sin ti',min:55,
why:'Como PM resuelves problemas. Como gerente construyes el equipo que los resuelve sin ti.',
L:[
{t:'Apalancamiento',p:[
'Andy Grove, de Intel, definió la producción de un gerente como la producción de su equipo más la de los equipos que influye. Tu hora vale por cuánto multiplica el trabajo de otros.',
'Una hora explicando bien una prioridad a 10 personas vale más que una hora resolviendo tú un problema técnico. Una buena contratación vale años de tu trabajo.',
'Las actividades de alto apalancamiento: decidir prioridades, contratar, entrenar, dar feedback, diseñar procesos y negociar acuerdos grandes.'],
},
{t:'1:1 y feedback',p:[
'La reunión 1:1 es la herramienta más simple del gerente. 30 minutos semanales o quincenales con cada persona clave. La agenda la trae la otra persona: problemas, ideas, dudas, carrera.',
'Grove la llamaba el sistema de alerta temprana: ahí aparecen los problemas antes de que exploten.',
'Para dar feedback usa el modelo SCI: situación, comportamiento, impacto. Describe hechos, no juicios. Pronto, en privado y con una pregunta al final.'],
ex:{t:'Feedback SCI',rows:[['Débil','"Eres muy desorganizado con los informes"'],['SCI','"En el cierre del proyecto de la cooperativa (situación), el informe llegó 4 días tarde y sin las pruebas de arranque (comportamiento). El cliente retrasó la firma del acta y el cobro (impacto). ¿Qué pasó?"']]}},
{t:'Delegar y retener',p:[
'Delegar según madurez: a quien es nuevo en una tarea le das instrucciones y revisas seguido. A quien la domina le das el resultado esperado y te apartas. El error es tratar a todos igual.',
'La retención importa porque un ingeniero certificado es el activo más caro de reemplazar: búsqueda, curva de aprendizaje, proyectos atrasados y conocimiento perdido.',
'Las personas se quedan por cuatro cosas, además del sueldo: aprender, crecer en responsabilidad, ser reconocidas y confiar en su jefe. Un plan de carrera visible y certificaciones atadas a crecimiento retienen más que un aumento puntual.'],
ex:{t:'Costo de perder a un ingeniero senior (estimado)',rows:[['Búsqueda y selección','1 a 2 meses de sueldo'],['Curva de aprendizaje','3 a 6 meses de productividad parcial'],['Proyectos atrasados','Multas, clientes molestos'],['Conocimiento perdido','Difícil de cuantificar'],['Total','Con frecuencia más de medio año de su costo']]}}
],
err:['Seguir siendo el mejor técnico del equipo en vez de formar a otros.','Cancelar los 1:1 cuando hay presión.','Dar feedback en público o con juicios.','Retener solo con dinero.'],
core:['Haz la lista de lo que hoy solo haces tú. Asigna un responsable a cada cosa en 90 días.','Ata el plan de certificaciones VCF a la carrera y a la venta.','Escribe los valores de la empresa como conductas observables.'],
quiz:[
{q:'¿Qué actividad tiene más apalancamiento para un gerente?',o:['Resolver un ticket','Contratar bien a un ingeniero clave','Revisar correos'],a:1,e:'Una buena contratación multiplica el trabajo por años.'},
{q:'¿Quién trae la agenda del 1:1?',o:['El gerente','La otra persona','Recursos humanos'],a:1,e:'Es su espacio para traer problemas y dudas.'},
{q:'¿Cómo delegas a alguien nuevo en una tarea?',o:['Solo el resultado esperado','Instrucciones claras y revisión frecuente','No le delegas'],a:1,e:'La forma de delegar depende de la madurez en esa tarea.'}],
ex:'Lista de delegación.',steps:['Dos columnas: tareas que hago hoy y quién debería hacerlas.','Marca las 3 que delegas este mes.','Para cada una: nivel de madurez de la persona y cómo delegarás.','Agenda 1:1 con cada persona clave.','Fecha de revisión en 30 días.'],
gl:[['Apalancamiento','Multiplicar el resultado a través del trabajo de otros.'],['1:1','Reunión individual periódica entre gerente y colaborador.'],['SCI','Situación, comportamiento, impacto.']],

/* BLOQUE 5 · Dirigir la empresa (parte 2) */
M.push(
{id:'organizacion',b:'b5',t:'Estructura y equipo directivo',s:'Un gerente solo no escala',min:45,
why:'Necesitas un equipo directivo que dirija cada área para que tú dirijas la empresa.',
L:[
{t:'La estructura sigue a la estrategia',p:[
'Alfred Chandler, historiador de empresas, mostró que la estructura debe seguir a la estrategia. Si la estrategia es crecer en servicios gestionados, la estructura necesita un área de servicios con responsable propio.',
'Para un integrador de tamaño mediano, las funciones típicas son: comercial, preventa, implementación, servicios y soporte, y administración y finanzas. Cada una con un responsable que rinde cuentas al gerente.',
'El error habitual en empresas que crecen es que todo pasa por una o dos personas. Funciona con 10 personas. Con 30 se vuelve el cuello de botella de la empresa.'],
ex:{t:'Organigrama funcional (ejemplo)',rows:[['Gerente general','Estrategia, accionistas, cuentas clave, fabricantes'],['Comercial','Pipeline, cuentas, precios'],['Preventa','Arquitectura y propuestas técnicas'],['Implementación','Proyectos, PMs, ingenieros'],['Servicios y soporte','Contratos recurrentes, mesa de servicio, monitoreo'],['Administración y finanzas','Contabilidad, cobranza, RUP, nómina']]}},
{t:'Roles claros',p:[
'Cada rol se describe en una hoja: propósito del rol, resultados que entrega, decisiones que toma solo, decisiones que consulta y cómo se mide.',
'La matriz RACI ayuda en procesos donde participan varios: quién lo hace (responsable), quién responde por el resultado (aprobador, solo uno), a quién se consulta y a quién se informa.',
'Gino Wickman, en Traction, propone una prueba para cada persona en un rol: ¿lo entiende, lo quiere y tiene la capacidad para hacerlo? Si falta una, hay que actuar.'],
},
{t:'Equipo directivo y compensación',p:[
'El equipo directivo son 3 a 5 personas que dirigen áreas y se reúnen contigo cada semana. Toman decisiones como equipo de la empresa, no como defensores de su área.',
'La compensación debe premiar lo que la persona controla. Un comercial, por utilidad bruta vendida y no solo por venta. Un responsable de servicios, por ingreso recurrente y satisfacción. Un responsable de implementación, por margen real de proyectos y plazos.',
'Diseña el organigrama de 2028 antes que el de hoy. Te dice a quién desarrollar y a quién contratar.'],
}
],
err:['Seguir siendo gerente y PM principal al mismo tiempo.','Crear cargos sin responsabilidades claras.','Pagar comisiones por venta sin mirar margen.','Diseñar la estructura alrededor de las personas actuales y no de la estrategia.'],
core:['Como gerente no puedes ser también el PM principal.','Christian Flores y Christian Quinde ya asumen responsabilidad técnica. Evalúa quién puede liderar implementación y servicios gestionados.','Diseña el organigrama de 2028, no el de hoy.'],
quiz:[
{q:'¿Qué debe seguir la estructura?',o:['A las personas actuales','A la estrategia','Al organigrama anterior'],a:1,e:'La estructura sirve para ejecutar la estrategia.'},
{q:'En una matriz RACI, ¿cuántos aprobadores debe haber por tarea?',o:['Todos los que participan','Uno','Ninguno'],a:1,e:'Un solo responsable final evita confusión.'},
{q:'¿Cómo conviene pagar a un comercial?',o:['Solo por venta','Por utilidad bruta vendida','Solo fijo'],a:1,e:'Premiar venta sin margen empuja descuentos.'}],
ex:'Organigrama actual y 2028.',steps:['Dibuja el organigrama actual con nombres.','Dibuja el de 2028 por funciones.','Marca los roles que faltan.','Para cada rol 2028: ¿quién puede crecer a él o hay que contratar?','Escribe la hoja de rol del primer cargo a cubrir.'],
gl:[['RACI','Responsable, aprobador, consultado, informado.'],['Equipo directivo','Responsables de área que dirigen la empresa con el gerente.']],
read:[['Traction','Gino Wickman','Sistema simple para organizar empresas medianas.','Capítulos sobre visión, personas y datos.']]},

{id:'negociacion',b:'b5',t:'Negociación',s:'Con fabricantes, clientes y tu equipo',min:50,
why:'El gerente negocia todo el día. Prepararse es la diferencia.',
L:[
{t:'Tu alternativa define tu poder',p:[
'Roger Fisher y William Ury, de Harvard, llamaron BATNA a la mejor alternativa a un acuerdo negociado: lo que harás si no hay acuerdo. Quien tiene una mejor alternativa negocia con más fuerza.',
'Antes de negociar, escribe tu alternativa y estima la del otro. Si no tienes alternativa, tu primer trabajo es crearla: otro fabricante, otro cliente, otro candidato.',
'El precio de reserva es el punto en el que prefieres tu alternativa. La zona de acuerdo existe si tu precio de reserva y el del otro se cruzan.'],
ex:{t:'Zona de acuerdo en una renovación',rows:[['Tu precio objetivo','$60.000'],['Tu precio de reserva','$48.000 (debajo, prefieres no renovar)'],['Presupuesto máximo del cliente (estimado)','$55.000'],['Zona de acuerdo','$48.000 a $55.000'],['Tu ancla inicial','$62.000 con alcance ampliado']]}},
{t:'Intereses, no posiciones',p:[
'Una posición es lo que alguien pide: "quiero 15% de descuento". Un interés es por qué lo pide: presupuesto limitado, aprobación interna, quedar bien con su jefe, miedo a pagar de más.',
'Cuando entiendes el interés aparecen opciones que no pasan por el precio: pago en cuotas, alcance por fases, plazo más largo, un servicio adicional sin costo para ti.',
'Chris Voss, exnegociador del FBI, recomienda preguntas abiertas que empiezan con "cómo" o "qué": "¿Cómo podríamos hacer que esto funcione con su presupuesto?". Hacen que el otro piense en la solución.'],
},
{t:'Anclas y concesiones',p:[
'La primera cifra sobre la mesa influye en todo lo que sigue. Ese efecto se llama anclaje. Si tienes información, ancla primero y con justificación.',
'Las concesiones nunca son gratis. Cada cosa que das se cambia por algo: plazo, volumen, anticipo, referencia, caso de éxito o contrato más largo.',
'Haz concesiones decrecientes: si bajas 5%, luego 3% y luego 1%, el otro entiende que llegas al límite. Bajar siempre lo mismo invita a seguir pidiendo.',
'Con el sector público el precio es fijo por proceso. Lo que se negocia es alcance, cronograma y forma de entrega.'],
}
],
err:['Negociar sin alternativa.','Defender posiciones sin preguntar por intereses.','Dar concesiones sin pedir nada a cambio.','Anclar primero sin información.'],
core:['Con fabricantes negocia precio especial, fondos y plazo como paquete anual.','Con clientes públicos negocias alcance y cronograma, no precio.','Aumentos y roles también son negociaciones. Prepáralas igual.'],
quiz:[
{q:'¿Qué es BATNA?',o:['Tu precio objetivo','Tu mejor alternativa si no hay acuerdo','El presupuesto del cliente'],a:1,e:'Define cuánto poder tienes en la negociación.'},
{q:'El cliente pide 15% de descuento. ¿Qué haces primero?',o:['Aceptar','Preguntar qué hay detrás del pedido','Negarte'],a:1,e:'El interés abre opciones que no pasan por el precio.'},
{q:'¿Qué indica una secuencia de concesiones 5%, 3%, 1%?',o:['Que puedes seguir bajando','Que te acercas al límite','Nada'],a:1,e:'Concesiones decrecientes señalan el límite.'}],
ex:'Prepara una negociación real.',steps:['Elige la negociación: fabricante, cliente o equipo.','Escribe tu alternativa y estima la del otro.','Lista sus intereses probables.','Define tu ancla, objetivo y precio de reserva.','Lista 3 concesiones y qué pedirás por cada una.'],
gl:[['BATNA','Mejor alternativa a un acuerdo negociado.'],['Precio de reserva','Punto en el que prefieres tu alternativa.'],['Anclaje','Efecto de la primera cifra en la negociación.']],
read:[['Never Split the Difference','Chris Voss','Negociación práctica desde el FBI.','Capítulos 1 a 6.'],['Getting to Yes','Roger Fisher y William Ury','El método de Harvard.','Libro completo; es corto.']]},

{id:'cambio',b:'b5',t:'Gestión del cambio',s:'Que el equipo use lo que ya existe',min:45,
why:'Las herramientas internas existen. El problema es que no se usan siempre igual.',
L:[
{t:'Por qué falla el cambio',p:[
'John Kotter, de Harvard, estudió cientos de procesos de cambio y encontró que la mayoría falla por los mismos motivos: falta de urgencia, falta de aliados, visión poco clara, no celebrar avances y declarar victoria demasiado pronto.',
'La gente no resiste el cambio por mala voluntad. Lo resiste porque el camino actual es conocido y el nuevo exige esfuerzo sin beneficio claro para ella.',
'Por eso un cambio se diseña como un producto: para que el usuario lo adopte, tiene que ser útil, fácil y visible.'],
},
{t:'Jinete, elefante y camino',p:[
'Chip y Dan Heath usan una imagen simple. El **jinete** es la parte racional: necesita dirección clara. El **elefante** es la parte emocional: necesita motivación. El **camino** es el entorno: si es fácil, el cambio ocurre casi solo.',
'Para el jinete: instrucciones específicas. No "usen CoreTrack", sino "ningún proyecto se cierra sin postmortem en CoreTrack".',
'Para el elefante: mostrar el costo de no cambiar con un caso real y celebrar a quienes ya lo hacen.',
'Para el camino: que el paso correcto sea el más corto. Plantillas, recordatorios automáticos y campos obligatorios.'],
ex:{t:'Plan de cambio: cerrar proyectos con postmortem',rows:[['Jinete','Regla: sin postmortem en CoreTrack no hay cierre ni cobro final'],['Elefante','Mostrar un proyecto que repitió el mismo error dos veces'],['Camino','Plantilla de 5 campos, notificación automática al cerrar'],['Medición','% de proyectos cerrados con postmortem, publicado cada mes']]}},
{t:'Un hábito a la vez',p:[
'El error de los gerentes nuevos es lanzar diez cambios al mismo tiempo. El equipo no puede absorberlos y ninguno se consolida.',
'Mejor un hábito de sistema por trimestre, medido y publicado. Cuando se consolida, el siguiente. Como en ANKLA: el siguiente hábito se desbloquea cuando el anterior es estable.',
'Las victorias tempranas importan: un resultado visible en 30 días da credibilidad para el siguiente cambio.'],
}
],
err:['Anunciar el cambio y no medirlo.','Lanzar muchos cambios a la vez.','Culpar a las personas en vez de rediseñar el camino.','Declarar éxito antes de que el hábito se consolide.'],
core:['Tickets suspendidos por años y facturas sin vínculo a proyectos son un problema de adopción, no de herramienta.','Un solo hábito de sistema por trimestre.','Mide la adopción y publícala al equipo.'],
quiz:[
{q:'En el modelo de los Heath, ¿qué es el camino?',o:['La razón','La emoción','El entorno que facilita o dificulta el cambio'],a:2,e:'Si el camino es fácil, el cambio ocurre casi solo.'},
{q:'¿Cuántos cambios de hábito conviene lanzar por trimestre?',o:['Todos los necesarios','Uno, medido y publicado','Ninguno'],a:1,e:'Uno consolidado vale más que diez a medias.'},
{q:'¿Por qué falla la mayoría de los cambios según Kotter?',o:['Por falta de tecnología','Por falta de urgencia, aliados y seguimiento','Por falta de presupuesto'],a:1,e:'Los fallos son de liderazgo, no técnicos.'}],
ex:'Plan de cambio para un proceso real.',steps:['Elige el proceso.','Muestra la urgencia con un dato.','Identifica 2 aliados con influencia.','Diseña jinete, elefante y camino.','Define una victoria temprana en 30 días y cómo medirás la adopción.'],
gl:[['Gestión del cambio','Proceso para que una organización adopte nuevas formas de trabajar.'],['Adopción','Porcentaje de personas o casos que usan el nuevo proceso.']],
read:[['Switch','Chip y Dan Heath','Cómo cambiar cuando el cambio es difícil.','Libro completo.'],['Leading Change','John Kotter','Los 8 pasos del cambio organizacional.','Capítulos 1 a 4.']]},

{id:'gobierno',b:'b5',t:'Gobierno corporativo y sucesión',s:'Recibir el cargo con autoridad real',min:50,
why:'Vas a recibir la gerencia de una empresa con 20 años. Cómo se hace esa transición importa tanto como lo que hagas después.',
L:[
{t:'Los roles en una empresa',p:[
'Los **accionistas** son dueños: eligen administradores, aprueban estados financieros y deciden el destino de las utilidades en la junta general.',
'El **directorio**, si existe, supervisa la gestión, aprueba la estrategia y el presupuesto, y evalúa al gerente.',
'El **gerente general** ejecuta: dirige la operación y, normalmente, es el representante legal de la compañía. Su nombramiento se inscribe formalmente.',
'En empresas medianas y familiares estos roles suelen mezclarse: un accionista que también opera, un gerente que también es dueño. Eso funciona hasta que hay desacuerdos. Separar los roles con reglas claras evita conflictos.'],
},
{t:'Cómo se hace una sucesión',p:[
'Una sucesión bien hecha tiene un plan por escrito con etapas, fechas y decisiones que pasan al nuevo gerente en cada etapa.',
'Etapa típica 1: el sucesor asume áreas concretas (comercial, presupuesto). Etapa 2: asume la operación diaria con el gerente actual como respaldo. Etapa 3: asume la gerencia y el anterior pasa a un rol definido, como asesor o miembro del directorio. Etapa 4: transición completa.',
'El riesgo más común es el gerente con el cargo pero sin la autoridad: el anterior sigue aprobando, los clientes lo siguen llamando a él y el equipo no sabe a quién responder.',
'La protección es un acuerdo explícito: autoridad, límites de aprobación, compensación, metas y nuevo rol del gerente saliente.'],
ex:{t:'Plan de sucesión en 4 etapas (ejemplo)',rows:[['Etapa 1 · 6 meses','Asumes presupuesto, comité comercial y 3 fabricantes'],['Etapa 2 · 6 meses','Asumes la operación diaria; el gerente actual aprueba lo irreversible'],['Etapa 3 · nombramiento','Eres gerente general; el anterior pasa a asesor o directorio'],['Etapa 4 · 12 meses','Transición completa y evaluación con los accionistas']]}},
{t:'Informar y decidir con los accionistas',p:[
'Un informe mensual corto al directorio o a los accionistas construye confianza: números, riesgos, decisiones que necesitas y avance del plan.',
'Separa tres conversaciones que suelen mezclarse: el rol (qué decides y respondes), la compensación (fijo y variable) y la participación accionaria, si aplica. Cada una tiene su momento y sus criterios.',
'Si la transición todavía no tiene fechas ni etapas, propónlas tú. Llegar con un plan escrito muestra que piensas como gerente.'],
}
],
err:['Asumir el cargo sin acuerdo escrito de autoridad.','Mezclar en una sola conversación rol, sueldo y acciones.','Corregir al gerente saliente frente al equipo.','No informar a los accionistas hasta que hay un problema.'],
core:['Si la transición todavía no tiene fechas ni etapas, propónlas tú.','El riesgo más común: el gerente saliente sigue decidiendo y el nuevo tiene el cargo sin la autoridad.','Separa las conversaciones de rol, compensación y participación accionaria.'],
quiz:[
{q:'¿Quién aprueba los estados financieros anuales?',o:['El gerente','La junta de accionistas','El contador'],a:1,e:'Es una atribución de los dueños.'},
{q:'¿Cuál es el riesgo más común en una sucesión?',o:['Que el sucesor no sepa la parte técnica','Tener el cargo sin la autoridad real','Que suban los costos'],a:1,e:'Sin acuerdo explícito, la autoridad queda en otra persona.'},
{q:'¿Qué conviene hacer con rol, compensación y acciones?',o:['Negociarlos juntos','Separarlos en conversaciones distintas','No hablarlos'],a:1,e:'Cada tema tiene criterios distintos.'}],
ex:'Plan de sucesión en 4 etapas.',steps:['Lista las decisiones que hoy toma el gerente actual.','Distribúyelas en 4 etapas con fechas.','Define el nuevo rol del gerente saliente.','Escribe cómo se mide el avance de cada etapa.','Prepara la propuesta para los accionistas en una página.'],
gl:[['Junta general','Órgano de decisión de los accionistas.'],['Representante legal','Persona que actúa en nombre de la compañía.'],['Directorio','Órgano que supervisa la gestión.']],
read:[['Boards That Lead','Ram Charan, Dennis Carey y Michael Useem','Relación entre directorio y gerente.','Capítulos sobre sucesión y evaluación del gerente.'],['Family Business on the Couch','Manfred Kets de Vries y otros','Dinámicas en empresas familiares y sucesiones.','Capítulos sobre sucesión.']]},

{id:'crecimiento',b:'b5',t:'Crecimiento y adquisiciones',s:'Crecer más allá del Austro',min:50,
why:'Crecer es una decisión de capital: dónde pones el dinero y el tiempo de la empresa.',
L:[
{t:'Cuatro caminos para crecer',p:[
'Igor Ansoff ordenó las opciones de crecimiento en una matriz simple. **Penetración:** vender más de lo mismo a los clientes actuales. **Desarrollo de mercado:** lo mismo en nuevos mercados, como Quito o Guayaquil. **Desarrollo de producto:** nuevos servicios a clientes actuales. **Diversificación:** nuevos servicios en nuevos mercados.',
'El riesgo sube de izquierda a derecha. La penetración es la más segura; la diversificación, la más riesgosa.',
'Para Coresolutions, la combinación más natural es desarrollo de producto (servicios gestionados, IA) en la base actual, y luego llevar lo que funciona a nuevos mercados.'],
ex:{t:'Matriz de Ansoff para Coresolutions',rows:[['Penetración','Más proyectos y renovaciones en la base actual'],['Desarrollo de mercado','Infraestructura y seguridad en Quito y Guayaquil'],['Desarrollo de producto','Monitoreo gestionado, continuidad, IA a clientes actuales'],['Diversificación','IA on-premise para universidades fuera del Austro']]}},
{t:'Comprar en vez de construir',p:[
'Comprar cartera o una empresa pequeña da crecimiento inmediato: clientes, contratos y a veces personas. Hay integradores pequeños sin plan de sucesión cuyos dueños quieren retirarse.',
'Lo más sencillo de comprar es una cartera de contratos de soporte o servicios. Se paga sobre el ingreso recurrente y el riesgo principal es que los clientes no se queden.',
'Por eso conviene estructurar el pago: una parte al contado y otra atada a que los clientes renueven en 12 meses. Esto se llama earn-out.'],
ex:{t:'Compra de cartera con earn-out',rows:[['Cartera','$6.000 de MRR'],['Precio total','$120.000'],['Al contado','$50.000'],['A 12 meses','$70.000 si se renueva al menos 80% del MRR'],['Lectura','El vendedor comparte el riesgo de retención']]}},
{t:'Revisar antes de comprar',p:[
'La due diligence es la revisión antes de comprar. Lo que no revisas, lo pagas.',
'Revisa contratos (plazos, cláusulas de cambio de control, si son transferibles), clientes (concentración, satisfacción, cartera vencida), personas (quién sabe qué y si se queda), deudas y contingencias tributarias o laborales.',
'William Thorndike estudió a los gerentes que más valor crearon para sus accionistas. Su rasgo común: trataban cada decisión de capital como una inversión, comparando siempre contra la mejor alternativa, incluida no hacer nada.'],
}
],
err:['Crecer en ventas sin crecer en utilidad.','Abrir nuevas ciudades sin una razón para que te elijan.','Comprar sin revisar contratos ni personas clave.','Pagar todo al contado una cartera cuyos clientes pueden irse.'],
core:['Crecer en Quito y Guayaquil probablemente rinde más que abrir otro país.','Hay integradores pequeños sin plan de sucesión. Su cartera puede estar disponible.','Paga con estructura: parte al contado, parte atada a que los clientes se queden.'],
quiz:[
{q:'¿Cuál es la opción de crecimiento de menor riesgo en la matriz de Ansoff?',o:['Diversificación','Penetración de mercado','Desarrollo de mercado'],a:1,e:'Vender más de lo mismo a los clientes actuales.'},
{q:'¿Qué es un earn-out?',o:['Un descuento','Parte del pago condicionada a resultados futuros','Un préstamo'],a:1,e:'Comparte el riesgo con el vendedor.'},
{q:'¿Qué revisa una due diligence?',o:['Solo el precio','Contratos, clientes, personas, deudas y contingencias','Solo la marca'],a:1,e:'Lo que no revisas, lo pagas.'}],
ex:'Tres opciones de crecimiento 2027–2029.',steps:['Describe 3 opciones en la matriz de Ansoff.','Para cada una: inversión, riesgo, retorno esperado.','Calcula el VAN aproximado de la favorita.','Lista qué capacidades necesitas.','Elige una y justifícala en media página.'],
gl:[['Matriz de Ansoff','Modelo de 4 opciones de crecimiento.'],['Due diligence','Revisión antes de comprar una empresa o cartera.'],['Earn-out','Pago condicionado a resultados futuros.']],
read:[['The Outsiders','William Thorndike','Cómo los mejores gerentes deciden dónde poner el capital.','Introducción y 3 capítulos a elección.']]},

{id:'ia',b:'b5',t:'IA como ventaja de la empresa',s:'Tu diferencia frente a otros gerentes',min:45,
why:'Sabes construir con IA. Úsalo para operar mejor la empresa, no solo para vender.',
L:[
{t:'IA para operar',p:[
'Las empresas de servicios tienen mucho trabajo de texto y datos: propuestas, informes, actas, seguimiento de proyectos, análisis de horas y cartera. Ahí la IA ahorra horas reales.',
'El informe mensual de Quski es la prueba: un proceso manual que hoy es un sistema. Ese patrón se repite en propuestas, diagramas de proyecto, certificados y análisis operativos.',
'Ethan Mollick, de Wharton, recomienda empezar por tareas que ya haces, medir el antes y el después, y mantener a una persona revisando el resultado.'],
ex:{t:'Ahorro estimado por proceso (ilustrativo)',rows:[['Propuestas técnicas','6 h → 2 h por propuesta'],['Informes de monitoreo','8 h → 1 h por cliente al mes'],['Diagramas de proyecto','4 h → 1 h'],['Análisis de cartera y horas','Semanal en vez de trimestral']],note:'Mide los tuyos antes de comunicar ahorros.'}},
{t:'IA para vender',p:[
'Tienes dos líneas: CoreAI alrededor de ChatGPT Enterprise (Discovery, Launch, Adoption, Go y servicios opcionales) y la IA on-premise con cómputo propio.',
'Ambas son negocios de servicios. Se cobran con lógica de servicio: diagnóstico de precio fijo, implementación por proyecto, adopción y gestión mensual.',
'Cuida la forma de presentar la relación con fabricantes de IA. No presentes a Coresolutions como revendedor de OpenAI sin respaldo formal.'],
},
{t:'Reglas y medición',p:[
'Sin reglas, la IA genera riesgo: datos de clientes en herramientas no aprobadas, respuestas sin revisar, propiedad del contenido poco clara.',
'Una política de uso simple responde: qué herramientas están aprobadas, qué datos se pueden usar en cada una, quién revisa lo que sale hacia clientes y cómo se registra el uso.',
'Mide horas ahorradas, errores evitados e ingresos nuevos. Si no se mide, es entusiasmo y no gestión.'],
}
],
err:['Construir herramientas sin medir el ahorro.','Usar datos de clientes en herramientas no aprobadas.','Vender IA como producto y no como servicio.','Depender de una sola persona que entiende los sistemas de IA.'],
core:['El informe mensual de Quski es la prueba: un proceso manual convertido en sistema.','Lleva el mismo enfoque a propuestas, informes de proyecto y control de horas.','No presentes a Coresolutions como revendedor de OpenAI sin respaldo formal.'],
quiz:[
{q:'¿Por dónde conviene empezar con IA interna?',o:['Por la tarea más compleja','Por tareas que ya haces y puedes medir','Por un producto nuevo'],a:1,e:'Medir antes y después demuestra el valor.'},
{q:'¿Qué debe tener una política de uso de IA?',o:['Herramientas aprobadas, datos permitidos y revisión','Solo la lista de herramientas','Nada, mejor libertad total'],a:0,e:'Sin reglas, aparece el riesgo de datos.'},
{q:'¿Cómo se cobra mejor una oferta de IA empresarial?',o:['Como reventa de licencias','Como servicio: diagnóstico, proyecto y gestión mensual','Gratis para entrar'],a:1,e:'El valor está en el servicio.'}],
ex:'5 procesos internos para IA.',steps:['Lista 5 procesos con más horas de texto o datos.','Mide las horas actuales de cada uno.','Define herramienta y responsable.','Fija una meta de horas ahorradas.','Escribe la política de uso de IA en una página.'],
gl:[['Política de uso de IA','Reglas sobre herramientas, datos y revisión.'],['Humano en el circuito','Persona que revisa lo que produce la IA.']],
read:[['Co-Intelligence','Ethan Mollick','Trabajar y dirigir con IA en la práctica.','Libro completo.']]}
);

/* BLOQUE 6 · Integración */
M.push(
{id:'ritmo',b:'b6',t:'Ritmo de gestión',s:'El sistema operativo del gerente',min:45,
why:'Un gerente no gestiona con heroísmo. Gestiona con un ritmo fijo de reuniones, números y decisiones.',
L:[
{t:'Las reuniones del ritmo',p:[
'Verne Harnish, en Scaling Up, propone que las empresas que crecen bien tienen un ritmo de reuniones predecible. No más reuniones: reuniones mejores y siempre en el mismo momento.',
'**Semanal, 60 minutos.** Equipo directivo. Tablero de indicadores, pipeline, proyectos en riesgo, caja de las próximas semanas y bloqueos. Termina con decisiones y responsables.',
'**Mensual, medio día.** Cierre financiero, real contra presupuesto, un tema estratégico a fondo y aprendizajes del mes.',
'**Trimestral, un día.** Revisión de estrategia, prioridades del trimestre siguiente, revisión de personas y forecast del año.'],
ex:{t:'Agenda de la reunión semanal',rows:[['5 min','Una buena noticia por persona'],['15 min','Tablero: qué está en rojo'],['15 min','Pipeline y cuentas clave'],['15 min','Proyectos en riesgo y caja'],['10 min','Decisiones, responsables y fechas']]}},
{t:'El tablero',p:[
'Un tablero de gerente cabe en una pantalla. Si necesitas desplazarte, sobra algo.',
'Combina indicadores que miran atrás (utilidad, margen, cobranza) con indicadores que miran adelante (pipeline, cobertura, utilización). Los primeros dicen cómo te fue; los segundos, cómo te va a ir.',
'Cada indicador tiene meta, dueño y color de estado. El rojo genera una acción en la reunión semanal, no una explicación.',
'Tus apps Glide y automatizaciones pueden alimentar el tablero sin trabajo manual. Es el mejor uso de tu capacidad de construir.'],
},
{t:'Prioridades trimestrales',p:[
'Cada trimestre, el equipo directivo elige 3 a 5 prioridades de empresa. Cada una con dueño, resultado medible y fecha.',
'Una prioridad bien escrita se puede verificar al final del trimestre con un sí o un no. "Mejorar la cobranza" no se verifica. "Cartera mayor a 90 días bajo $50.000 al 31 de marzo" sí.',
'La prueba final: cualquier persona del equipo debe poder explicar la prioridad principal de la empresa en una frase.'],
}
],
err:['Reuniones sin agenda fija ni decisiones.','Tableros con 40 indicadores.','Prioridades que no se pueden verificar.','Cancelar el ritmo cuando hay presión, que es cuando más se necesita.'],

{id:'final',b:'b6',t:'Proyecto final: plan de gerencia',s:'Lo que presentarás a los accionistas',min:120,
why:'Todo el programa termina en un documento que podrías presentar a los accionistas mañana.',
L:[
{t:'Qué contiene el plan',p:[
'**Tesis.** Qué empresa será Coresolutions en 3 años, en un párrafo. Dónde juega, cómo gana y qué deja de hacer.',
'**Diagnóstico.** Situación financiera, comercial, operativa y de personas, con números.',
'**Números.** Presupuesto a 3 años, mezcla de ingresos objetivo, proyección de caja y valor esperado de la empresa.',
'**Organización.** Organigrama 2028, equipo directivo y plan de personas.',
'**Riesgos.** Los 5 principales con su respuesta.',
'**Primeros 90 días.** Qué haces desde el primer día como gerente.',
'**Pedidos.** Qué necesitas de los accionistas: autoridad, presupuesto, plazos.'],
},
{t:'Cómo armarlo',p:[
'No empiezas de cero. Cada módulo dejó un entregable que es una pieza del plan: el diagnóstico financiero, el presupuesto, la estrategia, el mapa de mercado, la mezcla objetivo, el organigrama, el plan de sucesión.',
'Haz dos versiones. Una de una página para abrir la conversación y otra de máximo 10 páginas con el detalle.',
'Preséntalo primero a un mentor externo que haya dirigido una empresa. Sus preguntas te preparan para las de los accionistas.'],
ex:{t:'De qué módulo sale cada parte',rows:[['Tesis','Estrategia · Modelos de negocio · Tendencias'],['Diagnóstico','Contabilidad · Caja · Mercado · Operaciones'],['Números','Presupuesto · Inversiones · Valuación'],['Organización','Estructura · Personas · Gobierno'],['Riesgos','Marco legal · Contratación pública · Energía'],['90 días','De PM a gerente · Ritmo']]}},
{t:'Cómo presentarlo',p:[
'Empieza por la recomendación: qué empresa propones construir y qué necesitas para lograrlo. Después los números. Después el detalle.',
'Prepara las tres preguntas más difíciles que te pueden hacer y su respuesta. Normalmente son sobre caja, riesgo y personas.',
'Termina con un pedido concreto y una fecha. Una presentación sin pedido es información; con pedido es una decisión.'],
}
],
err:['Presentar un plan sin números.','Llevar 40 diapositivas.','No anticipar las preguntas difíciles.','Terminar sin un pedido concreto.'],

{q:'¿Qué convierte una presentación en una decisión?',o:['Buen diseño','Un pedido concreto con fecha','Muchos datos'],a:1,e:'Sin pedido, es solo información.'},
